name: Stage 17 classification-version hardening

on:
  push:
    branches:
      - agent/stage17-reviewed-overlay
    paths:
      - .github/workflows/stage17-version-hardening.yml

permissions:
  contents: write

concurrency:
  group: stage17-classification-version-hardening
  cancel-in-progress: false

jobs:
  harden-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: ec62358d3754bc8eeba87f9f681c62436c2cdd0a
      EXPECTED_CANDIDATE_SHA: 222bf482e076c070c7f380997267f693edaa075e
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage17-reviewed-overlay
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact hardening base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Bind classification envelope versions to the exact target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/reviewed-overlay.ts")
          text = path.read_text(encoding="utf-8")
          old_signature = "\n".join([
              "function metadataMatches(",
              "  source: EvidencedValue<unknown>,",
              "  snapshot: ReviewSnapshot,",
              "): boolean {",
          ])
          new_signature = "\n".join([
              "function metadataMatches(",
              "  source: EvidencedValue<unknown>,",
              "  snapshot: ReviewSnapshot,",
              "  target: ReviewApplicationTarget,",
              "): boolean {",
          ])
          if text.count(old_signature) != 1:
              raise SystemExit("Stage 17 metadata signature marker mismatch")
          text = text.replace(old_signature, new_signature, 1)

          old_ai = "\n".join([
              "  const containsAiEvidence = source.evidence.some(",
              '    (item) => item.method === "ai_candidate",',
              "  );",
          ])
          new_ai = old_ai + "\n" + "\n".join([
              "  const versionedSource = source as EvidencedValue<unknown> & {",
              "    normalizerVersion?: string;",
              "    registryVersion?: string;",
              "  };",
              "  const normalizerMatches =",
              "    versionedSource.normalizerVersion === undefined ||",
              "    versionedSource.normalizerVersion ===",
              "      target.versionKey.normalizerVersion;",
              "  const registryMatches =",
              "    versionedSource.registryVersion === undefined ||",
              "    versionedSource.registryVersion === target.versionKey.registryVersion;",
          ])
          if text.count(old_ai) != 1:
              raise SystemExit("Stage 17 metadata AI marker mismatch")
          text = text.replace(old_ai, new_ai, 1)

          old_return = "\n".join([
              "    holdReason === snapshot.holdReason &&",
              "    containsAiEvidence === snapshot.containsAiEvidence",
          ])
          new_return = "\n".join([
              "    holdReason === snapshot.holdReason &&",
              "    containsAiEvidence === snapshot.containsAiEvidence &&",
              "    normalizerMatches &&",
              "    registryMatches",
          ])
          if text.count(old_return) != 1:
              raise SystemExit("Stage 17 metadata return marker mismatch")
          text = text.replace(old_return, new_return, 1)

          old_call = "if (!metadataMatches(source, snapshot))"
          new_call = "if (!metadataMatches(source, snapshot, target))"
          if text.count(old_call) != 1:
              raise SystemExit("Stage 17 metadata call marker mismatch")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Add classification-version regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/reviewed-overlay.test.ts")
          text = path.read_text(encoding="utf-8")
          marker = '  it("routes only fixed fields and stable tag categories", () => {'
          if text.count(marker) != 1:
              raise SystemExit("Stage 17 classification test insertion marker mismatch")
          lines = [
              '  it("binds classification source versions to the exact review target", () => {',
              "    const classificationTarget = target({",
              '      entityType: "booth_product",',
              "      entityId: target().productId,",
              '      fieldPath: "classification",',
              "    });",
              "    const exactClassification = {",
              '      ...source("scenario_single" as const),',
              '      normalizerVersion: "normalizer-v1",',
              '      registryVersion: "registry-v1",',
              "    };",
              "    const exactSnapshot = snapshot({",
              "      versionKey: { ...classificationTarget.versionKey },",
              "    });",
              "    expect(",
              "      materializeReviewedEnvelope(",
              "        exactClassification,",
              "        exactSnapshot,",
              '        projection("approved", classificationTarget),',
              "        classificationTarget,",
              "      ),",
              '    ).toMatchObject({ state: "materialized" });',
              "",
              "    for (const staleClassification of [",
              "      { ...exactClassification, normalizerVersion: \"normalizer-v2\" },",
              "      { ...exactClassification, registryVersion: \"registry-v2\" },",
              "    ])",
              "      expect(",
              "        materializeReviewedEnvelope(",
              "          staleClassification,",
              "          exactSnapshot,",
              '          projection("approved", classificationTarget),',
              "          classificationTarget,",
              "        ),",
              '      ).toMatchObject({ state: "omitted", reason: "metadata_mismatch" });',
              "  });",
              "",
          ]
          text = text.replace(marker, "\n".join(lines) + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and remove hardening transport
        run: |
          set -euo pipefail
          npm run format
          rm -f .github/workflows/stage17-version-hardening.yml

      - name: Verify exact hardening scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/stage17-version-hardening.yml",
              "src/reviewed-overlay.ts",
              "src/reviewed-overlay.test.ts",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          changed = committed | working
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"unexpected hardening paths: {unexpected}")
          if missing:
              raise SystemExit(f"required hardening paths did not change: {missing}")
          PY

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git checkout -- tsconfig.json

      - name: Run source guards and browser regression
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          trap 'mv "$RUNNER_TEMP/node_modules" node_modules 2>/dev/null || true' EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          mv "$RUNNER_TEMP/node_modules" node_modules
          trap - EXIT
          python -m unittest discover -s tests
          npx playwright install --with-deps chromium
          npm run test:e2e
          git checkout -- tsconfig.json

      - name: Publish exact hardened candidate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/stage17-version-hardening.yml
          grep -q 'normalizerMatches' src/reviewed-overlay.ts
          grep -q 'classification source versions' src/reviewed-overlay.test.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/reviewed-overlay.ts src/reviewed-overlay.test.ts
          git add -u .github/workflows/stage17-version-hardening.yml
          git commit -m 'fix(review): bind classification overlay versions for issue 117'
          git push origin HEAD:agent/stage17-reviewed-overlay
