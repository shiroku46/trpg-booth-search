name: Stage 25 Guard Fix

on:
  push:
    branches:
      - fix/stage25-public-export-guard-generated-trees

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage25-public-export-guard-generated-trees
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Fix guard traversal and add regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guard = Path('scripts/public_export_guard.py')
          text = guard.read_text(encoding='utf-8')
          old = 'SKIP_PARTS = {".git", "__pycache__", ".pytest_cache"}\n'
          new = '''SKIP_PARTS = {\n    ".git",\n    "__pycache__",\n    ".pytest_cache",\n    "node_modules",\n    ".next",\n    "test-results",\n    "playwright-report",\n    "coverage",\n    ".turbo",\n}\nSELF_PATHS = {"scripts/public_export_guard.py"}\n'''
          if old not in text:
              raise SystemExit('expected SKIP_PARTS declaration not found')
          text = text.replace(old, new, 1)
          old_exclusion = '''        if path.relative_to(root).as_posix() in {"scripts/public_export_guard.py", "tests/test_export_guard.py"}:\n            continue\n'''
          new_exclusion = '''        if path.relative_to(root).as_posix() in SELF_PATHS:\n            continue\n'''
          if old_exclusion not in text:
              raise SystemExit('expected self exclusion not found')
          guard.write_text(text.replace(old_exclusion, new_exclusion, 1), encoding='utf-8')

          tests = Path('tests/test_public_export_guard_target.py')
          text = tests.read_text(encoding='utf-8')
          insert = r'''

class TestGeneratedAndDependencyTreesIgnored(unittest.TestCase):
    """Installed dependencies and generated outputs are not repository export source."""

    def test_known_generated_trees_ignore_sensitive_dependency_text(self):
        ignored_parts = (
            "node_modules",
            ".next",
            "test-results",
            "playwright-report",
            "coverage",
            ".turbo",
        )
        sensitive_value = "api" + "_key = " + "Z" * 24
        for ignored in ignored_parts:
            with self.subTest(ignored=ignored):
                with tempfile.TemporaryDirectory() as tmp:
                    root = Path(tmp)
                    _write_generated_target(root)
                    _write(root / ignored / "nested" / "generated.md", sensitive_value)
                    findings = scan(root)
                    self.assertFalse(
                        any("credential-value" in finding for finding in findings),
                        findings,
                    )

    def test_repository_owned_source_remains_fail_closed(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            _write_generated_target(root)
            sensitive_value = "api" + "_key = " + "Z" * 24
            _write(root / "src" / "config.txt", sensitive_value)
            findings = scan(root)
            self.assertTrue(
                any(
                    "src/config.txt" in finding and "credential-value" in finding
                    for finding in findings
                )
            )

    def test_ignored_tree_name_only_skips_that_tree(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            _write_generated_target(root)
            sensitive_value = "api" + "_key = " + "Z" * 24
            _write(root / "node_modules" / "dependency.md", sensitive_value)
            _write(root / "docs" / "node_modules-notes.md", sensitive_value)
            findings = scan(root)
            self.assertFalse(
                any("node_modules/dependency.md" in finding for finding in findings)
            )
            self.assertTrue(
                any(
                    "docs/node_modules-notes.md" in finding
                    and "credential-value" in finding
                    for finding in findings
                )
            )
'''
          marker = '\n\nclass TestIsGeneratedTarget(unittest.TestCase):\n'
          if 'class TestGeneratedAndDependencyTreesIgnored' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, insert + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Validate guard after dependency installation
        run: |
          npm ci
          python -m unittest tests.test_public_export_guard_target
          python -m unittest discover -s tests
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
      - name: Preserve Node gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/public_export_guard.py tests/test_public_export_guard_target.py
          git commit -m "fix(guard): ignore dependency and generated trees"
          git push origin HEAD:fix/stage25-public-export-guard-generated-trees
