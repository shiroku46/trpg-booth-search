name: Stage 33 Vercel Policy Once

on:
  push:
    branches:
      - chore/stage33-vercel-main-only

permissions: {}

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: chore/stage33-vercel-main-only
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Record Stage 33 deployment policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text(encoding='utf-8')
          section = '''\n\n## D-050 — Automatic Vercel Git deployments are main-only\n\n**Decision:** Automatic Vercel deployments from the connected Git repository are enabled for `main` and disabled for all other branches. The repository expresses this with `git.deploymentEnabled` rules `{"main": true, "*": false}` in `vercel.json`; Vercel's documented overlapping-rule semantics allow `main` because its matching `true` rule wins while non-main branches match only the wildcard `false`.\n\n**Rationale:** The autonomous GitHub-direct workflow creates short-lived branches and validation commits. Automatic preview deployment for every push exhausted the Vercel free-plan daily deployment allowance and produced repeated failure notifications without adding value to non-visual stages. Vercel officially supports branch-specific `git.deploymentEnabled` rules and manual deployments from a Git reference when a specific visual preview is needed.\n\n**Consequences:** merges to `main` continue to deploy automatically; implementation/PR branches do not. A future visual checkpoint may request a manual deployment or a separately reviewed temporary branch rule. Existing security headers, provider/project identity, domains, Secrets, billing, and application behavior are unchanged.\n'''
          if '## D-050 — Automatic Vercel Git deployments are main-only' not in text:
              decisions.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          section = '''\n\n## Stage 33 — Main-only automatic Vercel deployments\n\n- [x] Keep automatic Vercel Git deployment enabled for `main`.\n- [x] Disable automatic deployment for every non-main branch.\n- [x] Preserve all existing preview security headers.\n- [x] Add deterministic tests for the branch rules and header invariants.\n- [x] Retain manual Git-reference deployment as the explicit visual-checkpoint escape hatch.\n- [x] Add no token, deploy hook, paid plan, provider mutation, or application behavior change.\n'''
          if '## Stage 33 — Main-only automatic Vercel deployments' not in text:
              roadmap.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - run: python -m unittest tests.test_vercel_deployment_policy
      - run: python -m unittest discover -s tests
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit Stage 33 docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DECISIONS.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(vercel): record main-only deployment budget policy"
          git push origin HEAD:chore/stage33-vercel-main-only
