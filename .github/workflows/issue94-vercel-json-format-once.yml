name: Issue 94 Vercel JSON Format Once

on:
  push:
    branches:
      - fix/issue-94-vercel-json-header
    paths:
      - .github/workflows/issue94-vercel-json-format-once.yml

permissions:
  contents: write

concurrency:
  group: issue-94-vercel-json-format-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/issue-94-vercel-json-header
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Apply repository-pinned formatting
        run: |
          npx prettier --write src/ui/preview-contract.test.ts
          git diff --check
          test "$(git diff --name-only)" = "src/ui/preview-contract.test.ts"
          npm run format:check
      - name: Commit exact formatting change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/preview-contract.test.ts
          git commit -m "style(issue94): format Vercel contract test"
          git push origin HEAD:fix/issue-94-vercel-json-header
