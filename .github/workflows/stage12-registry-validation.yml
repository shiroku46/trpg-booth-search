name: Stage 12 initial registry validation

on:
  push:
    branches:
      - agent/stage12-initial-registry-v1
    paths:
      - .github/workflows/stage12-registry-validation.yml

permissions:
  contents: write

concurrency:
  group: stage12-initial-registry-validation
  cancel-in-progress: false

jobs:
  document-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage12-initial-registry-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Align accepted specifications with registry v1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacement(s), found {count}")
              file.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace(
              "docs/SYSTEM_NORMALIZATION.md",
              "This document does not populate a production registry, create a database schema, or implement any application type. It does not assert unverified external facts about individual commercial systems, editions, or books. Illustrative placeholders (e.g., `sf-<token>`) are used where examples are necessary.",
              "This specification does not itself create a database schema, hosted seed, or public application integration. The first reviewed repository registry is recorded separately in [REGISTRY_INITIAL_V1.md](REGISTRY_INITIAL_V1.md), `registry/initial-v1.json`, and `src/registry.ts`. Those entries use reviewed first-party identity evidence and remain disconnected from the synthetic fixture Preview and hosted persistence until a later authorized Issue integrates them.",
          )
          replace(
              "docs/SYSTEM_NORMALIZATION.md",
              "Cross-links: [PRODUCT_REQUIREMENTS.md](PRODUCT_REQUIREMENTS.md) | [DECISIONS.md](DECISIONS.md) | [DATA_COLLECTION_POLICY.md](DATA_COLLECTION_POLICY.md) | [BOOTH_COLLECTION_RESEARCH.md](BOOTH_COLLECTION_RESEARCH.md) | [ROADMAP.md](ROADMAP.md)",
              "Cross-links: [PRODUCT_REQUIREMENTS.md](PRODUCT_REQUIREMENTS.md) | [DECISIONS.md](DECISIONS.md) | [DATA_COLLECTION_POLICY.md](DATA_COLLECTION_POLICY.md) | [BOOTH_COLLECTION_RESEARCH.md](BOOTH_COLLECTION_RESEARCH.md) | [REGISTRY_INITIAL_V1.md](REGISTRY_INITIAL_V1.md) | [ROADMAP.md](ROADMAP.md)",
          )

          replace(
              "docs/DATA_MODEL.md",
              "- Test fixtures, canonical registry records, or populated data\n\nNo actual TRPG systems, editions, books, products, shops, or creators are introduced. The canonical registry remains empty.",
              "- Test fixtures or production database seed rows\n\nThis logical document does not itself populate canonical records. The first reviewed repository-only identity registry is defined separately in [REGISTRY_INITIAL_V1.md](REGISTRY_INITIAL_V1.md) and `registry/initial-v1.json`. It is not a hosted seed, BOOTH collection result, or fixture-Preview data source; product, shop, creator, and scenario records remain absent.",
          )
          replace(
              "docs/DATA_MODEL.md",
              "Cross-links: [PRODUCT_REQUIREMENTS.md](PRODUCT_REQUIREMENTS.md) | [DECISIONS.md](DECISIONS.md) | [ROADMAP.md](ROADMAP.md) | [SYSTEM_NORMALIZATION.md](SYSTEM_NORMALIZATION.md) | [DATA_COLLECTION_POLICY.md](DATA_COLLECTION_POLICY.md) | [LEGAL_AND_COMPLIANCE.md](LEGAL_AND_COMPLIANCE.md)",
              "Cross-links: [PRODUCT_REQUIREMENTS.md](PRODUCT_REQUIREMENTS.md) | [DECISIONS.md](DECISIONS.md) | [ROADMAP.md](ROADMAP.md) | [SYSTEM_NORMALIZATION.md](SYSTEM_NORMALIZATION.md) | [REGISTRY_INITIAL_V1.md](REGISTRY_INITIAL_V1.md) | [DATA_COLLECTION_POLICY.md](DATA_COLLECTION_POLICY.md) | [LEGAL_AND_COMPLIANCE.md](LEGAL_AND_COMPLIANCE.md)",
          )

          decisions = Path("docs/DECISIONS.md")
          text = decisions.read_text(encoding="utf-8")
          text = text.replace(
              "Decisions D-001 through D-033 are accepted",
              "Decisions D-001 through D-034 are accepted",
              1,
          )
          marker = "\n---\n\n## Pending Decisions\n"
          if text.count(marker) != 1:
              raise SystemExit("docs/DECISIONS.md: pending marker mismatch")
          d034 = '''
          ### D-034 — Reviewed initial canonical registry v1

          **Decision date:** 2026-08-06.

          `registry-2026-08-06.1` is the first accepted provider-neutral identity registry. It contains four immutable `system_family` records, four reviewed `edition` records, eight bounded `book` records, and twenty-three approved alias records. The inclusion set is architecture-driven: multiple editions, an editionless Web-rule system, a revised rulebook, and a family/edition with multiple core volumes. It is not a popularity, rating, recommendation, sales, or completeness claim.

          Canonical IDs remain separate from Japanese labels. Source-observed aliases preserve original text and carry official evidence URL/location, confidence, review state, observation dates, normalizer version, and generated comparison key. `system-normalizer-v1` applies the accepted NFC, width, case, whitespace, and punctuation pipeline without rewriting source text. Resolution is target-type-aware; cross-type matches remain `ambiguous`, same-type collisions become `hold_alias_conflict`, and unregistered text returns `no_match`. No resolver may guess a preferred edition or book.

          Version 1 accepts identity facts only from the first-party KADOKAWA CoC pages, TEAM DICETOUS Emoklore pages, 冒険企画局 Shinobigami pages, and Group SNE/KADOKAWA Sword World pages listed in [REGISTRY_INITIAL_V1.md](REGISTRY_INITIAL_V1.md). It stores no exact price, currency, image, copied description, popularity signal, user data, or BOOTH product record.

          The registry is repository data and deterministic code only. It is not a PostgreSQL seed, hosted resource, live collector input, or authorization to replace the synthetic fixture Preview. Collection, persistence seeding, and public-filter integration each require a later reviewed Issue. This resolves former PD-007 through Issue #105.
          '''
          text = text.replace(marker, "\n" + d034.strip() + marker, 1)
          text, removed = re.subn(
              r"\n### PD-007 — Initial registry contents\n\n.*?(?=\n### PD-010 —)",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit("docs/DECISIONS.md: PD-007 removal mismatch")
          old_row = "| PD-008 provider-specific model design | Design resolved by D-027–D-030; executable ORM/migration/provisioning remains later implementation. |"
          new_row = old_row + "\n| PD-007 initial registry contents | Resolved by D-034 and [REGISTRY_INITIAL_V1.md](REGISTRY_INITIAL_V1.md); collection, hosted seeding, and public UI integration remain separate later Issues. |"
          if text.count(old_row) != 1:
              raise SystemExit("docs/DECISIONS.md: resolved-map row mismatch")
          text = text.replace(old_row, new_row, 1)
          decisions.write_text(text, encoding="utf-8")

          roadmap = Path("docs/ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          stage11 = "Issue #101 resolves the non-exact Free-first evidence contract and implements fail-closed ordering over the existing `is_free` evidence envelope. It may change order only: exact price remains prohibited, unknown/hold/missing evidence is never treated as paid or false, persistence preserves each state, and all existing publication and Design B boundaries remain binding. No provider, BOOTH request, Secret, deployment, billing, schema migration, or human action is required."
          if text.count(stage11) != 1:
              raise SystemExit("docs/ROADMAP.md: Stage 11 marker mismatch")
          stage12 = '''

          ## Stage 12 repository delivery — 2026-08-06

          Issue #105 resolves the initial-registry decision with `registry-2026-08-06.1`: four system families, four editions, eight books, and twenty-three approved aliases backed by bounded first-party identity evidence. The repository now has deterministic comparison-key normalization, target-aware resolution, reference/domain validation, and fail-closed ambiguity/collision states.

          The fixture Preview remains synthetic and unchanged. Stage 12 creates no BOOTH request, production seed, schema migration, hosted resource, provider, Secret, exact-price field, popularity/rating/recommendation signal, or public registry filter. Collection and integration remain later separately authorized stages.
          '''
          text = text.replace(stage11, stage11 + stage12, 1)
          roadmap.write_text(text, encoding="utf-8")
          PY
      - name: Format TypeScript sources
        run: npm run format
      - name: Verify exact Stage 12 allowlist
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess

          allowed = {
              "registry/initial-v1.json",
              "src/registry.ts",
              "src/registry.test.ts",
              "docs/REGISTRY_INITIAL_V1.md",
              "docs/SYSTEM_NORMALIZATION.md",
              "docs/DATA_MODEL.md",
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
          }
          transport = {".github/workflows/stage12-registry-validation.yml"}
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          changed = committed | working
          unexpected = sorted(changed - allowed - transport)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Stage 12 paths did not change: {missing}")
          status = subprocess.check_output(
              ["git", "diff", "--name-status", "origin/main...HEAD"], text=True
          ) + subprocess.check_output(["git", "diff", "--name-status"], text=True)
          if any(line.startswith(("R", "C")) for line in status.splitlines()):
              raise SystemExit("renames or copies are outside the Stage 12 allowlist")
          PY
      - name: Run format, lint, type, and product tests
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Run repository guards without dependency-tree false positives
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          restore_dependencies() {
            if [ -d "$RUNNER_TEMP/node_modules" ] && [ ! -d node_modules ]; then
              mv "$RUNNER_TEMP/node_modules" node_modules
            fi
          }
          trap restore_dependencies EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          restore_dependencies
          trap - EXIT
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests
      - name: Build production application
        run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify unchanged Design B browser suite
        run: npm run test:e2e
      - name: Remove validation transport and publish verified docs/format
        run: |
          set -euo pipefail
          rm .github/workflows/stage12-registry-validation.yml
          git checkout -- tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/initial-v1.json src/registry.ts src/registry.test.ts docs/REGISTRY_INITIAL_V1.md docs/SYSTEM_NORMALIZATION.md docs/DATA_MODEL.md docs/DECISIONS.md docs/ROADMAP.md
          git add -u .github/workflows/stage12-registry-validation.yml
          if git diff --cached --quiet; then
            echo 'No post-validation changes to publish.'
          else
            git commit -m 'docs(registry): accept initial reviewed registry v1 for issue 105'
            git push origin HEAD:agent/stage12-initial-registry-v1
          fi
