name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Immutable commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-lock:
    name: publish trusted lockfile
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'recovery/stage5-durable-c126e0ef' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '297d15c3c71b352dcf4d9fd20f62ed34f458a201'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Generate and validate complete lockfile
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('package-lock.json').read_text())
          assert lock['lockfileVersion'] == 3
          assert len(lock['packages']) > 1
          root = lock['packages']['']
          assert root['dependencies'] == {'next': '16.2.11', 'react': '19.2.8', 'react-dom': '19.2.8'}
          assert root['devDependencies']['typescript'] == '7.0.2'
          PY
          paths="$(git diff --name-only)"
          if [[ -z "$paths" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$paths" == 'package-lock.json' ]]
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish lockfile to exact PR branch
        if: steps.lock.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Stage 5: publish trusted complete package lock'
          git push origin HEAD:refs/heads/recovery/stage5-durable-c126e0ef

  validate:
    name: validate
    needs: publish-lock
    if: needs.publish-lock.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REF: ${{ inputs.target_ref || github.event.pull_request.head.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Parse complete workflow YAML streams with runner-provided Ruby
        run: |
          ruby -e 'require "psych"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| documents = Psych.parse_stream(File.read(path)).children; raise "#{path}: expected exactly one YAML document" unless documents.length == 1; puts "parsed #{path}" }'
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
