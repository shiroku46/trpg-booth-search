name: Stage 17 reviewed-overlay retry

on:
  push:
    branches:
      - agent/stage17-reviewed-overlay
    paths:
      - .github/workflows/stage17-retry.yml

permissions:
  contents: write

concurrency:
  group: stage17-reviewed-overlay-retry
  cancel-in-progress: false

jobs:
  repair-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: ec62358d3754bc8eeba87f9f681c62436c2cdd0a
      EXPECTED_TRANSPORT_SHA: 5426e898a746e9154dee03e0a1ff847cd7b73919
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage17-reviewed-overlay
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact retry base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TRANSPORT_SHA"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Replay Stage 17 implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          workflow = Path(".github/workflows/stage17-validation.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()

          def extract(name: str) -> str:
              marker = f"      - name: {name}"
              try:
                  index = lines.index(marker)
              except ValueError as exc:
                  raise SystemExit(f"missing source workflow step: {name}") from exc
              index += 1
              while index < len(lines) and lines[index] != "        run: |":
                  index += 1
              if index >= len(lines):
                  raise SystemExit(f"missing run block for source workflow step: {name}")
              index += 1
              output: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line.startswith("      - "):
                      break
                  if not line:
                      output.append("")
                  elif line.startswith("          "):
                      output.append(line[10:])
                  else:
                      raise SystemExit(
                          f"unexpected source workflow indentation in {name}: {line!r}"
                      )
                  index += 1
              return "\n".join(output) + "\n"

          for number, name in enumerate(
              [
                  "Add immutable reviewed overlay domain",
                  "Add persistence read service and end-to-end regression",
                  "Update Stage 17 documentation",
              ],
              start=1,
          ):
              script = Path(os.environ["RUNNER_TEMP"]) / f"stage17-replay-{number}.sh"
              script.write_text(extract(name), encoding="utf-8")
              subprocess.run(
                  ["bash", "-euo", "pipefail", str(script)],
                  check=True,
                  env=os.environ.copy(),
              )
          PY

      - name: Repair generic evidence fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/reviewed-overlay.test.ts")
          text = path.read_text(encoding="utf-8")

          old_helper = '''const source = (\n  overrides: Partial<EvidencedValue<string>> = {},\n): EvidencedValue<string> => ({\n  state: "known",\n  value: "テスト版",\n  confidence: "high",\n  reviewState: "unreviewed",\n  evidence: [{ pointer: "synthetic", method: "ai_candidate" }],\n  contentVersion: "content-v1",\n  checkedAt: "2026-08-06T00:00:00Z",\n  ...overrides,\n});'''
          new_helper = '''type KnownOptions = {\n  confidence?: "high" | "medium" | "low" | "unresolved";\n  reviewState?:\n    | "unreviewed"\n    | "approved"\n    | "rejected"\n    | "needs_more_evidence";\n  evidence?: EvidencedValue<unknown>["evidence"];\n  contentVersion?: string;\n  checkedAt?: string;\n  conflictReason?: string;\n};\n\nconst source = <T = string>(\n  value: T = "テスト版" as T,\n  options: KnownOptions = {},\n): EvidencedValue<T> => ({\n  state: "known",\n  value,\n  confidence: options.confidence ?? "high",\n  reviewState: options.reviewState ?? "unreviewed",\n  evidence:\n    options.evidence ?? [{ pointer: "synthetic", method: "ai_candidate" }],\n  contentVersion: options.contentVersion ?? "content-v1",\n  checkedAt: options.checkedAt ?? "2026-08-06T00:00:00Z",\n  ...(options.conflictReason === undefined\n    ? {}\n    : { conflictReason: options.conflictReason }),\n});\n\nconst unknownSource = (): EvidencedValue<string> => ({\n  state: "unknown",\n  confidence: "high",\n  reviewState: "unreviewed",\n  evidence: [{ pointer: "synthetic", method: "ai_candidate" }],\n  contentVersion: "content-v1",\n  checkedAt: "2026-08-06T00:00:00Z",\n});'''
          if text.count(old_helper) != 1:
              raise SystemExit("Stage 17 generic source helper marker mismatch")
          text = text.replace(old_helper, new_helper, 1)

          replacements = {
              'source({ value: "available" as const })': 'source("available" as const)',
              'source({ value: "2026-08-01T00:00:00Z" })': 'source("2026-08-01T00:00:00Z")',
              'source({ value: "all_ages_confirmed" as const })': 'source("all_ages_confirmed" as const)',
              'source({ value: "合成シナリオ" })': 'source("合成シナリオ")',
              'source({ value: { minimumPlayers: 2, maximumPlayers: 4 } })': 'source({ minimumPlayers: 2, maximumPlayers: 4 })',
              'source({\n      value: { minimumMinutes: 120, maximumMinutes: 180 },\n    })': 'source({ minimumMinutes: 120, maximumMinutes: 180 })',
              'source({ value: "online" as const })': 'source("online" as const)',
              'source({ value: ["synthetic"] })': 'source<readonly string[]>(["synthetic"])',
              'source({ state: "unknown" })': 'unknownSource()',
              'source({ confidence: "medium" })': 'source("テスト版", { confidence: "medium" })',
              'source({ reviewState: "needs_more_evidence" })': 'source("テスト版", { reviewState: "needs_more_evidence" })',
              'source({ evidence: [] })': 'source("テスト版", { evidence: [] })',
              'source({ conflictReason: "conflict" })': 'source("テスト版", { conflictReason: "conflict" })',
              'source({\n        evidence: [{ pointer: "synthetic", method: "explicit_source" }],\n      })': 'source("テスト版", {\n        evidence: [{ pointer: "synthetic", method: "explicit_source" }],\n      })',
              'source({ contentVersion: "content-v2" })': 'source("テスト版", { contentVersion: "content-v2" })',
              'source({ value: ["AI tag"] })': 'source<readonly string[]>(["AI tag"])',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"Stage 17 test replacement marker missing: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and remove temporary workflows
        run: |
          set -euo pipefail
          npm run format
          rm -f .github/workflows/stage17-validation.yml
          rm -f .github/workflows/stage17-retry.yml

      - name: Verify exact Stage 17 scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/stage17-validation.yml",
              ".github/workflows/stage17-retry.yml",
              "docs/ARCHITECTURE.md",
              "docs/DATA_MODEL.md",
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "src/reviewed-overlay.ts",
              "src/reviewed-overlay.test.ts",
              "src/persistence/reviewed-overlay-service.ts",
              "src/persistence/reviewed-overlay-persistence.test.ts",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"unexpected Stage 17 paths: {unexpected}")
          if missing:
              raise SystemExit(f"required Stage 17 paths did not change: {missing}")
          PY

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git checkout -- tsconfig.json

      - name: Run source guards and Python regression
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          trap 'mv "$RUNNER_TEMP/node_modules" node_modules 2>/dev/null || true' EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          mv "$RUNNER_TEMP/node_modules" node_modules
          trap - EXIT
          python -m unittest discover -s tests

      - name: Run browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e
          git checkout -- tsconfig.json

      - name: Publish exact validated Stage 17 candidate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/stage17-validation.yml
          test ! -e .github/workflows/stage17-retry.yml
          grep -q 'materializeReviewedEnvelope' src/reviewed-overlay.ts
          grep -q 'PostgresReviewedOverlayService' src/persistence/reviewed-overlay-service.ts
          grep -q 'D-039 — Read-only exact-metadata reviewed overlays' docs/DECISIONS.md
          grep -q 'Stage 17 repository delivery' docs/ROADMAP.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/ARCHITECTURE.md \
            docs/DATA_MODEL.md \
            docs/DECISIONS.md \
            docs/ROADMAP.md \
            src/reviewed-overlay.ts \
            src/reviewed-overlay.test.ts \
            src/persistence/reviewed-overlay-service.ts \
            src/persistence/reviewed-overlay-persistence.test.ts
          git add -u \
            .github/workflows/stage17-validation.yml \
            .github/workflows/stage17-retry.yml
          git commit -m 'feat(review): add immutable reviewed overlays for issue 117'
          git push origin HEAD:agent/stage17-reviewed-overlay
