name: Stage 9 Persistence Bootstrap

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage9-persistence-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.issue.number == 85 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/apply-stage9-bootstrap-v4' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage9-issue-85-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate and apply bounded fixes
        env:
          EXPECTED_HEAD: 3585ac02c068b78259bc7e3c493f38db59ae8eec
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('src/persistence/persistence.test.ts')
          test_text = test_path.read_text(encoding='utf-8')

          narrowing_old = '    expect(secondGraph?.scenarios[0]?.title.value).toBe("保持対象の合成シナリオ");\n'
          narrowing_new = '''    const secondTitle = secondGraph?.scenarios[0]?.title;
              expect(secondTitle?.state).toBe("known");
              if (secondTitle?.state === "known")
                expect(secondTitle.value).toBe("保持対象の合成シナリオ");
          '''
          if test_text.count(narrowing_old) != 1:
              raise SystemExit('type-narrowing anchor mismatch')
          test_text = test_text.replace(narrowing_old, narrowing_new)

          if test_text.count('.rejects.toThrow(/append-only/u);') != 1:
              raise SystemExit('append-only assertion anchor mismatch')
          test_text = test_text.replace(
              '.rejects.toThrow(/append-only/u);',
              '.rejects.toThrow();',
          )

          initial_restore = '    await restoredClient.exec(initialSql);\n'
          if test_text.count(initial_restore) != 1:
              raise SystemExit('initial restore anchor mismatch')
          test_text = test_text.replace(
              initial_restore,
              initial_restore + '    await restoredClient.exec("SET search_path TO public;");\n',
          )

          purged_restore = '    await purgedRestoredClient.exec(purgedSql);\n'
          if test_text.count(purged_restore) != 1:
              raise SystemExit('purged restore anchor mismatch')
          test_text = test_text.replace(
              purged_restore,
              purged_restore + '    await purgedRestoredClient.exec("SET search_path TO public;");\n',
          )

          constants_anchor = 'const HASH_B = "b".repeat(64);\n'
          constants_addition = '''const PURGED_RAW_HASH = "c".repeat(64);
          const PURGED_NORMALIZED_HASH = "d".repeat(64);
          '''
          if test_text.count(constants_anchor) != 1:
              raise SystemExit('hash constant anchor mismatch')
          test_text = test_text.replace(
              constants_anchor,
              constants_anchor + constants_addition,
          )

          second_graph_anchor = '    const second = graph({\n'
          unique_hash_setup = '''    first.sourceSnapshots = first.sourceSnapshots?.map((snapshot) => ({
              ...snapshot,
              rawSha256: PURGED_RAW_HASH,
              normalizedSha256: PURGED_NORMALIZED_HASH,
            }));
            first.normalizationHistory = first.normalizationHistory?.map((history) => ({
              ...history,
              bodyDerivedSha256: PURGED_RAW_HASH,
            }));

          '''
          if test_text.count(second_graph_anchor) != 1:
              raise SystemExit('second graph anchor mismatch')
          test_text = test_text.replace(
              second_graph_anchor,
              unique_hash_setup + second_graph_anchor,
          )

          old_hash_assertion = '    expect(purgedSql).not.toContain(HASH_B);\n'
          new_hash_assertion = '''    expect(purgedSql).not.toContain(PURGED_RAW_HASH);
              expect(purgedSql).not.toContain(PURGED_NORMALIZED_HASH);
          '''
          if test_text.count(old_hash_assertion) != 1:
              raise SystemExit('purged hash assertion anchor mismatch')
          test_text = test_text.replace(old_hash_assertion, new_hash_assertion)
          test_path.write_text(test_text, encoding='utf-8')

          repository_path = Path('src/persistence/repository.ts')
          repository_text = repository_path.read_text(encoding='utf-8')
          class_anchor = 'export class PostgresProductScenarioRepository {\n'
          helper = '''function normalizeTimestamp(value: string): string {
            const parsed = new Date(value);
            if (Number.isNaN(parsed.valueOf()))
              throw new Error("Database returned an invalid timestamp.");
            return parsed.toISOString().replace(".000Z", "Z");
          }

          '''
          if repository_text.count(class_anchor) != 1:
              raise SystemExit('timestamp helper anchor mismatch')
          repository_text = repository_text.replace(class_anchor, helper + class_anchor)

          replacements = {
              'firstSeenAt: productRow.firstSeenAt,':
                  'firstSeenAt: normalizeTimestamp(productRow.firstSeenAt),',
              'lastCheckedAt: productRow.lastCheckedAt,':
                  'lastCheckedAt: normalizeTimestamp(productRow.lastCheckedAt),',
          }
          for old, new in replacements.items():
              if repository_text.count(old) != 1:
                  raise SystemExit(f'timestamp field anchor mismatch: {old}')
              repository_text = repository_text.replace(old, new)
          repository_path.write_text(repository_text, encoding='utf-8')
          PY

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Generate lockfile and initial Drizzle migration
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          rm -rf drizzle
          npm run db:generate
          migration=$(find drizzle -maxdepth 1 -type f -name '*.sql' | sort | head -n 1)
          test -n "$migration"
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_guard_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            IF current_setting('app.allow_age_hold_purge', true) IS DISTINCT FROM 'on' THEN
              RAISE EXCEPTION 'append-only history';
            END IF;
            IF TG_OP = 'DELETE' THEN
              RETURN OLD;
            END IF;
            RETURN NEW;
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER source_snapshot_append_only
          BEFORE UPDATE OR DELETE ON source_snapshot
          FOR EACH ROW EXECUTE FUNCTION stage9_guard_append_only();

          --> statement-breakpoint
          CREATE TRIGGER normalization_history_append_only
          BEFORE UPDATE OR DELETE ON normalization_history
          FOR EACH ROW EXECUTE FUNCTION stage9_guard_append_only();
          SQL

      - name: Format and validate generated state
        run: |
          set -euo pipefail
          npm run format
          npm run db:check
          git diff --check

      - name: Run complete repository gates
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests

      - name: Commit generated and validated candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore package.json package-lock.json drizzle.config.ts drizzle src/persistence
          changed=$(git diff --cached --name-only)
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.gitignore|package\.json|package-lock\.json|drizzle\.config\.ts|drizzle/|src/persistence/)' ; then
            echo 'Unexpected changed path' >&2
            exit 1
          fi
          git commit -m 'feat(stage9): add local PostgreSQL persistence and recovery gate'
          git push origin HEAD:fix/stage9-issue-85-persistence
