name: Stage 9 Dependency Verification

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage9-dependency-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.issue.number == 85 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/verify-stage9-dependencies-v3' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage9-issue-85-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate
        env:
          EXPECTED_HEAD: e29ce58688ed2077b9c452ae84cdcf5dc9bf2676
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate lockfile and enforce audit boundary
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          npm audit --json > "$RUNNER_TEMP/npm-audit-all.json" || true
          node - "$RUNNER_TEMP/npm-audit-production.json" "$RUNNER_TEMP/npm-audit-all.json" <<'JS'
          const fs = require('node:fs');
          const [productionPath, allPath] = process.argv.slice(2);
          const production = JSON.parse(fs.readFileSync(productionPath, 'utf8'));
          const all = JSON.parse(fs.readFileSync(allPath, 'utf8'));
          const productionCounts = production.metadata?.vulnerabilities ?? {};
          const allCounts = all.metadata?.vulnerabilities ?? {};
          console.log(`production audit: ${JSON.stringify(productionCounts)}`);
          console.log(`all-dependency audit: ${JSON.stringify(allCounts)}`);
          for (const [name, value] of Object.entries(production.vulnerabilities ?? {}))
            console.log(`production ${name}: severity=${value.severity}; direct=${value.isDirect}; via=${JSON.stringify(value.via)}`);
          for (const [name, value] of Object.entries(all.vulnerabilities ?? {}))
            console.log(`all ${name}: severity=${value.severity}; direct=${value.isDirect}; via=${JSON.stringify(value.via)}`);
          if ((productionCounts.total ?? 0) !== 0)
            throw new Error('Production dependency audit must be clean.');
          if ((allCounts.high ?? 0) !== 0 || (allCounts.critical ?? 0) !== 0)
            throw new Error('High or critical dependency advisory remains.');
          JS
          npm ls next eslint-config-next vitest postcss sharp drizzle-orm drizzle-kit @electric-sql/pglite @electric-sql/pglite-tools

      - name: Verify committed migration and formatting
        run: |
          set -euo pipefail
          npm run format:check
          npm run db:check
          git diff --check

      - name: Run complete Node gates
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Run repository-only Python gates
        run: |
          set -euo pipefail
          rm -rf node_modules .next
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests

      - name: Commit verified lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git commit -m 'build(stage9): lock patched dependency graph'
          git push origin HEAD:fix/stage9-issue-85-persistence
