name: Stage 9 Persistence Bootstrap

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage9-persistence-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.issue.number == 85 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/apply-stage9-bootstrap' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage9-issue-85-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate
        env:
          EXPECTED_HEAD: 3585ac02c068b78259bc7e3c493f38db59ae8eec
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Generate lockfile and initial Drizzle migration
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          rm -rf drizzle
          npm run db:generate
          migration=$(find drizzle -maxdepth 1 -type f -name '*.sql' | sort | head -n 1)
          test -n "$migration"
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_guard_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            IF current_setting('app.allow_age_hold_purge', true) IS DISTINCT FROM 'on' THEN
              RAISE EXCEPTION 'append-only history';
            END IF;
            IF TG_OP = 'DELETE' THEN
              RETURN OLD;
            END IF;
            RETURN NEW;
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER source_snapshot_append_only
          BEFORE UPDATE OR DELETE ON source_snapshot
          FOR EACH ROW EXECUTE FUNCTION stage9_guard_append_only();

          --> statement-breakpoint
          CREATE TRIGGER normalization_history_append_only
          BEFORE UPDATE OR DELETE ON normalization_history
          FOR EACH ROW EXECUTE FUNCTION stage9_guard_append_only();
          SQL

      - name: Format and validate generated state
        run: |
          set -euo pipefail
          npm run format
          npm run db:check
          git diff --check

      - name: Run complete repository gates
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests

      - name: Commit generated and validated candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore package.json package-lock.json drizzle.config.ts drizzle src/persistence
          changed=$(git diff --cached --name-only)
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.gitignore|package\.json|package-lock\.json|drizzle\.config\.ts|drizzle/|src/persistence/)' ; then
            echo 'Unexpected changed path' >&2
            exit 1
          fi
          git commit -m 'feat(stage9): add local PostgreSQL persistence and recovery gate'
          git push origin HEAD:fix/stage9-issue-85-persistence
