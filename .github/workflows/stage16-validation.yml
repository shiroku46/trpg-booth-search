name: Stage 16 review-application validation

on:
  push:
    branches:
      - agent/stage16-review-application
    paths:
      - .github/workflows/stage16-validation.yml

permissions:
  contents: write

concurrency:
  group: stage16-review-application
  cancel-in-progress: false

jobs:
  implement-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: d0bfa8db02a7276787cd5d3c87d3c7ff2d9fdbb8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage16-review-application
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact Stage 16 base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Add Stage 16 domain and persistence implementation
        run: |
          cat > src/review-application.ts <<'EOF'
          import {
            assertReanalysisVersionKey,
            type ReanalysisVersionKey,
          } from "./reanalysis";
          import {
            assertReviewDecisionAllowed,
            assertReviewSnapshot,
            type ReviewDecision,
            type ReviewDecisionReason,
            type ReviewSnapshot,
          } from "./review";

          export const REVIEW_APPLICATION_OUTCOMES = [
            "approved",
            "excluded_rejected",
            "excluded_needs_more_evidence",
          ] as const;
          export type ReviewApplicationOutcome =
            (typeof REVIEW_APPLICATION_OUTCOMES)[number];

          export type ReviewApplicationEntityType = "booth_product" | "scenario";
          export type ReviewApplicationTarget = {
            productId: string;
            entityType: ReviewApplicationEntityType;
            entityId: string;
            fieldPath: string;
            versionKey: ReanalysisVersionKey;
          };

          export type ReviewApplicationCase = {
            id: string;
            target: ReviewApplicationTarget;
            snapshot: ReviewSnapshot;
          };

          export type ReviewApplicationDecisionRecord = {
            id: string;
            reviewCaseId: string;
            decision: ReviewDecision;
            reason: ReviewDecisionReason;
            decidedAt: string;
          };

          export type ReviewApplicationEvent = {
            id: string;
            reviewCaseId: string;
            reviewDecisionEventId: string;
            target: ReviewApplicationTarget;
            outcome: ReviewApplicationOutcome;
            appliedAt: string;
          };

          export type ReviewApplicationOmissionReason =
            | "unapplied"
            | "target_mismatch"
            | "stale_version"
            | "rejected"
            | "needs_more_evidence";

          export type EffectiveReviewProjection =
            | {
                state: "approved";
                applicationId: string;
                reviewCaseId: string;
                reviewDecisionEventId: string;
                target: ReviewApplicationTarget;
              }
            | {
                state: "omitted";
                reason: ReviewApplicationOmissionReason;
                target: ReviewApplicationTarget;
              };

          const FIELD_PATH = /^[a-z][a-z0-9_]*(?:[.][a-z][a-z0-9_]*){0,5}$/u;

          function copyTarget(target: ReviewApplicationTarget): ReviewApplicationTarget {
            return {
              productId: target.productId,
              entityType: target.entityType,
              entityId: target.entityId,
              fieldPath: target.fieldPath,
              versionKey: { ...target.versionKey },
            };
          }

          function freeze<T>(value: T): T {
            if (value && typeof value === "object" && !Object.isFrozen(value)) {
              Object.freeze(value);
              for (const nested of Object.values(value as Record<string, unknown>))
                freeze(nested);
            }
            return value;
          }

          function sameIdentity(
            left: ReviewApplicationTarget,
            right: ReviewApplicationTarget,
          ): boolean {
            return (
              left.productId === right.productId &&
              left.entityType === right.entityType &&
              left.entityId === right.entityId &&
              left.fieldPath === right.fieldPath
            );
          }

          function sameVersion(
            left: ReviewApplicationTarget,
            right: ReviewApplicationTarget,
          ): boolean {
            return (
              left.versionKey.contentVersion === right.versionKey.contentVersion &&
              left.versionKey.normalizerVersion === right.versionKey.normalizerVersion &&
              left.versionKey.registryVersion === right.versionKey.registryVersion
            );
          }

          export function assertReviewApplicationTarget(
            target: ReviewApplicationTarget,
          ): void {
            if (
              !target.productId.trim() ||
              !target.entityId.trim() ||
              target.fieldPath.length > 128 ||
              !FIELD_PATH.test(target.fieldPath)
            )
              throw new Error("Review application target is invalid.");
            if (
              target.entityType !== "booth_product" &&
              target.entityType !== "scenario"
            )
              throw new Error("Review application entity type is invalid.");
            assertReanalysisVersionKey(target.versionKey);
          }

          export function planReviewDecisionApplication(
            reviewCase: ReviewApplicationCase,
            decision: ReviewApplicationDecisionRecord,
            requestedTarget: ReviewApplicationTarget,
          ): ReviewApplicationOutcome {
            assertReviewApplicationTarget(reviewCase.target);
            assertReviewApplicationTarget(requestedTarget);
            assertReviewSnapshot(reviewCase.snapshot);
            if (!sameVersion(reviewCase.target, {
              ...reviewCase.target,
              versionKey: reviewCase.snapshot.versionKey,
            }))
              throw new Error("Review case snapshot version is inconsistent.");
            if (decision.reviewCaseId !== reviewCase.id)
              throw new Error("Review decision does not belong to the review case.");
            if (!sameIdentity(reviewCase.target, requestedTarget))
              throw new Error("Review application target does not match the case.");
            if (!sameVersion(reviewCase.target, requestedTarget))
              throw new Error("Review application version is stale.");

            assertReviewDecisionAllowed(
              reviewCase.snapshot,
              decision.decision,
              decision.reason,
            );
            switch (decision.decision) {
              case "approved":
                return "approved";
              case "rejected":
                return "excluded_rejected";
              case "needs_more_evidence":
                return "excluded_needs_more_evidence";
            }
          }

          function omitted(
            reason: ReviewApplicationOmissionReason,
            target: ReviewApplicationTarget,
          ): EffectiveReviewProjection {
            return freeze({ state: "omitted", reason, target: copyTarget(target) });
          }

          export function projectEffectiveReviewApplication(
            event: ReviewApplicationEvent | null,
            requestedTarget: ReviewApplicationTarget,
          ): EffectiveReviewProjection {
            assertReviewApplicationTarget(requestedTarget);
            if (!event) return omitted("unapplied", requestedTarget);
            assertReviewApplicationTarget(event.target);
            if (!sameIdentity(event.target, requestedTarget))
              return omitted("target_mismatch", requestedTarget);
            if (!sameVersion(event.target, requestedTarget))
              return omitted("stale_version", requestedTarget);

            switch (event.outcome) {
              case "approved":
                return freeze({
                  state: "approved",
                  applicationId: event.id,
                  reviewCaseId: event.reviewCaseId,
                  reviewDecisionEventId: event.reviewDecisionEventId,
                  target: copyTarget(requestedTarget),
                });
              case "excluded_rejected":
                return omitted("rejected", requestedTarget);
              case "excluded_needs_more_evidence":
                return omitted("needs_more_evidence", requestedTarget);
              default:
                throw new Error("Stored review application outcome is invalid.");
            }
          }
          EOF

          cat > src/review-application.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import type { ReviewSnapshot } from "./review";
          import {
            planReviewDecisionApplication,
            projectEffectiveReviewApplication,
            type ReviewApplicationCase,
            type ReviewApplicationDecisionRecord,
            type ReviewApplicationEvent,
            type ReviewApplicationTarget,
          } from "./review-application";

          const target = (
            overrides: Partial<ReviewApplicationTarget> = {},
          ): ReviewApplicationTarget => ({
            productId: "11111111-1111-4111-8111-111111111111",
            entityType: "scenario",
            entityId: "22222222-2222-4222-8222-222222222222",
            fieldPath: "edition",
            versionKey: {
              contentVersion: "content-v1",
              normalizerVersion: "normalizer-v1",
              registryVersion: "registry-v1",
            },
            ...overrides,
          });

          const snapshot = (
            applicationTarget: ReviewApplicationTarget,
            overrides: Partial<ReviewSnapshot> = {},
          ): ReviewSnapshot => ({
            evidencedState: "known",
            confidence: "high",
            initialReviewState: "unreviewed",
            evidenceCount: 1,
            hasConflict: false,
            holdReason: null,
            containsAiEvidence: true,
            versionKey: { ...applicationTarget.versionKey },
            ...overrides,
          });

          const reviewCase = (
            applicationTarget: ReviewApplicationTarget = target(),
            overrides: Partial<ReviewApplicationCase> = {},
          ): ReviewApplicationCase => ({
            id: "30000000-0000-4000-8000-000000000001",
            target: applicationTarget,
            snapshot: snapshot(applicationTarget),
            ...overrides,
          });

          const decision = (
            overrides: Partial<ReviewApplicationDecisionRecord> = {},
          ): ReviewApplicationDecisionRecord => ({
            id: "40000000-0000-4000-8000-000000000001",
            reviewCaseId: "30000000-0000-4000-8000-000000000001",
            decision: "approved",
            reason: "evidence_sufficient",
            decidedAt: "2026-08-06T00:02:00Z",
            ...overrides,
          });

          describe("Stage 16 immutable review-decision application", () => {
            it.each([
              ["approved", "evidence_sufficient", "approved"],
              ["rejected", "unsupported_claim", "excluded_rejected"],
              [
                "needs_more_evidence",
                "evidence_insufficient",
                "excluded_needs_more_evidence",
              ],
            ] as const)(
              "maps %s decisions to the controlled application outcome",
              (decisionState, reason, outcome) => {
                const applicationTarget = target();
                expect(
                  planReviewDecisionApplication(
                    reviewCase(applicationTarget),
                    decision({ decision: decisionState, reason }),
                    applicationTarget,
                  ),
                ).toBe(outcome);
              },
            );

            it("rejects a decision bound to another case", () => {
              const applicationTarget = target();
              expect(() =>
                planReviewDecisionApplication(
                  reviewCase(applicationTarget),
                  decision({
                    reviewCaseId: "30000000-0000-4000-8000-000000000099",
                  }),
                  applicationTarget,
                ),
              ).toThrow(/does not belong/iu);
            });

            it.each([
              ["product", { productId: "11111111-1111-4111-8111-111111111199" }],
              ["entity", { entityId: "22222222-2222-4222-8222-222222222299" }],
              ["field", { fieldPath: "title" }],
            ] as const)("rejects a mismatched %s target", (_label, overrides) => {
              const applicationTarget = target();
              expect(() =>
                planReviewDecisionApplication(
                  reviewCase(applicationTarget),
                  decision(),
                  target(overrides),
                ),
              ).toThrow(/does not match/iu);
            });

            it.each([
              ["contentVersion", "content-v2"],
              ["normalizerVersion", "normalizer-v2"],
              ["registryVersion", "registry-v2"],
            ] as const)("rejects a stale %s", (dimension, value) => {
              const applicationTarget = target();
              const stale = target({
                versionKey: { ...applicationTarget.versionKey, [dimension]: value },
              });
              expect(() =>
                planReviewDecisionApplication(
                  reviewCase(applicationTarget),
                  decision(),
                  stale,
                ),
              ).toThrow(/stale/iu);
            });

            it.each([
              { confidence: "low" as const },
              { hasConflict: true },
              {
                evidencedState: "hold" as const,
                holdReason: "hold_alias_conflict",
              },
              { evidenceCount: 0 },
            ])("keeps unsafe approval fail-closed", (unsafe) => {
              const applicationTarget = target();
              const item = reviewCase(applicationTarget, {
                snapshot: snapshot(applicationTarget, unsafe),
              });
              expect(() =>
                planReviewDecisionApplication(item, decision(), applicationTarget),
              ).toThrow();
            });

            it("projects only an exact approved application", () => {
              const applicationTarget = target();
              const event: ReviewApplicationEvent = {
                id: "50000000-0000-4000-8000-000000000001",
                reviewCaseId: reviewCase(applicationTarget).id,
                reviewDecisionEventId: decision().id,
                target: applicationTarget,
                outcome: "approved",
                appliedAt: "2026-08-06T00:03:00Z",
              };
              expect(
                projectEffectiveReviewApplication(event, applicationTarget),
              ).toMatchObject({ state: "approved", applicationId: event.id });
              expect(projectEffectiveReviewApplication(null, applicationTarget)).toEqual({
                state: "omitted",
                reason: "unapplied",
                target: applicationTarget,
              });
              expect(
                projectEffectiveReviewApplication(
                  { ...event, outcome: "excluded_rejected" },
                  applicationTarget,
                ),
              ).toMatchObject({ state: "omitted", reason: "rejected" });
              expect(
                projectEffectiveReviewApplication(
                  { ...event, outcome: "excluded_needs_more_evidence" },
                  applicationTarget,
                ),
              ).toMatchObject({
                state: "omitted",
                reason: "needs_more_evidence",
              });
            });

            it("omits mismatched and stale stored applications", () => {
              const applicationTarget = target();
              const event: ReviewApplicationEvent = {
                id: "50000000-0000-4000-8000-000000000001",
                reviewCaseId: reviewCase(applicationTarget).id,
                reviewDecisionEventId: decision().id,
                target: applicationTarget,
                outcome: "approved",
                appliedAt: "2026-08-06T00:03:00Z",
              };
              expect(
                projectEffectiveReviewApplication(event, target({ fieldPath: "title" })),
              ).toMatchObject({ state: "omitted", reason: "target_mismatch" });
              expect(
                projectEffectiveReviewApplication(
                  event,
                  target({
                    versionKey: {
                      ...applicationTarget.versionKey,
                      contentVersion: "content-v2",
                    },
                  }),
                ),
              ).toMatchObject({ state: "omitted", reason: "stale_version" });
            });
          });
          EOF

          cat > src/persistence/review-application-repository.ts <<'EOF'
          import { and, eq } from "drizzle-orm";

          import {
            assertReviewApplicationTarget,
            planReviewDecisionApplication,
            projectEffectiveReviewApplication,
            type EffectiveReviewProjection,
            type ReviewApplicationCase,
            type ReviewApplicationDecisionRecord,
            type ReviewApplicationEvent,
            type ReviewApplicationOutcome,
            type ReviewApplicationTarget,
          } from "../review-application";
          import type { ReviewSnapshot } from "../review";
          import type { PersistenceDatabase } from "./database";
          import {
            reviewApplicationEvent,
            reviewCase,
            reviewDecisionEvent,
          } from "./schema";

          export type ApplyReviewDecisionInput = {
            id: string;
            reviewCaseId: string;
            reviewDecisionEventId: string;
            target: ReviewApplicationTarget;
            appliedAt: string;
          };

          const timestamp = (value: string) => {
            const parsed = new Date(value);
            if (Number.isNaN(parsed.valueOf()))
              throw new Error("Review application timestamp is invalid.");
            return parsed.toISOString().replace(".000Z", "Z");
          };

          function freeze<T>(value: T): T {
            if (value && typeof value === "object" && !Object.isFrozen(value)) {
              Object.freeze(value);
              for (const nested of Object.values(value as Record<string, unknown>))
                freeze(nested);
            }
            return value;
          }

          function targetFromCase(
            row: typeof reviewCase.$inferSelect,
          ): ReviewApplicationTarget {
            if (row.entityType !== "booth_product" && row.entityType !== "scenario")
              throw new Error("Stored review application entity type is invalid.");
            return {
              productId: row.boothProductId,
              entityType: row.entityType,
              entityId: row.entityId,
              fieldPath: row.fieldPath,
              versionKey: {
                contentVersion: row.contentVersion,
                normalizerVersion: row.normalizerVersion,
                registryVersion: row.registryVersion,
              },
            };
          }

          function snapshotFromCase(
            row: typeof reviewCase.$inferSelect,
          ): ReviewSnapshot {
            return {
              evidencedState: row.evidencedState,
              confidence: row.confidence,
              initialReviewState: row.initialReviewState,
              evidenceCount: row.evidenceCount,
              hasConflict: row.hasConflict,
              holdReason: row.holdReason,
              containsAiEvidence: row.containsAiEvidence,
              versionKey: {
                contentVersion: row.contentVersion,
                normalizerVersion: row.normalizerVersion,
                registryVersion: row.registryVersion,
              },
            };
          }

          function applicationCase(
            row: typeof reviewCase.$inferSelect,
          ): ReviewApplicationCase {
            return {
              id: row.id,
              target: targetFromCase(row),
              snapshot: snapshotFromCase(row),
            };
          }

          function applicationDecision(
            row: typeof reviewDecisionEvent.$inferSelect,
          ): ReviewApplicationDecisionRecord {
            return {
              id: row.id,
              reviewCaseId: row.reviewCaseId,
              decision: row.decision,
              reason: row.reason,
              decidedAt: timestamp(row.decidedAt),
            };
          }

          function eventFromRow(
            row: typeof reviewApplicationEvent.$inferSelect,
          ): ReviewApplicationEvent {
            if (row.entityType !== "booth_product" && row.entityType !== "scenario")
              throw new Error("Stored review application entity type is invalid.");
            return {
              id: row.id,
              reviewCaseId: row.reviewCaseId,
              reviewDecisionEventId: row.reviewDecisionEventId,
              target: {
                productId: row.boothProductId,
                entityType: row.entityType,
                entityId: row.entityId,
                fieldPath: row.fieldPath,
                versionKey: {
                  contentVersion: row.contentVersion,
                  normalizerVersion: row.normalizerVersion,
                  registryVersion: row.registryVersion,
                },
              },
              outcome: row.outcome,
              appliedAt: timestamp(row.appliedAt),
            };
          }

          function sameStoredApplication(
            row: typeof reviewApplicationEvent.$inferSelect,
            input: ApplyReviewDecisionInput,
            outcome: ReviewApplicationOutcome,
            appliedAt: string,
          ): boolean {
            return (
              row.reviewCaseId === input.reviewCaseId &&
              row.boothProductId === input.target.productId &&
              row.entityType === input.target.entityType &&
              row.entityId === input.target.entityId &&
              row.fieldPath === input.target.fieldPath &&
              row.contentVersion === input.target.versionKey.contentVersion &&
              row.normalizerVersion === input.target.versionKey.normalizerVersion &&
              row.registryVersion === input.target.versionKey.registryVersion &&
              row.outcome === outcome &&
              timestamp(row.appliedAt) === appliedAt
            );
          }

          export class PostgresReviewApplicationRepository {
            constructor(private readonly db: PersistenceDatabase) {}

            async apply(input: ApplyReviewDecisionInput) {
              assertReviewApplicationTarget(input.target);
              const appliedAt = timestamp(input.appliedAt);

              return this.db.transaction(async (tx) => {
                const [caseRow] = await tx
                  .select()
                  .from(reviewCase)
                  .where(eq(reviewCase.id, input.reviewCaseId));
                if (!caseRow) throw new Error("Review application case does not exist.");

                const [decisionRow] = await tx
                  .select()
                  .from(reviewDecisionEvent)
                  .where(eq(reviewDecisionEvent.id, input.reviewDecisionEventId));
                if (!decisionRow)
                  throw new Error("Review application decision does not exist.");

                const reviewCaseValue = applicationCase(caseRow);
                const decisionValue = applicationDecision(decisionRow);
                const outcome = planReviewDecisionApplication(
                  reviewCaseValue,
                  decisionValue,
                  input.target,
                );
                if (new Date(appliedAt).valueOf() <= new Date(decisionValue.decidedAt).valueOf())
                  throw new Error("Review application must follow its decision.");

                const [existing] = await tx
                  .select()
                  .from(reviewApplicationEvent)
                  .where(
                    eq(
                      reviewApplicationEvent.reviewDecisionEventId,
                      input.reviewDecisionEventId,
                    ),
                  );
                if (existing) {
                  if (!sameStoredApplication(existing, input, outcome, appliedAt))
                    throw new Error("Review application identity conflict.");
                  return freeze({
                    state: "existing" as const,
                    applicationId: existing.id,
                  });
                }

                await tx.insert(reviewApplicationEvent).values({
                  id: input.id,
                  reviewCaseId: input.reviewCaseId,
                  reviewDecisionEventId: input.reviewDecisionEventId,
                  boothProductId: input.target.productId,
                  entityType: input.target.entityType,
                  entityId: input.target.entityId,
                  fieldPath: input.target.fieldPath,
                  contentVersion: input.target.versionKey.contentVersion,
                  normalizerVersion: input.target.versionKey.normalizerVersion,
                  registryVersion: input.target.versionKey.registryVersion,
                  outcome,
                  appliedAt,
                });
                return freeze({
                  state: "inserted" as const,
                  applicationId: input.id,
                  outcome,
                });
              });
            }

            async loadEffectiveProjection(
              target: ReviewApplicationTarget,
            ): Promise<EffectiveReviewProjection> {
              assertReviewApplicationTarget(target);
              const [caseRow] = await this.db
                .select()
                .from(reviewCase)
                .where(
                  and(
                    eq(reviewCase.boothProductId, target.productId),
                    eq(reviewCase.entityType, target.entityType),
                    eq(reviewCase.entityId, target.entityId),
                    eq(reviewCase.fieldPath, target.fieldPath),
                    eq(reviewCase.contentVersion, target.versionKey.contentVersion),
                    eq(
                      reviewCase.normalizerVersion,
                      target.versionKey.normalizerVersion,
                    ),
                    eq(reviewCase.registryVersion, target.versionKey.registryVersion),
                  ),
                );
              if (!caseRow)
                return projectEffectiveReviewApplication(null, target);

              const [decisionRow] = await this.db
                .select()
                .from(reviewDecisionEvent)
                .where(eq(reviewDecisionEvent.reviewCaseId, caseRow.id));
              if (!decisionRow)
                return projectEffectiveReviewApplication(null, target);

              const [applicationRow] = await this.db
                .select()
                .from(reviewApplicationEvent)
                .where(
                  eq(
                    reviewApplicationEvent.reviewDecisionEventId,
                    decisionRow.id,
                  ),
                );
              if (!applicationRow)
                return projectEffectiveReviewApplication(null, target);

              const reviewCaseValue = applicationCase(caseRow);
              const decisionValue = applicationDecision(decisionRow);
              const expectedOutcome = planReviewDecisionApplication(
                reviewCaseValue,
                decisionValue,
                target,
              );
              const event = eventFromRow(applicationRow);
              if (event.outcome !== expectedOutcome)
                throw new Error("Stored review application outcome is inconsistent.");
              if (
                new Date(event.appliedAt).valueOf() <=
                new Date(decisionValue.decidedAt).valueOf()
              )
                throw new Error("Stored review application timestamp is inconsistent.");
              return projectEffectiveReviewApplication(event, target);
            }
          }
          EOF

      - name: Add Stage 16 schema and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          schema = Path("src/persistence/schema.ts")
          text = schema.read_text(encoding="utf-8")
          table = dedent(r'''
          export const reviewApplicationEvent = pgTable(
            "review_application_event",
            {
              id: uuid("id").primaryKey(),
              reviewCaseId: uuid("review_case_id")
                .notNull()
                .unique()
                .references(() => reviewCase.id, { onDelete: "restrict" }),
              reviewDecisionEventId: uuid("review_decision_event_id")
                .notNull()
                .unique()
                .references(() => reviewDecisionEvent.id, { onDelete: "restrict" }),
              boothProductId: uuid("booth_product_id")
                .notNull()
                .references(() => boothProduct.id, { onDelete: "restrict" }),
              entityType: text("entity_type", {
                enum: ["booth_product", "scenario"],
              }).notNull(),
              entityId: uuid("entity_id").notNull(),
              fieldPath: text("field_path").notNull(),
              contentVersion: text("content_version").notNull(),
              normalizerVersion: text("normalizer_version").notNull(),
              registryVersion: text("registry_version").notNull(),
              outcome: text("outcome", {
                enum: [
                  "approved",
                  "excluded_rejected",
                  "excluded_needs_more_evidence",
                ],
              }).notNull(),
              appliedAt: timestamp("applied_at", {
                withTimezone: true,
                mode: "string",
              }).notNull(),
            },
            (table) => [
              index("review_application_target_idx").on(
                table.boothProductId,
                table.entityType,
                table.entityId,
                table.fieldPath,
                table.contentVersion,
                table.normalizerVersion,
                table.registryVersion,
              ),
              index("review_application_time_idx").on(table.appliedAt, table.id),
              check(
                "review_application_entity_type_ck",
                sql`${table.entityType} IN ('booth_product', 'scenario')`,
              ),
              check(
                "review_application_field_path_ck",
                sql`length(${table.fieldPath}) BETWEEN 1 AND 128 AND ${table.fieldPath} ~ '^[a-z][a-z0-9_]*([.][a-z][a-z0-9_]*){0,5}$'`,
              ),
              check(
                "review_application_version_ck",
                sql`(
                  length(btrim(${table.contentVersion})) > 0
                  AND length(btrim(${table.normalizerVersion})) > 0
                  AND length(btrim(${table.registryVersion})) > 0
                ) IS TRUE`,
              ),
              check(
                "review_application_outcome_ck",
                sql`${table.outcome} IN (
                  'approved',
                  'excluded_rejected',
                  'excluded_needs_more_evidence'
                )`,
              ),
            ],
          );

          ''')
          if "export const reviewApplicationEvent = pgTable(" not in text:
              marker = "export const redactionTombstone = pgTable("
              if text.count(marker) != 1:
                  raise SystemExit("Stage 16 schema insertion marker mismatch")
              text = text.replace(marker, table + marker, 1)
          if "  reviewApplicationEvent,\n" not in text:
              marker = "  reviewDecisionEvent,\n  redactionTombstone,"
              if text.count(marker) != 1:
                  raise SystemExit("Stage 16 schema export marker mismatch")
              text = text.replace(
                  marker,
                  "  reviewDecisionEvent,\n  reviewApplicationEvent,\n  redactionTombstone,",
                  1,
              )
          schema.write_text(text, encoding="utf-8")

          logical = Path("docs/DATA_MODEL.md")
          text = logical.read_text(encoding="utf-8")
          if "### 2.6 Immutable review-decision application" not in text:
              marker = "Stage 15 records the review disposition but does not overwrite the underlying evidenced value. Applying a decision to an effective downstream projection is a separate immutable transaction boundary."
              if text.count(marker) != 1:
                  raise SystemExit("Stage 16 logical-model marker mismatch")
              section = dedent('''

              ### 2.6 Immutable review-decision application

              Stage 16 applies exactly one immutable decision to the exact product/entity/field and content/normalizer/registry version identity of its review case. Application never rewrites the source evidenced value, review case, decision, source snapshot, normalization history, or registry snapshot.

              The application event stores metadata only: references to the case and decision, the exact copied identity/version key, one derived outcome (`approved`, `excluded_rejected`, or `excluded_needs_more_evidence`), and application time. It excludes field values, product payload, source body, spoiler text, reviewer identity, credentials, and unrestricted evidence.

              Approval enters the effective approval projection only when the decision belongs to the case, the requested target and complete version key match exactly, the decision is approved, confidence is high/medium, hold/conflict are absent, and a known value has evidence. Unapplied, stale, mismatched, rejected, needs-more-evidence, unsafe, or malformed states remain omitted. A later version creates a new case, decision, and application event rather than mutating an earlier record.
              ''').rstrip()
              text = text.replace(marker, marker + "\n" + section, 1)
          logical.write_text(text, encoding="utf-8")

          physical = Path("docs/PHYSICAL_SCHEMA.md")
          text = physical.read_text(encoding="utf-8")
          if "### 5.4 `review_application_event`" not in text:
              marker = "### 5.4 `redaction_tombstone`"
              if text.count(marker) != 1:
                  raise SystemExit("Stage 16 physical-schema marker mismatch")
              section = dedent('''
              ### 5.4 `review_application_event`

              Stage 16 stores one immutable metadata-only application per review decision and per review case. The row references both immutable records and repeats only the exact product/entity/field and content/normalizer/registry version identity needed for audit and fail-closed lookup. The controlled outcome is `approved`, `excluded_rejected`, or `excluded_needs_more_evidence`; no field value or source payload is copied.

              A BEFORE INSERT trigger joins the referenced case and decision, rejects cross-case or mismatched metadata, verifies product/scenario ownership, derives and verifies the outcome, rejects stale or unsafe approval, and requires application time to follow decision time. Unique case and decision references prevent duplicate application. UPDATE and DELETE are rejected by an append-only trigger. Later versions create new cases and application rows.

              The effective approval projection returns approved only for an exact current target/version match and an accepted application outcome. Missing, unapplied, stale, rejected, needs-more-evidence, held, conflicted, low-confidence, evidence-empty, or malformed records remain omitted.

              ''')
              text = text.replace(marker, section + "### 5.5 `redaction_tombstone`", 1)
              child = "### 5.5 `redaction_tombstone_record_ref`"
              if text.count(child) != 1:
                  raise SystemExit("Stage 16 physical child marker mismatch")
              text = text.replace(child, "### 5.6 `redaction_tombstone_record_ref`", 1)
          physical.write_text(text, encoding="utf-8")

          decisions = Path("docs/DECISIONS.md")
          text = decisions.read_text(encoding="utf-8")
          old = "Decisions D-001 through D-037 are accepted"
          new = "Decisions D-001 through D-038 are accepted"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Stage 16 decision range marker mismatch")
          if "### D-038 — Immutable exact-version review application" not in text:
              marker = "\n---\n\n## Pending Decisions\n"
              if text.count(marker) != 1:
                  raise SystemExit("Stage 16 pending-decision marker mismatch")
              d038 = dedent('''

              ### D-038 — Immutable exact-version review application

              **Decision date:** 2026-08-06.

              A Stage 15 decision becomes effective only through one append-only metadata-only application event bound to the exact case, decision, product/entity/field identity, and complete content/normalizer/registry version key. Application never overwrites source evidence, domain rows, cases, decisions, snapshots, history, or registry data.

              The effective projection is fail-closed: only a valid approved decision for a high/medium-confidence, non-held, non-conflicted case with evidence for known values may produce `approved`. Rejected and needs-more-evidence decisions produce explicit excluded outcomes. Missing, unapplied, stale, mismatched, duplicated, unsafe, or malformed states remain omitted. Later versions use new immutable records.

              Cross-record and ownership matching are enforced both in the provider-neutral repository and by PostgreSQL insert triggers. Application rows exclude field values, product payload, source body, spoiler text, reviewer identity, credentials, and unrestricted evidence. Stage 16 creates no UI, account, hosted resource, BOOTH access, AI inference, or public review-history display. This decision is implemented by Issue #113.
              ''').rstrip()
              text = text.replace(marker, d038 + marker, 1)
          decisions.write_text(text, encoding="utf-8")

          roadmap = Path("docs/ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8").rstrip()
          if "## Stage 16 repository delivery — 2026-08-06" not in text:
              text += dedent('''


              ## Stage 16 repository delivery — 2026-08-06

              Issue #113 adds an immutable, auditable decision-application boundary. Exactly one metadata-only application event binds a Stage 15 case and decision to the exact product/entity/field and content/normalizer/registry version identity. Approved, rejected, and needs-more-evidence outcomes are derived deterministically; only safe exact-version approval enters the effective approval projection.

              Database triggers enforce ownership, cross-record identity, outcome derivation, safe approval, timestamp order, and append-only behavior. Unapplied, stale, mismatched, rejected, held, conflicted, low-confidence, evidence-empty, or malformed states remain omitted. Existing Design B, fixtures, public search/publication, hosted-resource, and external-network boundaries remain unchanged.
              ''').rstrip()
          roadmap.write_text(text + "\n", encoding="utf-8")
          PY

