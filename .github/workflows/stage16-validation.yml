      - name: Format and generate Stage 16 migration
        run: |
          set -euo pipefail
          npm run format
          test -z "$(find drizzle -maxdepth 1 -type f -name '0004_*.sql' -print)"
          npx drizzle-kit generate --name=stage16_review_application
          migration="$(find drizzle -maxdepth 1 -type f -name '0004_*stage16_review_application.sql' -print)"
