name: Stage 17 reviewed-overlay retry v3

on:
  push:
    branches:
      - agent/stage17-reviewed-overlay
    paths:
      - .github/workflows/stage17-retry-v3.yml

permissions:
  contents: write

concurrency:
  group: stage17-reviewed-overlay-retry-v3
  cancel-in-progress: false

jobs:
  repair-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: ec62358d3754bc8eeba87f9f681c62436c2cdd0a
      EXPECTED_PREVIOUS_HEAD: 1cd598520c2b1c9c3741ebe56118065ff54c9b34
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage17-reviewed-overlay
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact retry base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PREVIOUS_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Replay Stage 17 implementation and generic fixture repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          def extract(workflow_path: str, name: str) -> str:
              lines = Path(workflow_path).read_text(encoding="utf-8").splitlines()
              marker = f"      - name: {name}"
              try:
                  index = lines.index(marker)
              except ValueError as exc:
                  raise SystemExit(f"missing source workflow step: {name}") from exc
              index += 1
              while index < len(lines) and lines[index] != "        run: |":
                  index += 1
              if index >= len(lines):
                  raise SystemExit(f"missing run block for source workflow step: {name}")
              index += 1
              output: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line.startswith("      - "):
                      break
                  if not line:
                      output.append("")
                  elif line.startswith("          "):
                      output.append(line[10:])
                  else:
                      raise SystemExit(
                          f"unexpected source workflow indentation in {name}: {line!r}"
                      )
                  index += 1
              return "\n".join(output) + "\n"

          steps = [
              (".github/workflows/stage17-validation.yml", "Add immutable reviewed overlay domain"),
              (".github/workflows/stage17-validation.yml", "Add persistence read service and end-to-end regression"),
              (".github/workflows/stage17-validation.yml", "Update Stage 17 documentation"),
              (".github/workflows/stage17-retry.yml", "Repair generic evidence fixtures"),
          ]
          for number, (workflow, name) in enumerate(steps, start=1):
              script = Path(os.environ["RUNNER_TEMP"]) / f"stage17-v3-{number}.sh"
              script.write_text(extract(workflow, name), encoding="utf-8")
              subprocess.run(
                  ["bash", "-euo", "pipefail", str(script)],
                  check=True,
                  env=os.environ.copy(),
              )
          PY

      - name: Align publication and malformed-path regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/persistence/reviewed-overlay-persistence.test.ts")
          lines = path.read_text(encoding="utf-8").splitlines()

          def find_stripped(value: str, start: int = 0) -> int:
              matches = [
                  index
                  for index in range(start, len(lines))
                  if lines[index].strip() == value
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Stage 17 marker count mismatch for {value!r}: {matches}"
                  )
              return matches[0]

          table = find_stripped("it.each([")
          expected_rows = [
              '["approved", "approved", "known"],',
              '["rejected", "rejected", "omitted"],',
              '["needs_more_evidence", "needs_more_evidence", "omitted"],',
          ]
          for offset, expected in enumerate(expected_rows, start=1):
              if lines[table + offset].strip() != expected:
                  raise SystemExit("Stage 17 publication table row mismatch")
          row_indent = lines[table + 1][:-len(lines[table + 1].lstrip())]
          lines[table + 1] = row_indent + '["approved", "approved", true],'
          lines[table + 2] = row_indent + '["rejected", "rejected", false],'
          lines[table + 3] = row_indent + '["needs_more_evidence", "needs_more_evidence", false],'

          callback = find_stripped(
              "async (decision, expectedReviewState, expectedFacet) => {"
          )
          callback_indent = lines[callback][:-len(lines[callback].lstrip())]
          lines[callback] = (
              callback_indent
              + "async (decision, expectedReviewState, expectedPublish) => {"
          )

          before = find_stripped("expect(publicBefore.publish).toBe(true);")
          if lines[before + 1].strip() != "if (publicBefore.publish)":
              raise SystemExit("Stage 17 pre-overlay conditional mismatch")
          if (
              lines[before + 2].strip()
              != 'expect(publicBefore.value.edition.state).toBe("omitted");'
          ):
              raise SystemExit("Stage 17 pre-overlay facet mismatch")
          before_indent = lines[before][:-len(lines[before].lstrip())]
          lines[before : before + 3] = [
              before_indent + "expect(publicBefore.publish).toBe(false);"
          ]

          after = find_stripped("expect(effective.publish).toBe(true);")
          if lines[after + 1].strip() != "if (effective.publish)":
              raise SystemExit("Stage 17 post-overlay conditional mismatch")
          if (
              lines[after + 2].strip()
              != "expect(effective.value.edition.state).toBe(expectedFacet);"
          ):
              raise SystemExit("Stage 17 post-overlay facet mismatch")
          after_indent = lines[after][:-len(lines[after].lstrip())]
          child_indent = lines[after + 2][:-len(lines[after + 2].lstrip())]
          lines[after : after + 3] = [
              after_indent + "expect(effective.publish).toBe(expectedPublish);",
              after_indent + "if (expectedPublish && effective.publish)",
              child_indent + 'expect(effective.value.edition.state).toBe("known");',
          ]

          indexed = find_stripped('"required_books.0",')
          del lines[indexed]
          loop = find_stripped("for (const fieldPath of [")
          close = find_stripped("});", loop)
          base = lines[loop][:-len(lines[loop].lstrip())]
          addition = [
              "",
              base + "await expect(",
              base + "  overlayService.loadReviewedGraph(",
              base + '    target({ fieldPath: "required_books.0" }),',
              base + "  ),",
              base + ").rejects.toThrow(/target is invalid/iu);",
          ]
          lines[close + 1 : close + 1] = addition

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Format and remove temporary workflows
        run: |
          set -euo pipefail
          npm run format
          rm -f .github/workflows/stage17-validation.yml
          rm -f .github/workflows/stage17-retry.yml
          rm -f .github/workflows/stage17-retry-v2.yml
          rm -f .github/workflows/stage17-retry-v3.yml

      - name: Verify exact Stage 17 scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/stage17-validation.yml",
              ".github/workflows/stage17-retry.yml",
              ".github/workflows/stage17-retry-v2.yml",
              ".github/workflows/stage17-retry-v3.yml",
              "docs/ARCHITECTURE.md",
              "docs/DATA_MODEL.md",
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "src/reviewed-overlay.ts",
              "src/reviewed-overlay.test.ts",
              "src/persistence/reviewed-overlay-service.ts",
              "src/persistence/reviewed-overlay-persistence.test.ts",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"unexpected Stage 17 paths: {unexpected}")
          if missing:
              raise SystemExit(f"required Stage 17 paths did not change: {missing}")
          PY

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git checkout -- tsconfig.json

      - name: Run source guards and Python regression
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          trap 'mv "$RUNNER_TEMP/node_modules" node_modules 2>/dev/null || true' EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          mv "$RUNNER_TEMP/node_modules" node_modules
          trap - EXIT
          python -m unittest discover -s tests

      - name: Run browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e
          git checkout -- tsconfig.json

      - name: Publish exact validated Stage 17 candidate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/stage17-validation.yml
          test ! -e .github/workflows/stage17-retry.yml
          test ! -e .github/workflows/stage17-retry-v2.yml
          test ! -e .github/workflows/stage17-retry-v3.yml
          grep -q 'materializeReviewedEnvelope' src/reviewed-overlay.ts
          grep -q 'PostgresReviewedOverlayService' src/persistence/reviewed-overlay-service.ts
          grep -q 'D-039 — Read-only exact-metadata reviewed overlays' docs/DECISIONS.md
          grep -q 'Stage 17 repository delivery' docs/ROADMAP.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/ARCHITECTURE.md \
            docs/DATA_MODEL.md \
            docs/DECISIONS.md \
            docs/ROADMAP.md \
            src/reviewed-overlay.ts \
            src/reviewed-overlay.test.ts \
            src/persistence/reviewed-overlay-service.ts \
            src/persistence/reviewed-overlay-persistence.test.ts
          git add -u \
            .github/workflows/stage17-validation.yml \
            .github/workflows/stage17-retry.yml \
            .github/workflows/stage17-retry-v2.yml \
            .github/workflows/stage17-retry-v3.yml
          git commit -m 'feat(review): add immutable reviewed overlays for issue 117'
          git push origin HEAD:agent/stage17-reviewed-overlay
