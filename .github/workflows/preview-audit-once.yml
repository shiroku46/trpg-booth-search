name: Preview Audit Once

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: preview-audit-once
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event.issue.number == 92 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/run-preview-audit' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 700915f056d21be6d1ec75bd553c1a1c64760d06
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Enforce dependency advisory boundary
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          node - "$RUNNER_TEMP/audit-production.json" "$RUNNER_TEMP/audit-all.json" <<'JS'
          const fs = require("node:fs");
          const [productionPath, allPath] = process.argv.slice(2);
          const production = JSON.parse(fs.readFileSync(productionPath, "utf8"));
          const all = JSON.parse(fs.readFileSync(allPath, "utf8"));
          const productionCounts = production.metadata?.vulnerabilities ?? {};
          const allCounts = all.metadata?.vulnerabilities ?? {};
          console.log(`production audit: ${JSON.stringify(productionCounts)}`);
          console.log(`all dependency audit: ${JSON.stringify(allCounts)}`);
          if ((productionCounts.total ?? 0) !== 0)
            throw new Error("Production dependency audit must be clean.");
          if ((allCounts.high ?? 0) !== 0 || (allCounts.critical ?? 0) !== 0)
            throw new Error("High or critical dependency advisory remains.");
          JS
      - run: npm ls @playwright/test next react react-dom vitest
      - run: git diff --exit-code
