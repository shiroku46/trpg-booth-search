      - name: Format and verify exact Stage 18 scope
        run: |
          set -euo pipefail
          npm run format
          rm -f .github/workflows/stage18-validation.yml
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/stage18-validation.yml",
              "docs/ARCHITECTURE.md",
              "docs/DATA_MODEL.md",
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "src/reviewed-overlay-batch.ts",
              "src/reviewed-overlay-batch.test.ts",
              "src/persistence/reviewed-overlay-batch-service.ts",
              "src/persistence/reviewed-overlay-batch-persistence.test.ts",
          }
          committed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          working = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          untracked = set(subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines())
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"unexpected Stage 18 paths: {unexpected}")
          if missing:
              raise SystemExit(f"required Stage 18 paths did not change: {missing}")
          PY

