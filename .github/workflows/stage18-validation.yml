              Successful approved, rejected, and needs-more-evidence overlays are preserved. Every omitted target remains visible with a bounded reason; omission never becomes approval or false. Duplicate and cross-product requests are rejected. No latest-case, latest-decision, active-version, array-index, or repeated-row identity heuristic is allowed.

              Composition is read-only and adds no table, migration, source mutation, UI, authentication, hosted resource, BOOTH access, or AI inference. This decision is implemented by Issue #119.
