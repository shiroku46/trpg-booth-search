              Each target produces an immutable report entry. Approved, rejected, and needs-more-evidence outcomes are materialized as review states; unapplied, stale, mismatched, malformed, metadata-divergent, missing, and unsupported targets remain explicit omissions. A target omission does not erase earlier safe overlays, and the unchanged publication projection remains responsible for final field and scenario eligibility.

