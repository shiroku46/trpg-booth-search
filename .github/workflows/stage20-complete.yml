name: Stage 20 Complete

on:
  push:
    branches:
      - agent/stage20-reviewed-search-request

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage20-reviewed-search-request
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Add Stage 20 unit tests
        run: |
          cat > src/reviewed-search.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { fixtureRepository } from "../fixtures";
          import type { PublicScenario } from "./domain";
          import { project } from "./publication";
          import type { ReviewedPublicationIndexResult } from "./reviewed-publication-index";
          import {
            executeReviewedSearch,
            normalizeReviewedSearchQuery,
          } from "./reviewed-search";
          import {
            EMPTY_QUERY,
            SORT_ORDERS,
            searchPublicRows,
            type CanonicalSearchQuery,
          } from "./search";

          function publicRows(): PublicScenario[] {
            const products = new Map(
              fixtureRepository.products().map((item) => [item.id, item]),
            );
            return fixtureRepository
              .scenarios()
              .map((item) => project(products.get(item.productId), item))
              .filter(
                (decision): decision is Extract<typeof decision, { publish: true }> =>
                  decision.publish,
              )
              .map((decision) => decision.value);
          }

          function index(): ReviewedPublicationIndexResult {
            return {
              rows: publicRows(),
              report: [
                {
                  state: "missing_product",
                  productId: "33333333-3333-4333-8333-333333333333",
                },
              ],
            };
          }

          describe("Stage 20 deterministic reviewed search", () => {
            it("executes the default query and deeply detaches the result", () => {
              const source = index();
              const before = JSON.stringify(source);
              const result = executeReviewedSearch(source);
              expect(result.query).toEqual(EMPTY_QUERY);
              expect(result.rows).toEqual(searchPublicRows(source.rows, EMPTY_QUERY));
              expect(result.publicationReport).toEqual(source.report);
              expect(JSON.stringify(source)).toBe(before);
              expect(result.rows).not.toBe(source.rows);
              expect(result.publicationReport).not.toBe(source.report);
              expect(Object.isFrozen(result)).toBe(true);
              expect(Object.isFrozen(result.query)).toBe(true);
              expect(Object.isFrozen(result.rows)).toBe(true);
              expect(Object.isFrozen(result.publicationReport)).toBe(true);
            });

            it("normalizes keyword whitespace without mutating the input query", () => {
              const query: CanonicalSearchQuery = {
                ...EMPTY_QUERY,
                keyword: "  合成  ",
                tags: { ...EMPTY_QUERY.tags },
              };
              const before = JSON.stringify(query);
              const normalized = normalizeReviewedSearchQuery(query);
              expect(normalized.keyword).toBe("合成");
              expect(JSON.stringify(query)).toBe(before);
              expect(normalized.tags).not.toBe(query.tags);
            });

            it.each(SORT_ORDERS)("matches public-row search for %s sorting", (sort) => {
              const source = index();
              const query: CanonicalSearchQuery = {
                ...EMPTY_QUERY,
                sort,
                seed: "stage20-seed",
                tags: { ...EMPTY_QUERY.tags },
              };
              const result = executeReviewedSearch(source, { query });
              expect(result.rows).toEqual(searchPublicRows(source.rows, query));
            });

            it("keeps seeded-random ordering deterministic", () => {
              const source = index();
              const query: CanonicalSearchQuery = {
                ...EMPTY_QUERY,
                sort: "random",
                seed: "fixed-seed",
                tags: { ...EMPTY_QUERY.tags },
              };
              const first = executeReviewedSearch(source, { query });
              const second = executeReviewedSearch(source, { query });
              expect(second).toEqual(first);
            });
          });
          EOF
      - name: Add Stage 20 persistence integration
        run: |
          cat > src/persistence/reviewed-search-persistence.test.ts <<'EOF'
          import { PGlite } from "@electric-sql/pglite";
          import { afterEach, describe, expect, it } from "vitest";
          import type { EvidencedValue, Product, Scenario, ScenarioTags } from "../domain";
          import { EMPTY_QUERY } from "../search";
          import { applyCommittedMigrations, createPersistenceDatabase } from "./database";
          import { PostgresProductScenarioRepository, type StoredGraphInput } from "./repository";
          import { PostgresReviewedSearchService } from "./reviewed-search-service";

          const clients: PGlite[] = [];
          const PRODUCT_A = "11111111-1111-4111-8111-111111111111";
          const PRODUCT_B = "22222222-2222-4222-8222-222222222222";
          const SCENARIO_A = "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa";
          const SCENARIO_B = "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb";
          const BASE_TIME = "2026-08-06T00:00:00Z";

          function known<T>(value: T): EvidencedValue<T> {
            return {
              state: "known",
              value,
              confidence: "high",
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              contentVersion: "content-v1",
              checkedAt: BASE_TIME,
            };
          }

          function tags(): ScenarioTags {
            const list = known<readonly string[]>(["synthetic"]);
            return {
              genre: list,
              tone: list,
              setting: list,
              structure: list,
              content: list,
            };
          }

          function graph(productId: string, scenarioId: string, title: string): StoredGraphInput {
            const product: Product = {
              id: productId,
              canonicalUrl: `https://booth.pm/ja/items/${productId.slice(0, 8)}`,
              title: `商品-${title}`,
              salesState: known("available"),
              sourcePublicationDate: known("2026-08-01T00:00:00Z"),
              firstSeenAt: BASE_TIME,
              lastCheckedAt: BASE_TIME,
              allAges: known("all_ages_confirmed"),
              classification: {
                ...known("scenario_single"),
                normalizerVersion: "normalizer-v1",
                registryVersion: "registry-v1",
              },
            };
            const scenario: Scenario = {
              id: scenarioId,
              productId,
              title: known(title),
              playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
              edition: known("テスト版"),
              playTimeMinutes: known({ minimumMinutes: 120, maximumMinutes: 180 }),
              modality: known("online"),
              tags: tags(),
              requiredBooks: [],
              compatibility: [],
              separationApproved: true,
              relationships: [],
            };
            return {
              product,
              sourceProductId: productId.slice(0, 8),
              contentVersion: "content-v1",
              currentRecordUpdatedAt: BASE_TIME,
              scenarios: [scenario],
              normalizationHistory: [],
            };
          }

          afterEach(async () => {
            await Promise.all(clients.splice(0).map((client) => client.close()));
          });

          describe("Stage 20 persistence-backed reviewed search", () => {
            it("composes explicit product requests with one query and preserves reports", async () => {
              const client = new PGlite();
              clients.push(client);
              await applyCommittedMigrations(client);
              const { db } = createPersistenceDatabase(client);
              const repository = new PostgresProductScenarioRepository(db);
              await repository.saveGraph(graph(PRODUCT_A, SCENARIO_A, "Alpha"));
              await repository.saveGraph(graph(PRODUCT_B, SCENARIO_B, "Beta"));
              const service = new PostgresReviewedSearchService(db);
              const beforeA = await repository.loadGraph(PRODUCT_A);
              const beforeB = await repository.loadGraph(PRODUCT_B);

              const query = {
                ...EMPTY_QUERY,
                keyword: "  Alpha  ",
                tags: { ...EMPTY_QUERY.tags },
              };
              const forward = await service.search({
                products: [
                  { productId: PRODUCT_B, targets: [] },
                  { productId: PRODUCT_A, targets: [] },
                  {
                    productId: "33333333-3333-4333-8333-333333333333",
                    targets: [],
                  },
                ],
                query,
              });
              const reverse = await service.search({
                products: [
                  {
                    productId: "33333333-3333-4333-8333-333333333333",
                    targets: [],
                  },
                  { productId: PRODUCT_A, targets: [] },
                  { productId: PRODUCT_B, targets: [] },
                ],
                query,
              });

              expect(reverse).toEqual(forward);
              expect(forward.query.keyword).toBe("Alpha");
              expect(forward.rows.map((row) => row.title)).toEqual(["Alpha"]);
              expect(forward.publicationReport).toMatchObject([
                { state: "projected", productId: PRODUCT_A },
                { state: "projected", productId: PRODUCT_B },
                {
                  state: "missing_product",
                  productId: "33333333-3333-4333-8333-333333333333",
                },
              ]);
              expect(await repository.loadGraph(PRODUCT_A)).toEqual(beforeA);
              expect(await repository.loadGraph(PRODUCT_B)).toEqual(beforeB);
              expect(Object.isFrozen(forward)).toBe(true);
            });
          });
          EOF
      - name: Complete Stage 20 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/ARCHITECTURE.md': '''\n\n## Stage 20 reviewed search orchestration\n\nStage 20 composes the Stage 19 explicit reviewed publication-index service with the existing `searchPublicRows` function. It normalizes one supplied canonical query, executes only over already-public rows, and returns the unchanged publication/review report beside the filtered result set. It does not enumerate storage, select historical versions, or introduce a new ranking model.\n''',
            'docs/DATA_MODEL.md': '''\n\n## Stage 20 reviewed search result\n\nA reviewed search result contains a detached canonical query, detached immutable public rows, and the full Stage 19 publication report. The report is not filtered to match search rows: missing products, review omissions, and unpublished scenarios remain auditable even when the search query returns a narrower result set.\n''',
            'docs/DECISIONS.md': '''\n\n## D-041 — Search orchestration operates only on reviewed public rows\n\n**Decision:** Persistence-backed reviewed search must resolve explicit product/target requests through Stage 19, then delegate filtering and ordering exclusively to the existing `searchPublicRows` semantics.\n\n**Rationale:** Keeping publication and search as separate deterministic read steps prevents raw-source bypasses, hidden product discovery, ranking drift, and mutable query-state coupling.\n\n**Consequences:** Stage 20 adds no cache/history table, API route, analytics event, provider, external request, UI behavior, or new ranking signal.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 20 — Deterministic reviewed search orchestration\n\n- [x] Normalize one canonical query without changing existing search semantics.\n- [x] Execute only over Stage 19 reviewed public rows.\n- [x] Preserve the complete immutable publication/review report beside search results.\n- [x] Compose persistence-backed explicit product requests with reviewed search.\n- [x] Prove search parity, seeded-random determinism, request-order independence, and storage immutability.\n''',
          }
          for name, section in sections.items():
            path = Path(name)
            text = path.read_text(encoding='utf-8')
            heading = next(line for line in section.splitlines() if line.startswith('## '))
            if heading not in text:
              path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Format Stage 20 files
        run: npx prettier --write src/reviewed-search.ts src/reviewed-search.test.ts src/persistence/reviewed-search-service.ts src/persistence/reviewed-search-persistence.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Stage 20 completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE.md docs/DATA_MODEL.md docs/DECISIONS.md docs/ROADMAP.md src/reviewed-search.ts src/reviewed-search.test.ts src/persistence/reviewed-search-service.ts src/persistence/reviewed-search-persistence.test.ts
          git commit -m "feat(stage20): complete reviewed search orchestration"
          git push origin HEAD:agent/stage20-reviewed-search-request
