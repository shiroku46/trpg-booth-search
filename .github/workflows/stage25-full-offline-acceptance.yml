name: Stage 25 Full Offline Acceptance

on:
  push:
    branches:
      - ops/stage25-full-offline-acceptance

permissions: {}

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0b5b7b88568d57eb2664c2802524a8ea6859cdb9
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify exact reviewed main
        run: test "$(git rev-parse HEAD)" = "0b5b7b88568d57eb2664c2802524a8ea6859cdb9"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run repository and export guards
        run: |
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests
      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run full local Playwright suite
        env:
          PREVIEW_BASE_URL: ""
        run: npm run test:e2e
