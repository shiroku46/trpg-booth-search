name: Stage 8 Exact-SHA Fix Runner

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage8-fix-runner
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.number == 84 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/apply-stage8-fix-v3' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage8-issue-79-collection-pilot
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch and exact temporary main chain
        env:
          EXPECTED_HEAD: e5bae9d33b5509d0322d9a5c7c0108fbc91135ab
          EXPECTED_MAIN_PARENT: e9624715feefd628054f84cc9251a2ae6239d878
          APPLIER_COMMIT: 8edd2fb218fe7d5060808831b19e903565159dfb
          ORIGINAL_MAIN: 9f9a12212112c000fef82fbb86c14eb07fcd7d38
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main^)" = "$EXPECTED_MAIN_PARENT"
          test "$(git rev-parse origin/main^^)" = "$APPLIER_COMMIT"
          test "$(git rev-parse origin/main^^^)" = "$ORIGINAL_MAIN"
          test "$(git diff --name-only origin/main^..origin/main)" = ".github/workflows/stage8-fix-runner.yml"
          test "$(git diff --name-only origin/main^^..origin/main^)" = ".github/workflows/stage8-fix-runner.yml"
          test "$(git diff --name-only origin/main^^^..origin/main^^)" = ".github/workflows/stage8-fix-applier.yml"

      - name: Merge main and install reviewed replacement files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main || true
          test "$(git diff --name-only --diff-filter=U)" = ".github/workflows/booth-collection-pilot.yml"
          git show origin/main:.github/workflows/stage8-fix-applier.yml \
            | awk 'BEGIN{p=0} /<<'\''PAYLOAD'\''/{p=1;next} /^PAYLOAD$/{p=0} p{print}' \
            > "$RUNNER_TEMP/stage8-fix.tar.xz.b64"
          test -s "$RUNNER_TEMP/stage8-fix.tar.xz.b64"
          base64 -d "$RUNNER_TEMP/stage8-fix.tar.xz.b64" | tar -xJf - -C .
          git rm -f .github/workflows/stage8-fix-applier.yml .github/workflows/stage8-fix-runner.yml
          git add .github/workflows/booth-collection-pilot.yml scripts/booth_collection_pilot.py tests/test_booth_collection_pilot.py
          test -z "$(git diff --name-only --diff-filter=U)"
          expected=$(printf '%s\n' '.github/workflows/booth-collection-pilot.yml' 'scripts/booth_collection_pilot.py' 'tests/test_booth_collection_pilot.py')
          test "$(git diff --cached --name-only)" = "$expected"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Run repository and Python gates
        run: |
          set -euo pipefail
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests

      - name: Run existing Node gates
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
            npm run format:check
            npm run lint
            npm run typecheck
            npm test
            npm run build
          fi

      - name: Commit exact merge result and push existing PR branch
        run: |
          set -euo pipefail
          git commit -m 'fix(stage8): stabilize policy digest and merge main'
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin HEAD:fix/stage8-issue-79-collection-pilot
