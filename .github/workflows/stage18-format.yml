name: Stage 18 Format

on:
  push:
    branches:
      - agent/stage18-reviewed-overlay-batch

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage18-reviewed-overlay-batch
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Format and remove temporary workflow
        run: |
          npx prettier --write src/reviewed-overlay-batch.ts src/persistence/reviewed-overlay-batch-service.ts
          rm .github/workflows/stage18-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/reviewed-overlay-batch.ts src/persistence/reviewed-overlay-batch-service.ts .github/workflows/stage18-format.yml
          git commit -m "style(stage18): apply repository Prettier"
          git push origin HEAD:agent/stage18-reviewed-overlay-batch
