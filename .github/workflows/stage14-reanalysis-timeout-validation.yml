name: Stage 14 migration-aware final validation

on:
  push:
    branches:
      - agent/stage14-reanalysis-tracking
    paths:
      - .github/workflows/stage14-reanalysis-timeout-validation.yml

permissions:
  contents: write

concurrency:
  group: stage14-reanalysis-timeout-validation
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage14-reanalysis-tracking
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Apply schema/docs and migration-aware test budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/stage14-reanalysis-retry.yml").read_text(
              encoding="utf-8"
          )
          opening = "          python3 - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          program = textwrap.dedent(source[start:end])
          exec(compile(program, "stage14-schema-docs", "exec"), {})

          test_path = Path("src/persistence/persistence.test.ts")
          test_source = test_path.read_text(encoding="utf-8")
          marker = '''
            });

            it("preserves true, false, unknown, and missing free evidence without null coercion", async () => {
          '''
          replacement = '''
            }, 15_000);

            it("preserves true, false, unknown, and missing free evidence without null coercion", async () => {
          '''
          if test_source.count(marker) != 1:
              raise SystemExit("Stage 9 dump/restore timeout marker mismatch")
          test_path.write_text(test_source.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Format TypeScript sources
        run: npm run format
      - name: Generate the Stage 14 Drizzle migration
        run: |
          set -euo pipefail
          npx drizzle-kit generate --name=stage14_reanalysis_tracking
          migration="$(find drizzle -maxdepth 1 -type f -name '0002_*stage14_reanalysis_tracking.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          test "$(find drizzle -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 3
          grep -q 'record_kind' "$migration"
          grep -q 'content_version_old' "$migration"
          grep -q 'normalization_history_transition_shape_ck' "$migration"
      - name: Verify exact Stage 14 allowlist
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess

          allowed = {
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "docs/PHYSICAL_SCHEMA.md",
              "docs/DATA_MODEL.md",
              "src/reanalysis.ts",
              "src/reanalysis.test.ts",
              "src/persistence/schema.ts",
              "src/persistence/reanalysis-repository.ts",
              "src/persistence/reanalysis-persistence.test.ts",
              "src/persistence/persistence.test.ts",
              "drizzle/0002_stage14_reanalysis_tracking.sql",
              "drizzle/meta/0002_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          transports = {
              ".github/workflows/stage14-reanalysis-validation.yml",
              ".github/workflows/stage14-reanalysis-retry.yml",
              ".github/workflows/stage14-reanalysis-final.yml",
              ".github/workflows/stage14-reanalysis-verified.yml",
              ".github/workflows/stage14-reanalysis-timeout-validation.yml",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed - transports)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Stage 14 paths did not change: {missing}")
          status = subprocess.check_output(
              ["git", "diff", "--name-status", "origin/main...HEAD"], text=True
          ) + subprocess.check_output(["git", "diff", "--name-status"], text=True)
          if any(line.startswith(("R", "C")) for line in status.splitlines()):
              raise SystemExit("renames or copies are outside the Stage 14 allowlist")
          PY
      - name: Run migration and product quality gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Run repository guards without dependency-tree false positives
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          restore_dependencies() {
            if [ -d "$RUNNER_TEMP/node_modules" ] && [ ! -d node_modules ]; then
              mv "$RUNNER_TEMP/node_modules" node_modules
            fi
          }
          trap restore_dependencies EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          restore_dependencies
          trap - EXIT
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests
      - name: Build production application
        run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify unchanged Design B browser suite
        run: npm run test:e2e
      - name: Remove validation transports and publish verified Stage 14 commit
        run: |
          set -euo pipefail
          rm .github/workflows/stage14-reanalysis-validation.yml
          rm .github/workflows/stage14-reanalysis-retry.yml
          rm .github/workflows/stage14-reanalysis-final.yml
          rm .github/workflows/stage14-reanalysis-verified.yml
          rm .github/workflows/stage14-reanalysis-timeout-validation.yml
          git checkout -- tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/ROADMAP.md docs/PHYSICAL_SCHEMA.md docs/DATA_MODEL.md src/reanalysis.ts src/reanalysis.test.ts src/persistence/schema.ts src/persistence/reanalysis-repository.ts src/persistence/reanalysis-persistence.test.ts src/persistence/persistence.test.ts drizzle/0002_stage14_reanalysis_tracking.sql drizzle/meta/0002_snapshot.json drizzle/meta/_journal.json
          git add -u .github/workflows/stage14-reanalysis-validation.yml .github/workflows/stage14-reanalysis-retry.yml .github/workflows/stage14-reanalysis-final.yml .github/workflows/stage14-reanalysis-verified.yml .github/workflows/stage14-reanalysis-timeout-validation.yml
          git commit -m 'feat(reanalysis): add deterministic transition tracking for issue 109'
          git push origin HEAD:agent/stage14-reanalysis-tracking
