name: Stage 17 reviewed-overlay validation

on:
  push:
    branches:
      - agent/stage17-reviewed-overlay
    paths:
      - .github/workflows/stage17-validation.yml

permissions:
  contents: write

concurrency:
  group: stage17-reviewed-overlay
  cancel-in-progress: false

jobs:
  implement-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: ec62358d3754bc8eeba87f9f681c62436c2cdd0a
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage17-reviewed-overlay
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact Stage 17 base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Add immutable reviewed overlay domain
        run: |
          cat > src/reviewed-overlay.ts <<'EOF'
          import {
            TAG_CATEGORIES,
            type EvidencedValue,
            type Product,
            type ReviewState,
            type Scenario,
            type TagCategory,
          } from "./domain";
          import {
            assertReviewApplicationTarget,
            type EffectiveReviewProjection,
            type ReviewApplicationTarget,
          } from "./review-application";
          import { assertReviewSnapshot, type ReviewSnapshot } from "./review";

          export const PRODUCT_REVIEW_FIELD_PATHS = [
            "sales_state",
            "source_publication_date",
            "is_free",
            "all_ages",
            "classification",
          ] as const;
          export const SCENARIO_REVIEW_FIELD_PATHS = [
            "title",
            "player_count",
            "edition",
            "play_time_minutes",
            "modality",
            "tags.genre",
            "tags.tone",
            "tags.setting",
            "tags.structure",
            "tags.content",
          ] as const;
          export const UNSUPPORTED_ARRAY_REVIEW_FIELD_PATHS = [
            "required_books",
            "compatibility",
            "relationships",
          ] as const;

          export type ReviewedOverlayOmissionReason =
            | "unapplied"
            | "target_mismatch"
            | "stale_version"
            | "metadata_mismatch"
            | "malformed"
            | "unsupported_field"
            | "field_missing"
            | "entity_missing";

          export type ReviewedEnvelopeResult<E extends EvidencedValue<unknown>> =
            | {
                state: "materialized";
                value: E;
                effectiveReviewState: ReviewState;
                target: ReviewApplicationTarget;
              }
            | {
                state: "omitted";
                reason: ReviewedOverlayOmissionReason;
                target: ReviewApplicationTarget;
              };

          export type ReviewedGraphOverlayResult =
            | {
                state: "materialized";
                product: Product;
                scenarios: readonly Scenario[];
                effectiveReviewState: ReviewState;
                target: ReviewApplicationTarget;
              }
            | {
                state: "omitted";
                reason: ReviewedOverlayOmissionReason;
                target: ReviewApplicationTarget;
              };

          function detach<T>(value: T): T {
            if (Array.isArray(value))
              return value.map((item) => detach(item)) as T;
            if (value && typeof value === "object") {
              const copy: Record<string, unknown> = {};
              for (const [key, nested] of Object.entries(
                value as Record<string, unknown>,
              ))
                copy[key] = detach(nested);
              return copy as T;
            }
            return value;
          }

          function deepFreeze<T>(value: T): T {
            if (value && typeof value === "object" && !Object.isFrozen(value)) {
              Object.freeze(value);
              for (const nested of Object.values(value as Record<string, unknown>))
                deepFreeze(nested);
            }
            return value;
          }

          function sameIdentity(
            left: ReviewApplicationTarget,
            right: ReviewApplicationTarget,
          ): boolean {
            return (
              left.productId === right.productId &&
              left.entityType === right.entityType &&
              left.entityId === right.entityId &&
              left.fieldPath === right.fieldPath
            );
          }

          function sameVersion(
            left: ReviewApplicationTarget,
            right: ReviewApplicationTarget,
          ): boolean {
            return (
              left.versionKey.contentVersion === right.versionKey.contentVersion &&
              left.versionKey.normalizerVersion === right.versionKey.normalizerVersion &&
              left.versionKey.registryVersion === right.versionKey.registryVersion
            );
          }

          function omitted(
            reason: ReviewedOverlayOmissionReason,
            target: ReviewApplicationTarget,
          ): ReviewedGraphOverlayResult {
            return deepFreeze({
              state: "omitted",
              reason,
              target: detach(target),
            });
          }

          function envelopeOmitted<E extends EvidencedValue<unknown>>(
            reason: ReviewedOverlayOmissionReason,
            target: ReviewApplicationTarget,
          ): ReviewedEnvelopeResult<E> {
            return deepFreeze({
              state: "omitted",
              reason,
              target: detach(target),
            });
          }

          function metadataMatches(
            source: EvidencedValue<unknown>,
            snapshot: ReviewSnapshot,
          ): boolean {
            const hasConflict = source.conflictReason !== undefined;
            const holdReason = source.state === "hold" ? source.holdReason : null;
            const containsAiEvidence = source.evidence.some(
              (item) => item.method === "ai_candidate",
            );
            return (
              source.state === snapshot.evidencedState &&
              source.confidence === snapshot.confidence &&
              source.reviewState === snapshot.initialReviewState &&
              source.evidence.length === snapshot.evidenceCount &&
              hasConflict === snapshot.hasConflict &&
              holdReason === snapshot.holdReason &&
              containsAiEvidence === snapshot.containsAiEvidence
            );
          }

          export function isSupportedReviewField(
            target: ReviewApplicationTarget,
          ): boolean {
            if (target.entityType === "booth_product")
              return (PRODUCT_REVIEW_FIELD_PATHS as readonly string[]).includes(
                target.fieldPath,
              );
            return (SCENARIO_REVIEW_FIELD_PATHS as readonly string[]).includes(
              target.fieldPath,
            );
          }

          export function materializeReviewedEnvelope<
            E extends EvidencedValue<unknown>,
          >(
            source: E,
            snapshot: ReviewSnapshot,
            projection: EffectiveReviewProjection,
            target: ReviewApplicationTarget,
          ): ReviewedEnvelopeResult<E> {
            try {
              assertReviewApplicationTarget(target);
              assertReviewApplicationTarget(projection.target);
              assertReviewSnapshot(snapshot);
            } catch {
              return envelopeOmitted("malformed", target);
            }

            if (!sameIdentity(projection.target, target))
              return envelopeOmitted("target_mismatch", target);
            if (!sameVersion(projection.target, target))
              return envelopeOmitted("stale_version", target);
            if (
              snapshot.versionKey.contentVersion !==
                target.versionKey.contentVersion ||
              snapshot.versionKey.normalizerVersion !==
                target.versionKey.normalizerVersion ||
              snapshot.versionKey.registryVersion !== target.versionKey.registryVersion ||
              source.contentVersion !== target.versionKey.contentVersion
            )
              return envelopeOmitted("stale_version", target);
            if (!metadataMatches(source, snapshot))
              return envelopeOmitted("metadata_mismatch", target);

            let effectiveReviewState: ReviewState;
            if (projection.state === "approved") effectiveReviewState = "approved";
            else if (projection.reason === "rejected")
              effectiveReviewState = "rejected";
            else if (projection.reason === "needs_more_evidence")
              effectiveReviewState = "needs_more_evidence";
            else if (projection.reason === "target_mismatch")
              return envelopeOmitted("target_mismatch", target);
            else if (projection.reason === "stale_version")
              return envelopeOmitted("stale_version", target);
            else if (projection.reason === "unapplied")
              return envelopeOmitted("unapplied", target);
            else return envelopeOmitted("malformed", target);

            const value = detach({
              ...source,
              reviewState: effectiveReviewState,
            }) as E;
            return deepFreeze({
              state: "materialized",
              value,
              effectiveReviewState,
              target: detach(target),
            });
          }

          export function materializeReviewedGraph(
            product: Product,
            scenarios: readonly Scenario[],
            snapshot: ReviewSnapshot,
            projection: EffectiveReviewProjection,
            target: ReviewApplicationTarget,
          ): ReviewedGraphOverlayResult {
            try {
              assertReviewApplicationTarget(target);
            } catch {
              return omitted("malformed", target);
            }
            if (!isSupportedReviewField(target))
              return omitted("unsupported_field", target);
            if (product.id !== target.productId)
              return omitted("entity_missing", target);

            const productCopy = detach(product);
            const scenariosCopy = detach([...scenarios]);

            const apply = <E extends EvidencedValue<unknown>>(
              source: E,
              assign: (value: E) => void,
            ): ReviewedGraphOverlayResult => {
              const result = materializeReviewedEnvelope(
                source,
                snapshot,
                projection,
                target,
              );
              if (result.state === "omitted") return result;
              assign(result.value);
              return deepFreeze({
                state: "materialized",
                product: productCopy,
                scenarios: scenariosCopy,
                effectiveReviewState: result.effectiveReviewState,
                target: detach(target),
              });
            };

            if (target.entityType === "booth_product") {
              if (target.entityId !== product.id)
                return omitted("entity_missing", target);
              switch (target.fieldPath) {
                case "sales_state":
                  return apply(product.salesState, (value) => {
                    productCopy.salesState = value;
                  });
                case "source_publication_date":
                  return apply(product.sourcePublicationDate, (value) => {
                    productCopy.sourcePublicationDate = value;
                  });
                case "is_free":
                  if (!product.isFree) return omitted("field_missing", target);
                  return apply(product.isFree, (value) => {
                    productCopy.isFree = value;
                  });
                case "all_ages":
                  return apply(product.allAges, (value) => {
                    productCopy.allAges = value;
                  });
                case "classification":
                  if (!product.classification)
                    return omitted("field_missing", target);
                  return apply(product.classification, (value) => {
                    productCopy.classification = value;
                  });
                default:
                  return omitted("unsupported_field", target);
              }
            }

            const index = scenarios.findIndex(
              (item) =>
                item.id === target.entityId && item.productId === target.productId,
            );
            if (index < 0) return omitted("entity_missing", target);
            const sourceScenario = scenarios[index]!;
            const targetScenario = scenariosCopy[index]!;

            switch (target.fieldPath) {
              case "title":
                return apply(sourceScenario.title, (value) => {
                  targetScenario.title = value;
                });
              case "player_count":
                return apply(sourceScenario.playerCount, (value) => {
                  targetScenario.playerCount = value;
                });
              case "edition":
                return apply(sourceScenario.edition, (value) => {
                  targetScenario.edition = value;
                });
              case "play_time_minutes":
                return apply(sourceScenario.playTimeMinutes, (value) => {
                  targetScenario.playTimeMinutes = value;
                });
              case "modality":
                return apply(sourceScenario.modality, (value) => {
                  targetScenario.modality = value;
                });
              default: {
                if (!target.fieldPath.startsWith("tags."))
                  return omitted("unsupported_field", target);
                const category = target.fieldPath.slice(5) as TagCategory;
                if (!(TAG_CATEGORIES as readonly string[]).includes(category))
                  return omitted("unsupported_field", target);
                return apply(sourceScenario.tags[category], (value) => {
                  targetScenario.tags[category] = value;
                });
              }
            }
          }
          EOF

          cat > src/reviewed-overlay.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import type { EvidencedValue, Product, Scenario } from "./domain";
          import type { EffectiveReviewProjection } from "./review-application";
          import type { ReviewSnapshot } from "./review";
          import {
            isSupportedReviewField,
            materializeReviewedEnvelope,
            materializeReviewedGraph,
          } from "./reviewed-overlay";

          const target = (overrides = {}) => ({
            productId: "11111111-1111-4111-8111-111111111111",
            entityType: "scenario" as const,
            entityId: "22222222-2222-4222-8222-222222222222",
            fieldPath: "edition",
            versionKey: {
              contentVersion: "content-v1",
              normalizerVersion: "normalizer-v1",
              registryVersion: "registry-v1",
            },
            ...overrides,
          });

          const source = (
            overrides: Partial<EvidencedValue<string>> = {},
          ): EvidencedValue<string> => ({
            state: "known",
            value: "テスト版",
            confidence: "high",
            reviewState: "unreviewed",
            evidence: [{ pointer: "synthetic", method: "ai_candidate" }],
            contentVersion: "content-v1",
            checkedAt: "2026-08-06T00:00:00Z",
            ...overrides,
          });

          const snapshot = (
            overrides: Partial<ReviewSnapshot> = {},
          ): ReviewSnapshot => ({
            evidencedState: "known",
            confidence: "high",
            initialReviewState: "unreviewed",
            evidenceCount: 1,
            hasConflict: false,
            holdReason: null,
            containsAiEvidence: true,
            versionKey: { ...target().versionKey },
            ...overrides,
          });

          const projection = (
            state: "approved" | "rejected" | "needs_more_evidence" = "approved",
            targetOverride = target(),
          ): EffectiveReviewProjection =>
            state === "approved"
              ? {
                  state: "approved",
                  applicationId: "50000000-0000-4000-8000-000000000001",
                  reviewCaseId: "30000000-0000-4000-8000-000000000001",
                  reviewDecisionEventId:
                    "40000000-0000-4000-8000-000000000001",
                  target: targetOverride,
                }
              : {
                  state: "omitted",
                  reason: state,
                  target: targetOverride,
                };

          const product = (): Product => ({
            id: target().productId,
            canonicalUrl: "https://booth.pm/ja/items/1234567",
            title: "合成商品",
            salesState: {
              ...source({ value: "available" as const }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
            sourcePublicationDate: {
              ...source({ value: "2026-08-01T00:00:00Z" }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
            firstSeenAt: "2026-08-06T00:00:00Z",
            lastCheckedAt: "2026-08-06T00:00:00Z",
            allAges: {
              ...source({ value: "all_ages_confirmed" as const }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
          });

          const scenario = (): Scenario => ({
            id: target().entityId,
            productId: target().productId,
            title: {
              ...source({ value: "合成シナリオ" }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
            playerCount: {
              ...source({ value: { minimumPlayers: 2, maximumPlayers: 4 } }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
            edition: source(),
            playTimeMinutes: {
              ...source({
                value: { minimumMinutes: 120, maximumMinutes: 180 },
              }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
            modality: {
              ...source({ value: "online" as const }),
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
            },
            tags: {
              genre: {
                ...source({ value: ["synthetic"] }),
                reviewState: "approved",
                evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              },
              tone: {
                ...source({ value: ["synthetic"] }),
                reviewState: "approved",
                evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              },
              setting: {
                ...source({ value: ["synthetic"] }),
                reviewState: "approved",
                evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              },
              structure: {
                ...source({ value: ["synthetic"] }),
                reviewState: "approved",
                evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              },
              content: {
                ...source({ value: ["synthetic"] }),
                reviewState: "approved",
                evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              },
            },
            requiredBooks: [],
            compatibility: [],
            separationApproved: true,
            relationships: [],
          });

          describe("Stage 17 immutable reviewed overlays", () => {
            it.each([
              ["approved", "approved"],
              ["rejected", "rejected"],
              ["needs_more_evidence", "needs_more_evidence"],
            ] as const)(
              "materializes %s by changing only review state",
              (decision, expected) => {
                const original = source();
                const result = materializeReviewedEnvelope(
                  original,
                  snapshot(),
                  projection(decision),
                  target(),
                );
                expect(result).toMatchObject({
                  state: "materialized",
                  effectiveReviewState: expected,
                  value: { reviewState: expected },
                });
                expect(original.reviewState).toBe("unreviewed");
                if (result.state === "materialized") {
                  expect(result.value).not.toBe(original);
                  expect(result.value.evidence).not.toBe(original.evidence);
                  expect(Object.isFrozen(result.value)).toBe(true);
                }
              },
            );

            it.each([
              ["state", source({ state: "unknown" }), snapshot()],
              ["confidence", source({ confidence: "medium" }), snapshot()],
              ["review state", source({ reviewState: "needs_more_evidence" }), snapshot()],
              ["evidence count", source({ evidence: [] }), snapshot()],
              [
                "conflict",
                source({ conflictReason: "conflict" }),
                snapshot(),
              ],
              [
                "AI evidence",
                source({
                  evidence: [{ pointer: "synthetic", method: "explicit_source" }],
                }),
                snapshot(),
              ],
            ] as const)("omits a %s metadata divergence", (_label, value, snap) => {
              expect(
                materializeReviewedEnvelope(
                  value as EvidencedValue<string>,
                  snap,
                  projection(),
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "metadata_mismatch" });
            });

            it("omits hold-reason and content-version divergence", () => {
              const held: EvidencedValue<string> = {
                state: "hold",
                holdReason: "hold_alias_conflict",
                confidence: "unresolved",
                reviewState: "needs_more_evidence",
                evidence: [],
                contentVersion: "content-v1",
                checkedAt: "2026-08-06T00:00:00Z",
              };
              const heldSnapshot = snapshot({
                evidencedState: "hold",
                confidence: "unresolved",
                initialReviewState: "needs_more_evidence",
                evidenceCount: 0,
                holdReason: "different_hold",
                containsAiEvidence: false,
              });
              expect(
                materializeReviewedEnvelope(
                  held,
                  heldSnapshot,
                  projection("needs_more_evidence"),
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "metadata_mismatch" });
              expect(
                materializeReviewedEnvelope(
                  source({ contentVersion: "content-v2" }),
                  snapshot(),
                  projection(),
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "stale_version" });
            });

            it("omits target, version, unapplied, and malformed projections", () => {
              expect(
                materializeReviewedEnvelope(
                  source(),
                  snapshot(),
                  projection("approved", target({ fieldPath: "title" })),
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "target_mismatch" });
              expect(
                materializeReviewedEnvelope(
                  source(),
                  snapshot(),
                  projection(
                    "approved",
                    target({
                      versionKey: {
                        ...target().versionKey,
                        registryVersion: "registry-v2",
                      },
                    }),
                  ),
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "stale_version" });
              expect(
                materializeReviewedEnvelope(
                  source(),
                  snapshot(),
                  { state: "omitted", reason: "unapplied", target: target() },
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "unapplied" });
              expect(
                materializeReviewedEnvelope(
                  source(),
                  { ...snapshot(), evidenceCount: -1 },
                  projection(),
                  target(),
                ),
              ).toMatchObject({ state: "omitted", reason: "malformed" });
            });

            it("routes only fixed fields and stable tag categories", () => {
              expect(isSupportedReviewField(target())).toBe(true);
              expect(
                isSupportedReviewField(target({ fieldPath: "tags.genre" })),
              ).toBe(true);
              for (const fieldPath of [
                "required_books",
                "compatibility",
                "relationships",
                "required_books.0",
              ])
                expect(isSupportedReviewField(target({ fieldPath }))).toBe(false);
            });

            it("materializes a detached graph field without changing source graph", () => {
              const originalProduct = product();
              const originalScenario = scenario();
              const result = materializeReviewedGraph(
                originalProduct,
                [originalScenario],
                snapshot(),
                projection(),
                target(),
              );
              expect(result).toMatchObject({
                state: "materialized",
                scenarios: [{ edition: { reviewState: "approved" } }],
              });
              expect(originalScenario.edition.reviewState).toBe("unreviewed");
              if (result.state === "materialized") {
                expect(result.product).not.toBe(originalProduct);
                expect(result.scenarios[0]).not.toBe(originalScenario);
                expect(Object.isFrozen(result.scenarios[0])).toBe(true);
              }
            });

            it("routes tag and optional product fields and fails closed when missing", () => {
              const tagTarget = target({ fieldPath: "tags.genre" });
              const tagSource = scenario();
              tagSource.tags.genre = source({ value: ["AI tag"] });
              expect(
                materializeReviewedGraph(
                  product(),
                  [tagSource],
                  snapshot(),
                  projection("approved", tagTarget),
                  tagTarget,
                ),
              ).toMatchObject({
                state: "materialized",
                scenarios: [{ tags: { genre: { reviewState: "approved" } } }],
              });

              const freeTarget = target({
                entityType: "booth_product",
                entityId: target().productId,
                fieldPath: "is_free",
              });
              expect(
                materializeReviewedGraph(
                  product(),
                  [scenario()],
                  snapshot(),
                  projection("approved", freeTarget),
                  freeTarget,
                ),
              ).toMatchObject({ state: "omitted", reason: "field_missing" });
            });
          });
          EOF

      - name: Add persistence read service and end-to-end regression
        run: |
          cat > src/persistence/reviewed-overlay-service.ts <<'EOF'
          import { and, eq } from "drizzle-orm";

          import {
            assertReviewApplicationTarget,
            type ReviewApplicationTarget,
          } from "../review-application";
          import type { ReviewSnapshot } from "../review";
          import {
            isSupportedReviewField,
            materializeReviewedGraph,
            type ReviewedGraphOverlayResult,
          } from "../reviewed-overlay";
          import type { PersistenceDatabase } from "./database";
          import { PostgresProductScenarioRepository } from "./repository";
          import { PostgresReviewApplicationRepository } from "./review-application-repository";
          import { reviewCase } from "./schema";

          function snapshotFromRow(row: typeof reviewCase.$inferSelect): ReviewSnapshot {
            return {
              evidencedState: row.evidencedState,
              confidence: row.confidence,
              initialReviewState: row.initialReviewState,
              evidenceCount: row.evidenceCount,
              hasConflict: row.hasConflict,
              holdReason: row.holdReason,
              containsAiEvidence: row.containsAiEvidence,
              versionKey: {
                contentVersion: row.contentVersion,
                normalizerVersion: row.normalizerVersion,
                registryVersion: row.registryVersion,
              },
            };
          }

          const omitted = (
            reason: "unapplied" | "unsupported_field" | "entity_missing",
            target: ReviewApplicationTarget,
          ): ReviewedGraphOverlayResult => ({ state: "omitted", reason, target });

          export class PostgresReviewedOverlayService {
            private readonly graphRepository: PostgresProductScenarioRepository;
            private readonly applicationRepository: PostgresReviewApplicationRepository;

            constructor(private readonly db: PersistenceDatabase) {
              this.graphRepository = new PostgresProductScenarioRepository(db);
              this.applicationRepository = new PostgresReviewApplicationRepository(db);
            }

            async loadReviewedGraph(
              target: ReviewApplicationTarget,
            ): Promise<ReviewedGraphOverlayResult> {
              assertReviewApplicationTarget(target);
              if (!isSupportedReviewField(target))
                return omitted("unsupported_field", target);

              const graph = await this.graphRepository.loadGraph(target.productId);
              if (!graph) return omitted("entity_missing", target);

              const [caseRow] = await this.db
                .select()
                .from(reviewCase)
                .where(
                  and(
                    eq(reviewCase.boothProductId, target.productId),
                    eq(reviewCase.entityType, target.entityType),
                    eq(reviewCase.entityId, target.entityId),
                    eq(reviewCase.fieldPath, target.fieldPath),
                    eq(reviewCase.contentVersion, target.versionKey.contentVersion),
                    eq(
                      reviewCase.normalizerVersion,
                      target.versionKey.normalizerVersion,
                    ),
                    eq(reviewCase.registryVersion, target.versionKey.registryVersion),
                  ),
                );
              if (!caseRow) return omitted("unapplied", target);

              const projection =
                await this.applicationRepository.loadEffectiveProjection(target);
              return materializeReviewedGraph(
                graph.product,
                graph.scenarios,
                snapshotFromRow(caseRow),
                projection,
                target,
              );
            }
          }
          EOF

          cat > src/persistence/reviewed-overlay-persistence.test.ts <<'EOF'
          import { PGlite } from "@electric-sql/pglite";
          import { eq } from "drizzle-orm";
          import { afterEach, describe, expect, it } from "vitest";

          import type {
            EvidencedValue,
            Product,
            Scenario,
            ScenarioTags,
          } from "../domain";
          import { project } from "../publication";
          import type { ReviewApplicationTarget } from "../review-application";
          import type { ReviewSnapshot } from "../review";
          import {
            applyCommittedMigrations,
            createPersistenceDatabase,
          } from "./database";
          import {
            PostgresProductScenarioRepository,
            type StoredGraphInput,
          } from "./repository";
          import { PostgresReviewApplicationRepository } from "./review-application-repository";
          import { PostgresReviewRepository } from "./review-repository";
          import { PostgresReviewedOverlayService } from "./reviewed-overlay-service";
          import { scenario as scenarioTable } from "./schema";

          const clients: PGlite[] = [];
          const PRODUCT_ID = "11111111-1111-4111-8111-111111111111";
          const SCENARIO_ID = "22222222-2222-4222-8222-222222222222";
          const BASE_TIME = "2026-08-06T00:00:00Z";

          function known<T>(
            value: T,
            options: {
              reviewState?: "unreviewed" | "approved";
              method?: "explicit_source" | "ai_candidate";
              confidence?: "high" | "medium";
            } = {},
          ): EvidencedValue<T> {
            return {
              state: "known",
              value,
              confidence: options.confidence ?? "high",
              reviewState: options.reviewState ?? "approved",
              evidence: [
                {
                  pointer: "synthetic",
                  method: options.method ?? "explicit_source",
                },
              ],
              contentVersion: "content-v1",
              checkedAt: BASE_TIME,
            };
          }

          function tags(): ScenarioTags {
            return {
              genre: known(["synthetic"]),
              tone: known(["synthetic"]),
              setting: known(["synthetic"]),
              structure: known(["synthetic"]),
              content: known(["synthetic"]),
            };
          }

          function graph(): StoredGraphInput {
            const product: Product = {
              id: PRODUCT_ID,
              canonicalUrl: "https://booth.pm/ja/items/1234567",
              title: "合成商品",
              salesState: known("available"),
              sourcePublicationDate: known("2026-08-01T00:00:00Z"),
              firstSeenAt: BASE_TIME,
              lastCheckedAt: BASE_TIME,
              allAges: known("all_ages_confirmed"),
              classification: {
                ...known("scenario_single"),
                normalizerVersion: "normalizer-v1",
                registryVersion: "registry-v1",
              },
            };
            const scenario: Scenario = {
              id: SCENARIO_ID,
              productId: PRODUCT_ID,
              title: known("合成シナリオ"),
              playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
              edition: known("AI候補版", {
                reviewState: "unreviewed",
                method: "ai_candidate",
              }),
              playTimeMinutes: known({
                minimumMinutes: 120,
                maximumMinutes: 180,
              }),
              modality: known("online"),
              tags: tags(),
              requiredBooks: [],
              compatibility: [],
              separationApproved: true,
              relationships: [],
            };
            return {
              product,
              sourceProductId: "1234567",
              contentVersion: "content-v1",
              currentRecordUpdatedAt: BASE_TIME,
              scenarios: [scenario],
              normalizationHistory: [],
            };
          }

          const target = (
            overrides: Partial<ReviewApplicationTarget> = {},
          ): ReviewApplicationTarget => ({
            productId: PRODUCT_ID,
            entityType: "scenario",
            entityId: SCENARIO_ID,
            fieldPath: "edition",
            versionKey: {
              contentVersion: "content-v1",
              normalizerVersion: "normalizer-v1",
              registryVersion: "registry-v1",
            },
            ...overrides,
          });

          const snapshot = (
            overrides: Partial<ReviewSnapshot> = {},
          ): ReviewSnapshot => ({
            evidencedState: "known",
            confidence: "high",
            initialReviewState: "unreviewed",
            evidenceCount: 1,
            hasConflict: false,
            holdReason: null,
            containsAiEvidence: true,
            versionKey: { ...target().versionKey },
            ...overrides,
          });

          async function freshDatabase() {
            const client = new PGlite();
            clients.push(client);
            await applyCommittedMigrations(client);
            const { db } = createPersistenceDatabase(client);
            const graphRepository = new PostgresProductScenarioRepository(db);
            await graphRepository.saveGraph(graph());
            return {
              client,
              db,
              graphRepository,
              reviewRepository: new PostgresReviewRepository(db),
              applicationRepository: new PostgresReviewApplicationRepository(db),
              overlayService: new PostgresReviewedOverlayService(db),
            };
          }

          async function completeReview(
            reviewRepository: PostgresReviewRepository,
            applicationRepository: PostgresReviewApplicationRepository,
            decision: "approved" | "rejected" | "needs_more_evidence",
          ) {
            const applicationTarget = target();
            const suffix =
              decision === "approved"
                ? "1"
                : decision === "rejected"
                  ? "2"
                  : "3";
            const caseId = `30000000-0000-4000-8000-00000000000${suffix}`;
            const decisionId = `40000000-0000-4000-8000-00000000000${suffix}`;
            await reviewRepository.openCase({
              id: caseId,
              productId: PRODUCT_ID,
              entityType: "scenario",
              entityId: SCENARIO_ID,
              fieldPath: "edition",
              snapshot: snapshot(),
              createdAt: "2026-08-06T00:01:00Z",
            });
            await reviewRepository.decide({
              id: decisionId,
              caseId,
              decision,
              reason:
                decision === "approved"
                  ? "evidence_sufficient"
                  : decision === "rejected"
                    ? "unsupported_claim"
                    : "evidence_insufficient",
              decidedAt: "2026-08-06T00:02:00Z",
            });
            await applicationRepository.apply({
              id: `50000000-0000-4000-8000-00000000000${suffix}`,
              reviewCaseId: caseId,
              reviewDecisionEventId: decisionId,
              target: applicationTarget,
              appliedAt: "2026-08-06T00:03:00Z",
            });
          }

          afterEach(async () => {
            await Promise.all(clients.splice(0).map((client) => client.close()));
          });

          describe("Stage 17 persistence-backed reviewed overlays", () => {
            it.each([
              ["approved", "approved", "known"],
              ["rejected", "rejected", "omitted"],
              ["needs_more_evidence", "needs_more_evidence", "omitted"],
            ] as const)(
              "derives %s without mutating the stored graph",
              async (decision, expectedReviewState, expectedFacet) => {
                const {
                  graphRepository,
                  reviewRepository,
                  applicationRepository,
                  overlayService,
                } = await freshDatabase();
                const storedBefore = await graphRepository.loadGraph(PRODUCT_ID);
                expect(storedBefore).not.toBeNull();
                const publicBefore = project(
                  storedBefore!.product,
                  storedBefore!.scenarios[0]!,
                );
                expect(publicBefore.publish).toBe(true);
                if (publicBefore.publish)
                  expect(publicBefore.value.edition.state).toBe("omitted");

                await completeReview(
                  reviewRepository,
                  applicationRepository,
                  decision,
                );
                const overlay = await overlayService.loadReviewedGraph(target());
                expect(overlay).toMatchObject({
                  state: "materialized",
                  scenarios: [
                    { edition: { reviewState: expectedReviewState } },
                  ],
                });
                if (overlay.state === "materialized") {
                  const effective = project(
                    overlay.product,
                    overlay.scenarios[0]!,
                  );
                  expect(effective.publish).toBe(true);
                  if (effective.publish)
                    expect(effective.value.edition.state).toBe(expectedFacet);
                }

                const storedAfter = await graphRepository.loadGraph(PRODUCT_ID);
                expect(storedAfter).toEqual(storedBefore);
                expect(storedAfter!.scenarios[0]!.edition.reviewState).toBe(
                  "unreviewed",
                );
              },
            );

            it("keeps unapplied and stale targets omitted", async () => {
              const { overlayService } = await freshDatabase();
              await expect(overlayService.loadReviewedGraph(target())).resolves.toMatchObject(
                { state: "omitted", reason: "unapplied" },
              );
              await expect(
                overlayService.loadReviewedGraph(
                  target({
                    versionKey: {
                      ...target().versionKey,
                      contentVersion: "content-v2",
                    },
                  }),
                ),
              ).resolves.toMatchObject({ state: "omitted", reason: "unapplied" });
            });

            it("fails closed when stored metadata diverges without a version change", async () => {
              const {
                db,
                reviewRepository,
                applicationRepository,
                overlayService,
              } = await freshDatabase();
              await completeReview(
                reviewRepository,
                applicationRepository,
                "approved",
              );
              const [row] = await db
                .select()
                .from(scenarioTable)
                .where(eq(scenarioTable.id, SCENARIO_ID));
              expect(row?.edition).not.toBeNull();
              await db
                .update(scenarioTable)
                .set({
                  edition: {
                    ...row!.edition!,
                    confidence: "medium",
                  },
                })
                .where(eq(scenarioTable.id, SCENARIO_ID));
              await expect(overlayService.loadReviewedGraph(target())).resolves.toMatchObject(
                { state: "omitted", reason: "metadata_mismatch" },
              );
            });

            it("rejects unstable array-row and unknown field paths", async () => {
              const { overlayService } = await freshDatabase();
              for (const fieldPath of [
                "required_books",
                "compatibility",
                "relationships",
                "required_books.0",
                "unknown_field",
              ])
                await expect(
                  overlayService.loadReviewedGraph(target({ fieldPath })),
                ).resolves.toMatchObject({
                  state: "omitted",
                  reason: "unsupported_field",
                });
            });
          });
          EOF

