name: Stage 34 Readiness Once

on:
  push:
    branches:
      - agent/stage34-production-readiness

permissions: {}

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage34-production-readiness
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Synchronize Stage 34 architecture and decisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/ARCHITECTURE.md': '''\n\n## Stage 34 production-readiness boundary\n\n`evaluateProductionReadiness()` is a provider-neutral, pure fail-closed gate over five explicit prerequisites: collection access, production data, hosted database, backup/restore, and production deployment. It consumes bounded metadata references only and has no provider SDK, network client, deployment effect, persistence mutation, or UI route.\n\nThe current checkpoint remains not ready. A successful repository build, local PostgreSQL test, Vercel preview/production-branch configuration, or BOOTH policy review cannot independently make the application production-ready. External gates remain separately authorized and evidence-bound.\n''',
            'docs/DECISIONS.md': '''\n\n## D-051 — Production readiness is an explicit five-gate conjunction\n\n**Decision:** Production readiness is true only when `collection_access`, `production_data`, `hosted_database`, `backup_restore`, and `production_deployment` are all explicitly `ready` with gate-specific bounded evidence references. Missing, duplicate, unknown, blocked, or not-evaluated gates fail closed.\n\n**Rationale:** Repository CI, local persistence, policy review, and deployment configuration prove different properties. Treating any one of them as overall readiness would silently bypass the remaining compliance, data, recovery, or operational boundary.\n\n**Consequences:** the current repository checkpoint is deliberately not ready: the tested collection path is CAPTCHA-blocked, public data is synthetic fixtures, hosted production persistence is absent, PD-010 recovery remains unresolved, and no production-data deployment has been authorized. The readiness report is diagnostic only and cannot authorize collection, provisioning, payment, backup storage, or deployment.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 34 — Explicit fail-closed production-readiness gate\n\n- [x] Require exactly five production gates with controlled states and reasons.\n- [x] Require gate-specific bounded evidence references for any ready state.\n- [x] Prevent BOOTH policy/robots evidence alone from satisfying post-challenge collection access.\n- [x] Encode the current repository checkpoint as deterministically not ready.\n- [x] Reject arbitrary URLs, credentials, payloads, missing/duplicate/unknown gates, and malformed evidence.\n- [x] Return detached deeply immutable canonical reports without external effects.\n''',
          }
          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              heading = next(line for line in section.splitlines() if line.startswith('## '))
              if heading not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Assert Stage 34 stays offline
        run: |
          ! grep -R --line-number -- '--mode network' src/production-readiness* docs/PRODUCTION_READINESS.md || { echo 'network invocation found'; exit 1; }
      - run: npm ci
      - run: npx prettier --write src/production-readiness.ts src/production-readiness.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run src/production-readiness.test.ts
      - run: python -m unittest discover -s tests
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: npm run build
      - name: Commit Stage 34 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/production-readiness.ts src/production-readiness.test.ts docs/PRODUCTION_READINESS.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(readiness): add fail-closed production gate"
          git push origin HEAD:agent/stage34-production-readiness
