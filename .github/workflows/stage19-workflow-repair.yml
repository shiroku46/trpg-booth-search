name: Stage 19 Workflow Repair

on:
  push:
    branches:
      - agent/stage19-reviewed-publication-index

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage19-reviewed-publication-index
      - name: Remove unused Stage 19 test import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/stage19-complete.yml')
          text = path.read_text(encoding='utf-8')
          old = '            type ReviewedPublicationIndexInput,\n'
          if old not in text:
            raise SystemExit('expected unused import line not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit workflow repair
        run: |
          rm .github/workflows/stage19-workflow-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/stage19-complete.yml .github/workflows/stage19-workflow-repair.yml
          git commit -m "ci(stage19): remove unused test import"
          git push origin HEAD:agent/stage19-reviewed-publication-index
