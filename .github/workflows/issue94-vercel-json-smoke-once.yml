name: Issue 94 Vercel JSON Smoke Once

on:
  push:
    branches:
      - fix/issue-94-vercel-json-header
    paths:
      - .github/workflows/issue94-vercel-json-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: issue-94-vercel-json-smoke-once
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PREVIEW_BASE_URL: https://trpg-booth-search-preview-hz01o4ry6-46mastei-4511s-projects.vercel.app/
      EXPECTED_DEPLOYED_SHA: f042ca5dfe515d54ecab10c3021c41c28d73f4bb
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f042ca5dfe515d54ecab10c3021c41c28d73f4bb
          persist-credentials: false
      - name: Verify exact deployed source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOYED_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - name: Validate target and enumerate bounded smoke test
        run: npm run test:preview -- --list
      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify production deployment
        run: npm run test:preview
      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue94-vercel-json-smoke-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
