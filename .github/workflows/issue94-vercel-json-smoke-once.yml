name: Issue 94 Vercel Alias Diagnostic Once

on:
  push:
    branches:
      - fix/issue-94-vercel-json-header
    paths:
      - .github/workflows/issue94-vercel-json-smoke-once.yml

permissions:
  contents: read

concurrency:
  group: issue-94-vercel-alias-diagnostic-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public Vercel response headers
        shell: bash
        run: |
          set -u
          probe() {
            local label="$1"
            local url="$2"
            local headers
            headers="$(mktemp)"
            echo "=== ${label} ==="
            echo "URL: ${url}"
            if curl --silent --show-error --max-time 20 --dump-header "$headers" --output /dev/null "$url"; then
              awk 'BEGIN { IGNORECASE=1 } /^HTTP\// || /^referrer-policy:/ || /^x-robots-tag:/ || /^x-content-type-options:/ || /^x-frame-options:/ || /^cross-origin-opener-policy:/ || /^permissions-policy:/ || /^location:/ { print }' "$headers"
            else
              echo "probe_failed"
            fi
            rm -f "$headers"
          }

          probe unique "https://trpg-booth-search-preview-hz01o4ry6-46mastei-4511s-projects.vercel.app/"
          probe project_alias "https://trpg-booth-search-preview.vercel.app/"
          probe team_alias "https://trpg-booth-search-preview-46mastei-4511s-projects.vercel.app/"
