name: Stage 32 Docs Once

on:
  push:
    branches:
      - docs/stage32-collection-mechanism-reassessment

permissions: {}

jobs:
  document-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: docs/stage32-collection-mechanism-reassessment
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Record Stage 32 mechanism reassessment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          research = Path('docs/BOOTH_COLLECTION_RESEARCH.md')
          text = research.read_text(encoding='utf-8')
          section = '''\n\n## 2026-08-07 Stage 32 collection-mechanism reassessment after CAPTCHA\n\nThe owner-authorized Stage 28 network run `31177408337` used exact source SHA `812490ddb2f22cc83737e95e9dc079a9e1c33038`, reproduced the reviewed current-policy digest, completed the three fixed preflight fetches, and made exactly one request to the fixed all-ages TRPG listing URL. The response was HTTP 200 with no redirect, but the fail-closed classifier matched stable marker `captcha`; the run stopped as `challenge_or_login_gate`, produced zero listing records and zero discovery candidates, made no product-detail request, and did not retry or bypass the gate.\n\nCurrent first-party policy evidence remains distinct from this operational result. The BOOTH guideline revised 2026-07-08 permits crawler-based collection of posting/product information for information analysis when the purpose is improving user convenience or contributing to healthy creative activity, while reserving restrictions for server load, rights infringement/risk, or damage/risk. BOOTH's 2025-10-10 clarification separately recognizes ordinary-range third-party applications, including independently collecting public information for search/recommendation, subject to service stability and Terms. Official references: `https://booth.pm/guidelines`, `https://booth.pm/announcements/863`, and `https://booth.pm/announcements/950`.\n\nThese policy statements are permission-in-principle, not proof that a particular runtime is operationally accepted. The observed CAPTCHA is therefore a binding access stop for the tested GitHub-hosted path. It must not be treated as a prompt to solve, evade, replay, disguise, or route around the challenge.\n\n### Acceptable mechanism classes for later review\n\nOnly non-circumventing mechanisms may be considered next: a documented/public first-party interface if one is later identified and independently reviewed; owner-supplied offline identity manifests that make no BOOTH request; or a separately authorized bounded public-web run from a specifically reviewed environment whose exact endpoint, robots/Terms evidence, request ceiling, and stop conditions are approved before access.\n\nCurrent official-source research has not selected a dedicated public API/RSS or other first-party product-discovery interface. This is an unresolved research result, not a claim that no such interface can exist. Search-engine caches/indexes are not BOOTH source-of-truth data and are not accepted as a substitute collection mechanism. Hidden/private API discovery, undocumented endpoint probing, browser stealth, CAPTCHA solving, proxy/identity rotation, session/cookie reuse, and login-based collection are prohibited fallback strategies.\n'''
          if '## 2026-08-07 Stage 32 collection-mechanism reassessment after CAPTCHA' not in text:
              research.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          policy = Path('docs/DATA_COLLECTION_POLICY.md')
          text = policy.read_text(encoding='utf-8')
          section = '''\n\n## Post-CAPTCHA collection mechanism gate\n\nThe tested GitHub-hosted listing path is disabled after the owner-authorized one-request run matched the stable `captcha` marker. A policy-compatible purpose does not override an observed access-control/challenge response. No automatic/manual retry from the same implementation, challenge solution, browser stealth, proxy/identity rotation, login/session reuse, hidden/private endpoint probing, or alternate undocumented interface is authorized.\n\nA future network mechanism is a new authorization boundary. Before any request, a dedicated Issue must identify the exact mechanism/environment and fixed endpoint set, re-evaluate current first-party policy and applicable robots evidence, define request/response ceilings and immediate stop conditions, prove evidence minimization offline, and obtain explicit owner authorization. An owner-supplied offline Stage 29 identity manifest remains non-network input and does not authorize later product-detail access.\n'''
          if '## Post-CAPTCHA collection mechanism gate' not in text:
              policy.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text(encoding='utf-8')
          old = '''### PD-002 — BOOTH collection mechanism\n\nChoose the exact API/scraping/RSS/other access mechanism only after the Stage 1b robots.txt preflight clears intended endpoints. Production additionally requires direct review of the current master and individual terms, pilot evidence, and a separate production authorization. D-013 and D-021 remain binding.\n'''
          new = '''### PD-002 — BOOTH collection mechanism\n\n**Status:** Partially resolved; production mechanism remains unselected.\n\nThe bounded public all-ages listing mechanism is compatible in principle with the recorded current BOOTH scraping/third-party-application guidance and passed the reviewed robots/current-policy preflight, but the owner-authorized GitHub-hosted one-request pilot `31177408337` encountered the stable `captcha` challenge marker and stopped before parsing. That tested runtime/path is therefore operationally disabled.\n\nNo bypass is permitted. A later mechanism may be selected only from a documented/public first-party interface that is independently reviewed, an owner-supplied offline identity input, or a separately authorized bounded public-web environment. Any new network mechanism/environment/endpoint requires its own Issue, current policy/robots review as applicable, fixed limits and stop conditions, and explicit owner authorization. D-013, D-021, D-032, and D-044 through D-048 remain binding.\n'''
          if old not in text:
              raise SystemExit('PD-002 text changed unexpectedly')
          text = text.replace(old, new, 1)
          section = '''\n\n## D-049 — Policy compatibility and runtime accessibility are separate gates\n\n**Decision:** Current BOOTH guidance may support bounded public-information analysis in principle, while an observed CAPTCHA/challenge can independently make a particular runtime/endpoint path unavailable. The stricter operational result controls execution.\n\n**Rationale:** Treating a generally compatible purpose as permission to bypass an environment-specific access challenge would collapse the project’s fail-closed access boundary. The owner-authorized Stage 28 pilot supplied direct evidence that the tested GitHub-hosted listing path encounters a challenge even though the policy/robots preflight passed.\n\n**Consequences:** the tested GitHub-hosted listing path remains disabled; no retry or circumvention is authorized. Future network mechanisms require a new explicit review/authorization boundary. Offline identity-manifest work may continue without implying network or product-detail permission.\n'''
          if '## D-049 — Policy compatibility and runtime accessibility are separate gates' not in text:
              text = text.rstrip() + section + '\n'
          decisions.write_text(text, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          section = '''\n\n## Stage 32 — Post-CAPTCHA collection-mechanism reassessment\n\n- [x] Record the exact one-request CAPTCHA stop as an operational access boundary.\n- [x] Separate current policy compatibility in principle from runtime accessibility.\n- [x] Disable the tested GitHub-hosted listing path rather than retry or bypass it.\n- [x] Restrict later research to documented/public first-party interfaces, owner-supplied offline identities, or separately authorized bounded public-web environments.\n- [x] Reject hidden/private endpoint probing, search-index substitution, CAPTCHA solving, stealth, proxy/identity rotation, login/session reuse, and other circumvention fallbacks.\n- [x] Update PD-002: production collection mechanism remains unresolved and requires a new owner-authorized network Issue.\n'''
          if '## Stage 32 — Post-CAPTCHA collection-mechanism reassessment' not in text:
              roadmap.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Assert documentation-only scope
        run: |
          git diff --name-only HEAD | sed '/^$/d' | grep -Ev '^(docs/BOOTH_COLLECTION_RESEARCH.md|docs/DATA_COLLECTION_POLICY.md|docs/DECISIONS.md|docs/ROADMAP.md)$' && exit 1 || true
      - run: python scripts/validate_repository.py
      - run: python scripts/public_export_guard.py .
      - name: Commit Stage 32 docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/BOOTH_COLLECTION_RESEARCH.md docs/DATA_COLLECTION_POLICY.md docs/DECISIONS.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(collection): reassess mechanism after CAPTCHA stop"
          git push origin HEAD:docs/stage32-collection-mechanism-reassessment
