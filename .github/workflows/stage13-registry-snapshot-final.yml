name: Stage 13 registry snapshot final validation

on:
  push:
    branches:
      - agent/stage13-registry-snapshot
    paths:
      - .github/workflows/stage13-registry-snapshot-final.yml

permissions:
  contents: write

concurrency:
  group: stage13-registry-snapshot-final
  cancel-in-progress: false

jobs:
  implement-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage13-registry-snapshot
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Reapply reviewed schema/document changes and normalize timestamp assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(
              ".github/workflows/stage13-registry-snapshot-validation.yml"
          ).read_text(encoding="utf-8")
          opening = "          python3 - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          program = textwrap.dedent(source[start:end])
          exec(compile(program, "stage13-reviewed-schema-docs", "exec"), {})

          test_file = Path("src/persistence/registry-persistence.test.ts")
          test_text = test_file.read_text(encoding="utf-8")
          old = "    expect(rows[0]?.installedAt).toBe(INSTALLED_AT);"
          new = "    expect(new Date(rows[0]!.installedAt).valueOf()).toBe(new Date(INSTALLED_AT).valueOf());"
          if test_text.count(old) != 1:
              raise SystemExit("registry timestamp assertion marker mismatch")
          test_file.write_text(test_text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format TypeScript sources
        run: npm run format
      - name: Generate and harden the Stage 13 Drizzle migration
        run: |
          set -euo pipefail
          npx drizzle-kit generate --name=stage13_registry_snapshot
          migration="$(find drizzle -maxdepth 1 -type f -name '0001_*stage13_registry_snapshot.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION public.stage13_guard_registry_snapshot_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            RAISE EXCEPTION 'registry_snapshot is append-only';
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER registry_snapshot_append_only
          BEFORE UPDATE OR DELETE ON registry_snapshot
          FOR EACH ROW EXECUTE FUNCTION public.stage13_guard_registry_snapshot_append_only();
          SQL
          test "$(find drizzle -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 2
          grep -q 'CREATE TABLE "registry_snapshot"' "$migration"
          grep -q 'registry_snapshot_append_only' "$migration"
      - name: Verify exact Stage 13 allowlist
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess

          allowed = {
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "docs/PHYSICAL_SCHEMA.md",
              "src/persistence/schema.ts",
              "src/persistence/registry-repository.ts",
              "src/persistence/registry-persistence.test.ts",
              "drizzle/0001_stage13_registry_snapshot.sql",
              "drizzle/meta/0001_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          transports = {
              ".github/workflows/stage13-registry-snapshot-validation.yml",
              ".github/workflows/stage13-registry-snapshot-retry.yml",
              ".github/workflows/stage13-registry-snapshot-final.yml",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed - transports)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Stage 13 paths did not change: {missing}")
          PY
      - name: Run migration, format, lint, type, and unit gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Run repository guards without dependency-tree false positives
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          restore_dependencies() {
            if [ -d "$RUNNER_TEMP/node_modules" ] && [ ! -d node_modules ]; then
              mv "$RUNNER_TEMP/node_modules" node_modules
            fi
          }
          trap restore_dependencies EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          restore_dependencies
          trap - EXIT
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests
      - name: Build production application
        run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify unchanged Design B browser suite
        run: npm run test:e2e
      - name: Remove validation transports and publish verified Stage 13 commit
        run: |
          set -euo pipefail
          rm .github/workflows/stage13-registry-snapshot-validation.yml
          rm .github/workflows/stage13-registry-snapshot-retry.yml
          rm .github/workflows/stage13-registry-snapshot-final.yml
          git checkout -- tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/ROADMAP.md docs/PHYSICAL_SCHEMA.md src/persistence/schema.ts src/persistence/registry-repository.ts src/persistence/registry-persistence.test.ts drizzle/0001_stage13_registry_snapshot.sql drizzle/meta/0001_snapshot.json drizzle/meta/_journal.json
          git add -u .github/workflows/stage13-registry-snapshot-validation.yml .github/workflows/stage13-registry-snapshot-retry.yml .github/workflows/stage13-registry-snapshot-final.yml
          git commit -m 'feat(persistence): add immutable registry snapshot for issue 107'
          git push origin HEAD:agent/stage13-registry-snapshot
