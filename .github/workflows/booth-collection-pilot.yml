name: BOOTH Collection Pilot
run-name: BOOTH Collection Pilot ${{ inputs.mode || 'dry-run' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run performs no network; network performs the bounded current-policy preflight
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - network
      request_limit:
        description: Listing/detail requests after preflight; 0 for dry-run and exactly 1 for the current fixed plan
        required: true
        default: "0"
        type: string
      policy_approval_digest:
        description: Exact SHA-256 emitted by a reviewed current-policy preflight; blank stops before listing access
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: booth-collection-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Validate bounded inputs
        env:
          MODE: ${{ inputs.mode }}
          REQUEST_LIMIT: ${{ inputs.request_limit }}
          POLICY_APPROVAL_DIGEST: ${{ inputs.policy_approval_digest }}
        run: |
          python3 - <<'PY'
          import os, re

          mode = os.environ["MODE"]
          raw_limit = os.environ["REQUEST_LIMIT"]
          digest = os.environ["POLICY_APPROVAL_DIGEST"]

          if mode not in {"dry-run", "network"}:
              raise SystemExit("invalid mode")
          if not re.fullmatch(r"[0-9]+", raw_limit):
              raise SystemExit("invalid request limit")
          limit = int(raw_limit)
          if mode == "dry-run":
              if limit != 0:
                  raise SystemExit("dry-run request limit must be zero")
              if digest:
                  raise SystemExit("dry-run policy digest must be blank")
          if mode == "network" and limit != 1:
              raise SystemExit(
                  "current fixed network plan requires exactly one listing request"
              )
          if digest and not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("invalid policy approval digest")
          PY
      - name: Run offline regression suite
        run: python -m unittest tests.test_booth_collection_pilot
      - name: Execute explicit bounded pilot mode
        env:
          MODE: ${{ inputs.mode }}
          REQUEST_LIMIT: ${{ inputs.request_limit }}
          POLICY_APPROVAL_DIGEST: ${{ inputs.policy_approval_digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/booth-pilot"
          python scripts/booth_collection_pilot.py \
            --mode "$MODE" \
            --request-limit "$REQUEST_LIMIT" \
            --policy-approval-digest "$POLICY_APPROVAL_DIGEST" \
            --output "$RUNNER_TEMP/booth-pilot/evidence.json" || status=$?
          python3 - "$RUNNER_TEMP/booth-pilot/evidence.json" <<'PY'
          import hashlib, json, pathlib, sys

          path = pathlib.Path(sys.argv[1])
          raw = path.read_bytes()
          evidence = json.loads(raw)
          forbidden = {
              "authorization",
              "cookie",
              "set-cookie",
              "exact_price",
              "full_body",
          }

          def visit(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if str(key).lower() in forbidden:
                          raise SystemExit("forbidden evidence field")
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)

          visit(evidence)
          digest = hashlib.sha256(raw).hexdigest()
          (path.parent / "evidence.sha256").write_text(
              f"{digest}  evidence.json\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "mode": evidence.get("mode"),
                      "stop_state": evidence.get("stop_state"),
                      "stop_reason": evidence.get("stop_reason"),
                      "preflight_fetches": evidence.get("preflight_fetches", 0),
                      "listing_requests": evidence.get("listing_requests", 0),
                      "evidence_sha256": digest,
                  },
                  sort_keys=True,
              )
          )
          PY
          exit "${status:-0}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: booth-collection-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/booth-pilot
          if-no-files-found: error
          retention-days: 30
