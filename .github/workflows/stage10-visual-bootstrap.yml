name: Stage 10 Visual Bootstrap

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage10-visual-bootstrap
  cancel-in-progress: false

jobs:
  render:
    if: >-
      github.event.issue.number == 83 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/render-stage10-ui' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage10-issue-83-pixel-ui
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate
        env:
          EXPECTED_HEAD: be3b97ede3554c65a63542f50c2e230404325634
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Generate lockfile and enforce dependency boundary
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          node - "$RUNNER_TEMP/audit-production.json" "$RUNNER_TEMP/audit-all.json" <<'JS'
          const fs = require('node:fs');
          const [productionPath, allPath] = process.argv.slice(2);
          const production = JSON.parse(fs.readFileSync(productionPath, 'utf8'));
          const all = JSON.parse(fs.readFileSync(allPath, 'utf8'));
          const productionCounts = production.metadata?.vulnerabilities ?? {};
          const allCounts = all.metadata?.vulnerabilities ?? {};
          console.log(`production audit: ${JSON.stringify(productionCounts)}`);
          console.log(`all dependency audit: ${JSON.stringify(allCounts)}`);
          if ((productionCounts.total ?? 0) !== 0)
            throw new Error('Production dependency audit must be clean.');
          if ((allCounts.high ?? 0) !== 0 || (allCounts.critical ?? 0) !== 0)
            throw new Error('High or critical dependency advisory remains.');
          JS
          npm ls @playwright/test next vitest postcss sharp

      - name: Format and run static quality gates
        run: |
          set -euo pipefail
          npm run format
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          git diff --check

      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate and re-compare visual baselines
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run test:e2e:update
          test "$(find e2e -type f -path '*-snapshots/*.png' | wc -l)" -eq 6
          npm run test:e2e
          find e2e -type f -path '*-snapshots/*.png' -print -exec file {} \;

      - name: Upload rendered UI for coordinator review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage10-rendered-ui-${{ github.run_id }}
          path: e2e/search-ui.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 30

      - name: Run repository-only guards
        run: |
          set -euo pipefail
          rm -rf node_modules .next playwright-report test-results
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests

      - name: Commit exact rendered candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .gitignore \
            .github/workflows/unit-tests.yml \
            package.json package-lock.json playwright.config.ts \
            app src/ui e2e \
            docs/UI_DESIGN_SYSTEM.md docs/ASSET_LICENSES.md
          changed=$(git diff --cached --name-only)
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.gitignore|\.github/workflows/unit-tests\.yml|package\.json|package-lock\.json|playwright\.config\.ts|app/|src/ui/|e2e/|docs/(UI_DESIGN_SYSTEM|ASSET_LICENSES)\.md)' ; then
            echo 'Unexpected Stage 10 changed path' >&2
            exit 1
          fi
          git commit -m 'feat(stage10): add accessible pixel archive UI and visual baselines'
          git push origin HEAD:fix/stage10-issue-83-pixel-ui
