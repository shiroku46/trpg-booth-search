name: Stage 16 review-application retry v2

on:
  push:
    branches:
      - agent/stage16-review-application
    paths:
      - .github/workflows/stage16-retry-v2.yml

permissions:
  contents: write

concurrency:
  group: stage16-review-application-retry-v2
  cancel-in-progress: false

jobs:
  repair-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: d0bfa8db02a7276787cd5d3c87d3c7ff2d9fdbb8
      EXPECTED_PREVIOUS_HEAD: 4c38132667ca3e14d3d883daefc0b4ec7c7faade
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage16-review-application
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact retry base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PREVIOUS_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Replay Stage 16 and install deferred restore-safe validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          workflow = Path(".github/workflows/stage16-validation.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()

          def extract(name: str) -> str:
              marker = f"      - name: {name}"
              try:
                  index = lines.index(marker)
              except ValueError as exc:
                  raise SystemExit(f"missing source workflow step: {name}") from exc
              index += 1
              while index < len(lines) and lines[index] != "        run: |":
                  index += 1
              if index >= len(lines):
                  raise SystemExit(f"missing run block for source workflow step: {name}")
              index += 1
              output: list[str] = []
              while index < len(lines):
                  line = lines[index]
                  if line.startswith("      - "):
                      break
                  if not line:
                      output.append("")
                  elif line.startswith("          "):
                      output.append(line[10:])
                  else:
                      raise SystemExit(
                          f"unexpected source workflow indentation in {name}: {line!r}"
                      )
                  index += 1
              return "\n".join(output) + "\n"

          for number, name in enumerate(
              [
                  "Add Stage 16 domain and persistence implementation",
                  "Add Stage 16 schema and documentation",
                  "Add Stage 16 persistence regression suite",
                  "Format and generate Stage 16 migration",
              ],
              start=1,
          ):
              script = Path(os.environ["RUNNER_TEMP"]) / f"stage16-v2-{number}.sh"
              script.write_text(extract(name), encoding="utf-8")
              subprocess.run(
                  ["bash", "-euo", "pipefail", str(script)],
                  check=True,
                  env=os.environ.copy(),
              )

          candidates = list(Path("drizzle").glob("0004_*stage16_review_application.sql"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one Stage 16 migration, found {candidates}")
          migration = candidates[0]
          text = migration.read_text(encoding="utf-8")
          replacements = [
              (r"(?<!public[.])\breview_case%ROWTYPE\b", "public.review_case%ROWTYPE"),
              (
                  r"(?<!public[.])\breview_decision_event%ROWTYPE\b",
                  "public.review_decision_event%ROWTYPE",
              ),
              (r"\bFROM review_case\b", "FROM public.review_case"),
              (
                  r"\bFROM review_decision_event\b",
                  "FROM public.review_decision_event",
              ),
              (r"\bFROM scenario\b", "FROM public.scenario"),
              (
                  r"CREATE TRIGGER review_application_validate_insert\nBEFORE INSERT ON review_application_event\nFOR EACH ROW EXECUTE FUNCTION public[.]stage16_validate_review_application[(][)];",
                  "CREATE CONSTRAINT TRIGGER review_application_validate_insert\n"
                  "AFTER INSERT ON public.review_application_event\n"
                  "DEFERRABLE INITIALLY DEFERRED\n"
                  "FOR EACH ROW EXECUTE FUNCTION public.stage16_validate_review_application();",
              ),
          ]
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(
                      f"Stage 16 migration replacement count mismatch: {pattern} -> {count}"
                  )
          migration.write_text(text, encoding="utf-8")

          required = [
              "case_row public.review_case%ROWTYPE;",
              "decision_row public.review_decision_event%ROWTYPE;",
              "FROM public.review_case WHERE id = NEW.review_case_id;",
              "FROM public.review_decision_event",
              "SELECT 1 FROM public.scenario",
              "CREATE CONSTRAINT TRIGGER review_application_validate_insert",
              "AFTER INSERT ON public.review_application_event",
              "DEFERRABLE INITIALLY DEFERRED",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Stage 16 migration marker missing: {marker}")

          physical = Path("docs/PHYSICAL_SCHEMA.md")
          docs = physical.read_text(encoding="utf-8")
          old = "A BEFORE INSERT trigger joins the referenced case and decision"
          new = (
              "A deferrable, initially deferred AFTER INSERT constraint trigger joins "
              "the referenced case and decision"
          )
          if docs.count(old) != 1:
              raise SystemExit("Stage 16 physical-schema trigger marker mismatch")
          physical.write_text(docs.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflows and verify exact scope
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage16-validation.yml
          rm -f .github/workflows/stage16-retry.yml
          rm -f .github/workflows/stage16-retry-v2.yml
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/stage16-validation.yml",
              ".github/workflows/stage16-retry.yml",
              ".github/workflows/stage16-retry-v2.yml",
              "docs/DATA_MODEL.md",
              "docs/DECISIONS.md",
              "docs/PHYSICAL_SCHEMA.md",
              "docs/ROADMAP.md",
              "src/review-application.ts",
              "src/review-application.test.ts",
              "src/persistence/schema.ts",
              "src/persistence/review-application-repository.ts",
              "src/persistence/review-application-persistence.test.ts",
              "drizzle/0004_stage16_review_application.sql",
              "drizzle/meta/0004_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"unexpected Stage 16 paths: {unexpected}")
          if missing:
              raise SystemExit(f"required Stage 16 paths did not change: {missing}")
          PY

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git checkout -- tsconfig.json

      - name: Run source guards and Python regression
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          trap 'mv "$RUNNER_TEMP/node_modules" node_modules 2>/dev/null || true' EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          mv "$RUNNER_TEMP/node_modules" node_modules
          trap - EXIT
          python -m unittest discover -s tests

      - name: Run browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e
          git checkout -- tsconfig.json

      - name: Verify and publish exact Stage 16 candidate
        run: |
          set -euo pipefail
          test ! -e .github/workflows/stage16-validation.yml
          test ! -e .github/workflows/stage16-retry.yml
          test ! -e .github/workflows/stage16-retry-v2.yml
          grep -q 'reviewApplicationEvent' src/persistence/schema.ts
          grep -q 'stage16_validate_review_application' drizzle/0004_stage16_review_application.sql
          grep -q 'public.review_case%ROWTYPE' drizzle/0004_stage16_review_application.sql
          grep -q 'FROM public.review_case' drizzle/0004_stage16_review_application.sql
          grep -q 'FROM public.review_decision_event' drizzle/0004_stage16_review_application.sql
          grep -q 'FROM public.scenario' drizzle/0004_stage16_review_application.sql
          grep -q 'CREATE CONSTRAINT TRIGGER review_application_validate_insert' drizzle/0004_stage16_review_application.sql
          grep -q 'DEFERRABLE INITIALLY DEFERRED' drizzle/0004_stage16_review_application.sql
          grep -q 'D-038 — Immutable exact-version review application' docs/DECISIONS.md
          grep -q 'Stage 16 repository delivery' docs/ROADMAP.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/DATA_MODEL.md \
            docs/DECISIONS.md \
            docs/PHYSICAL_SCHEMA.md \
            docs/ROADMAP.md \
            src/review-application.ts \
            src/review-application.test.ts \
            src/persistence/schema.ts \
            src/persistence/review-application-repository.ts \
            src/persistence/review-application-persistence.test.ts \
            drizzle/0004_stage16_review_application.sql \
            drizzle/meta/0004_snapshot.json \
            drizzle/meta/_journal.json
          git add -u \
            .github/workflows/stage16-validation.yml \
            .github/workflows/stage16-retry.yml \
            .github/workflows/stage16-retry-v2.yml
          git commit -m 'feat(review): add immutable decision application for issue 113'
          git push origin HEAD:agent/stage16-review-application
