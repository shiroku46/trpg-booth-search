name: Stage 15 review-case validation

on:
  push:
    branches:
      - agent/stage15-review-cases
    paths:
      - .github/workflows/stage15-review-validation.yml

permissions:
  contents: write

concurrency:
  group: stage15-review-case-validation
  cancel-in-progress: false

jobs:
  implement-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage15-review-cases
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Add review schema and accepted documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacement(s), found {count}")
              file.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace(
              "src/persistence/schema.ts",
              'import type { RegistryManifest } from "../registry";\n',
              'import type { RegistryManifest } from "../registry";\nimport type { ReviewCaseReason } from "../review";\n',
          )

          tables = r'''
          export const reviewCase = pgTable(
            "review_case",
            {
              id: uuid("id").primaryKey(),
              boothProductId: uuid("booth_product_id")
                .notNull()
                .references(() => boothProduct.id, { onDelete: "restrict" }),
              entityType: text("entity_type").notNull(),
              entityId: uuid("entity_id").notNull(),
              fieldPath: text("field_path").notNull(),
              evidencedState: text("evidenced_state", {
                enum: ["known", "unknown", "hold", "not_applicable"],
              }).notNull(),
              confidence: text("confidence", {
                enum: ["high", "medium", "low", "unresolved"],
              }).notNull(),
              initialReviewState: text("initial_review_state", {
                enum: ["unreviewed", "needs_more_evidence"],
              }).notNull(),
              evidenceCount: integer("evidence_count").notNull(),
              hasConflict: boolean("has_conflict").notNull(),
              holdReason: text("hold_reason"),
              containsAiEvidence: boolean("contains_ai_evidence").notNull(),
              contentVersion: text("content_version").notNull(),
              normalizerVersion: text("normalizer_version").notNull(),
              registryVersion: text("registry_version").notNull(),
              priority: text("priority", {
                enum: ["blocking", "high", "normal"],
              }).notNull(),
              reasons: jsonb("reasons").$type<ReviewCaseReason[]>().notNull(),
              createdAt: timestamp("created_at", {
                withTimezone: true,
                mode: "string",
              }).notNull(),
            },
            (table) => [
              uniqueIndex("review_case_identity_uq").on(
                table.boothProductId,
                table.entityType,
                table.entityId,
                table.fieldPath,
                table.contentVersion,
                table.normalizerVersion,
                table.registryVersion,
              ),
              index("review_case_pending_idx").on(
                table.priority,
                table.createdAt,
                table.id,
              ),
              check(
                "review_case_entity_type_ck",
                sql`${table.entityType} IN ('booth_product', 'scenario')`,
              ),
              check(
                "review_case_field_path_ck",
                sql`length(${table.fieldPath}) BETWEEN 1 AND 128 AND ${table.fieldPath} ~ '^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){0,5}$'`,
              ),
              check(
                "review_case_evidence_count_ck",
                sql`${table.evidenceCount} >= 0`,
              ),
              check(
                "review_case_hold_shape_ck",
                sql`(
                  (
                    ${table.evidencedState} = 'hold'
                    AND ${table.holdReason} ~ '^[a-z][a-z0-9_:-]{0,127}$'
                  )
                  OR (
                    ${table.evidencedState} <> 'hold'
                    AND ${table.holdReason} IS NULL
                  )
                ) IS TRUE`,
              ),
              check(
                "review_case_version_ck",
                sql`(
                  length(btrim(${table.contentVersion})) > 0
                  AND length(btrim(${table.normalizerVersion})) > 0
                  AND length(btrim(${table.registryVersion})) > 0
                ) IS TRUE`,
              ),
              check(
                "review_case_reasons_ck",
                sql`(
                  jsonb_typeof(${table.reasons}) = 'array'
                  AND jsonb_array_length(${table.reasons}) > 0
                  AND ${table.reasons} <@ '[
                    "hold_requires_resolution",
                    "conflict_requires_resolution",
                    "ai_candidate_requires_approval",
                    "needs_more_evidence",
                    "unresolved_confidence",
                    "known_without_evidence",
                    "low_confidence",
                    "manual_review_requested"
                  ]'::jsonb
                ) IS TRUE`,
              ),
              check(
                "review_case_priority_ck",
                sql`(
                  CASE
                    WHEN ${table.reasons} ?| ARRAY[
                      'hold_requires_resolution',
                      'conflict_requires_resolution',
                      'ai_candidate_requires_approval'
                    ] THEN ${table.priority} = 'blocking'
                    WHEN ${table.reasons} ?| ARRAY[
                      'needs_more_evidence',
                      'unresolved_confidence',
                      'known_without_evidence'
                    ] THEN ${table.priority} = 'high'
                    ELSE ${table.priority} = 'normal'
                  END
                ) IS TRUE`,
              ),
            ],
          );

          export const reviewDecisionEvent = pgTable(
            "review_decision_event",
            {
              id: uuid("id").primaryKey(),
              reviewCaseId: uuid("review_case_id")
                .notNull()
                .unique()
                .references(() => reviewCase.id, { onDelete: "restrict" }),
              decision: text("decision", {
                enum: ["approved", "rejected", "needs_more_evidence"],
              }).notNull(),
              reason: text("reason", {
                enum: [
                  "evidence_sufficient",
                  "evidence_insufficient",
                  "evidence_conflict",
                  "incorrect_mapping",
                  "unsupported_claim",
                  "manual_policy_decision",
                ],
              }).notNull(),
              decidedAt: timestamp("decided_at", {
                withTimezone: true,
                mode: "string",
              }).notNull(),
            },
            (table) => [
              index("review_decision_time_idx").on(table.decidedAt, table.id),
              check(
                "review_decision_reason_ck",
                sql`(
                  (
                    ${table.decision} = 'approved'
                    AND ${table.reason} IN ('evidence_sufficient', 'manual_policy_decision')
                  )
                  OR (
                    ${table.decision} = 'needs_more_evidence'
                    AND ${table.reason} IN (
                      'evidence_insufficient',
                      'evidence_conflict',
                      'manual_policy_decision'
                    )
                  )
                  OR (
                    ${table.decision} = 'rejected'
                    AND ${table.reason} IN (
                      'evidence_conflict',
                      'incorrect_mapping',
                      'unsupported_claim',
                      'manual_policy_decision'
                    )
                  )
                ) IS TRUE`,
              ),
            ],
          );

          '''
          replace(
              "src/persistence/schema.ts",
              "export const redactionTombstone = pgTable(",
              tables + "export const redactionTombstone = pgTable(",
          )
          replace(
              "src/persistence/schema.ts",
              '''  normalizationHistory,
            redactionTombstone,''',
              '''  normalizationHistory,
            reviewCase,
            reviewDecisionEvent,
            redactionTombstone,''',
          )

          physical = Path("docs/PHYSICAL_SCHEMA.md")
          text = physical.read_text(encoding="utf-8")
          marker = "### 5.3 `redaction_tombstone`"
          if text.count(marker) != 1:
              raise SystemExit("PHYSICAL_SCHEMA review insertion marker mismatch")
          section = '''### 5.3 `review_case` and `review_decision_event`

          Stage 15 adds an immutable local human-review queue without copying field values, product payload, spoiler text, reviewer identity, or credentials.

          `review_case` stores the owning product/entity, bounded `field_path`, exact content/normalizer/registry version key, evidenced state, confidence, initial review state, evidence count, hold/conflict/AI flags, deterministic queue reasons and priority, and creation time. The exact product/entity/field/version tuple is unique. Cases are immutable; additional evidence or version changes create a new case.

          `review_decision_event` stores exactly one append-only decision per case: `approved`, `rejected`, or `needs_more_evidence`, together with a controlled reason and decision time. Approval is additionally checked in the repository: high/medium confidence, no hold/conflict, and non-empty evidence for known values. UPDATE and DELETE are rejected by database triggers on both tables.

          Queue priority is deterministic: hold/conflict/AI cases are blocking; needs-more-evidence, unresolved-confidence, and known-without-evidence cases are high; low-confidence or manual-only cases are normal. Pending order is priority, creation time, then ID.

          ### 5.4 `redaction_tombstone`'''
          physical.write_text(text.replace(marker, section, 1), encoding="utf-8")

          logical = Path("docs/DATA_MODEL.md")
          text = logical.read_text(encoding="utf-8")
          marker = "### 3.1 Processing-order invariants"
          if text.count(marker) != 1:
              raise SystemExit("DATA_MODEL review insertion marker mismatch")
          section = '''### 3.1 Local confidence / hold review cases

          The Stage 15 review queue is metadata-only. A case identifies the product/entity/field and exact version key, then records evidenced state, confidence, evidence count, hold/conflict/AI flags, bounded reasons, and priority. It never stores the field value, source payload, body text, spoiler text, reviewer identity, or credentials.

          Cases are immutable per exact field/version key. A safe high/medium-confidence non-AI value with evidence need not create a case unless manually requested. Hold, conflict, AI-origin, needs-more-evidence, unresolved/low confidence, or known-without-evidence states create deterministic review reasons. One append-only decision closes a case. A later evidence or processor/registry/content version produces a new case rather than rewriting the prior decision.

          Approval does not itself mutate the source value in this stage; downstream application of a reviewed decision remains a separate transaction boundary. Approval is fail-closed unless confidence and evidence conditions are satisfied and no hold/conflict remains.

          ### 3.2 Processing-order invariants'''
          logical.write_text(text.replace(marker, section, 1), encoding="utf-8")

          decisions = Path("docs/DECISIONS.md")
          text = decisions.read_text(encoding="utf-8")
          text = text.replace(
              "Decisions D-001 through D-036 are accepted",
              "Decisions D-001 through D-037 are accepted",
              1,
          )
          marker = "\n---\n\n## Pending Decisions\n"
          if text.count(marker) != 1:
              raise SystemExit("DECISIONS pending marker mismatch")
          d037 = '''
          ### D-037 — Metadata-only immutable review cases

          **Decision date:** 2026-08-06.

          Human review is represented by one immutable case per product/entity/field and exact content/normalizer/registry version key. Cases store only bounded review metadata: evidenced state, confidence, evidence count, hold/conflict/AI flags, deterministic reasons, priority, and timestamps. Field values, product payload, spoiler text, reviewer identity, and credentials are excluded.

          A case receives at most one append-only decision: approved, rejected, or needs-more-evidence. Approval remains fail-closed and requires high/medium confidence, no hold/conflict, and evidence for known values. New evidence or any version change creates a new case. Stage 15 does not apply decisions back into source entities and does not expose an operator UI; those remain later separately reviewed work.

          This local foundation creates no hosted resource, authentication, personal data, BOOTH access, AI inference, or public fixture change. It is implemented by Issue #111.
          '''
          decisions.write_text(text.replace(marker, "\n" + d037.strip() + marker, 1), encoding="utf-8")

          roadmap = Path("docs/ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          marker = "Confidence/hold workflow UX and external collection remain later work."
          if text.count(marker) != 1:
              raise SystemExit("ROADMAP Stage 14 tail mismatch")
          stage15 = '''

          ## Stage 15 repository delivery — 2026-08-06

          Issue #111 adds a metadata-only, immutable local review-case and decision foundation. Cases are deduplicated by exact field/version identity, prioritized deterministically, and closed by one append-only controlled decision. Values and source payloads are not copied into the queue.

          Stage 15 does not yet provide an operator UI or apply decisions back into source entities. External collection, AI inference, hosted authentication, and public review display remain later work.
          '''
          roadmap.write_text(text.replace(marker, marker + stage15, 1), encoding="utf-8")
          PY
      - name: Format TypeScript sources
        run: npm run format
      - name: Generate and harden the Stage 15 migration
        run: |
          set -euo pipefail
          npx drizzle-kit generate --name=stage15_review_cases
          migration="$(find drizzle -maxdepth 1 -type f -name '0003_*stage15_review_cases.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          test "$(find drizzle -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 4
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION public.stage15_guard_review_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            RAISE EXCEPTION 'review records are append-only';
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER review_case_append_only
          BEFORE UPDATE OR DELETE ON review_case
          FOR EACH ROW EXECUTE FUNCTION public.stage15_guard_review_append_only();

          --> statement-breakpoint
          CREATE TRIGGER review_decision_event_append_only
          BEFORE UPDATE OR DELETE ON review_decision_event
          FOR EACH ROW EXECUTE FUNCTION public.stage15_guard_review_append_only();
          SQL
          grep -q 'CREATE TABLE "review_case"' "$migration"
          grep -q 'CREATE TABLE "review_decision_event"' "$migration"
          grep -q 'review_case_append_only' "$migration"
      - name: Verify exact Stage 15 allowlist
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess

          allowed = {
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "docs/PHYSICAL_SCHEMA.md",
              "docs/DATA_MODEL.md",
              "src/review.ts",
              "src/review.test.ts",
              "src/persistence/schema.ts",
              "src/persistence/review-repository.ts",
              "src/persistence/review-persistence.test.ts",
              "drizzle/0003_stage15_review_cases.sql",
              "drizzle/meta/0003_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          transport = {".github/workflows/stage15-review-validation.yml"}
          committed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          working = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          untracked = set(subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines())
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed - transport)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Stage 15 paths did not change: {missing}")
          PY
      - name: Run migration and product quality gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Run repository guards without dependency-tree false positives
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          restore_dependencies() {
            if [ -d "$RUNNER_TEMP/node_modules" ] && [ ! -d node_modules ]; then
              mv "$RUNNER_TEMP/node_modules" node_modules
            fi
          }
          trap restore_dependencies EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          restore_dependencies
          trap - EXIT
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests
      - name: Build production application
        run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify unchanged Design B browser suite
        run: npm run test:e2e
      - name: Remove validation transport and publish verified Stage 15 commit
        run: |
          set -euo pipefail
          rm .github/workflows/stage15-review-validation.yml
          git checkout -- tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/ROADMAP.md docs/PHYSICAL_SCHEMA.md docs/DATA_MODEL.md src/review.ts src/review.test.ts src/persistence/schema.ts src/persistence/review-repository.ts src/persistence/review-persistence.test.ts drizzle/0003_stage15_review_cases.sql drizzle/meta/0003_snapshot.json drizzle/meta/_journal.json
          git add -u .github/workflows/stage15-review-validation.yml
          git commit -m 'feat(review): add immutable local review cases for issue 111'
          git push origin HEAD:agent/stage15-review-cases
