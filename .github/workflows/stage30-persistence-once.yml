name: Stage 30 Persistence Once

on:
  push:
    branches:
      - agent/stage30-discovery-manifest-persistence

permissions: {}

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage30-discovery-manifest-persistence
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Add discovery manifest to Drizzle schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/persistence/schema.ts')
          text = path.read_text(encoding='utf-8')
          import_marker = 'import type { RegistryManifest } from "../registry";\n'
          if 'import type { DiscoveryManifest } from "../discovery-manifest";' not in text:
              text = text.replace(import_marker, 'import type { DiscoveryManifest } from "../discovery-manifest";\n' + import_marker, 1)
          marker = 'export const registrySnapshot = pgTable(\n'
          table = '''export const discoveryManifest = pgTable(\n  "discovery_manifest",\n  {\n    fingerprint: text("fingerprint").primaryKey(),\n    schemaVersion: integer("schema_version").notNull(),\n    sourceSha: text("source_sha").notNull(),\n    parserVersion: text("parser_version").notNull(),\n    listingUrl: text("listing_url").notNull(),\n    listingRawSha256: text("listing_raw_sha256").notNull(),\n    manifest: jsonb("manifest").$type<DiscoveryManifest>().notNull(),\n    installedAt: timestamp("installed_at", {\n      withTimezone: true,\n      mode: "string",\n    }).notNull(),\n  },\n  (table) => [\n    index("discovery_manifest_installed_idx").on(\n      table.installedAt,\n      table.fingerprint,\n    ),\n    check(\n      "discovery_manifest_fingerprint_ck",\n      sql`${table.fingerprint} ~ '^[0-9a-f]{64}$'`,\n    ),\n    check(\n      "discovery_manifest_schema_version_ck",\n      sql`${table.schemaVersion} = 1`,\n    ),\n    check(\n      "discovery_manifest_source_sha_ck",\n      sql`${table.sourceSha} ~ '^[0-9a-f]{40}$'`,\n    ),\n    check(\n      "discovery_manifest_parser_version_ck",\n      sql`${table.parserVersion} = 'stage28-pilot-v8'`,\n    ),\n    check(\n      "discovery_manifest_listing_url_ck",\n      sql`${table.listingUrl} = 'https://booth.pm/ja/browse/TRPG?adult=none&type=digital'`,\n    ),\n    check(\n      "discovery_manifest_listing_raw_sha_ck",\n      sql`${table.listingRawSha256} ~ '^[0-9a-f]{64}$'`,\n    ),\n    check(\n      "discovery_manifest_shape_ck",\n      sql`(\n        jsonb_typeof(${table.manifest}) = 'object'\n        AND (${table.manifest}->>'schemaVersion')::integer = 1\n        AND jsonb_typeof(${table.manifest}->'source') = 'object'\n        AND jsonb_typeof(${table.manifest}->'entries') = 'array'\n        AND jsonb_array_length(${table.manifest}->'entries') BETWEEN 1 AND 100\n        AND jsonb_typeof(${table.manifest}->'fingerprint') = 'string'\n      ) IS TRUE`,\n    ),\n    check(\n      "discovery_manifest_identity_ck",\n      sql`(\n        ${table.manifest}->>'fingerprint' = ${table.fingerprint}\n        AND (${table.manifest}->>'schemaVersion')::integer = ${table.schemaVersion}\n        AND ${table.manifest}->'source'->>'kind' = 'booth_listing_identity_only'\n        AND ${table.manifest}->'source'->>'sourceSha' = ${table.sourceSha}\n        AND ${table.manifest}->'source'->>'parserVersion' = ${table.parserVersion}\n        AND ${table.manifest}->'source'->>'listingUrl' = ${table.listingUrl}\n        AND ${table.manifest}->'source'->>'listingRawSha256' = ${table.listingRawSha256}\n      ) IS TRUE`,\n    ),\n  ],\n);\n\n'''
          if 'export const discoveryManifest = pgTable(' not in text:
              if marker not in text:
                  raise SystemExit('registry snapshot insertion point missing')
              text = text.replace(marker, table + marker, 1)
          schema_marker = 'export const persistenceSchema = {\n  registrySnapshot,\n'
          if 'export const persistenceSchema = {\n  discoveryManifest,\n' not in text:
              if schema_marker not in text:
                  raise SystemExit('persistence schema insertion point missing')
              text = text.replace(schema_marker, 'export const persistenceSchema = {\n  discoveryManifest,\n  registrySnapshot,\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Assert Stage 30 stays offline
        run: |
          ! grep -R --line-number -- '--mode network' src/persistence/discovery-manifest* docs/DISCOVERY_MANIFEST.md || { echo 'network invocation found'; exit 1; }
      - run: npm ci
      - run: npx prettier --write src/persistence/schema.ts src/persistence/discovery-manifest-repository.ts src/persistence/discovery-manifest-persistence.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run src/persistence/discovery-manifest-persistence.test.ts
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: npm run build
      - name: Commit Stage 30 schema and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/persistence/schema.ts src/persistence/discovery-manifest-repository.ts src/persistence/discovery-manifest-persistence.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(persistence): validate discovery manifest snapshots"
          git push origin HEAD:agent/stage30-discovery-manifest-persistence
