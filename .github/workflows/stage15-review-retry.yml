name: Stage 15 review-case hardened validation

on:
  push:
    branches:
      - agent/stage15-review-cases
    paths:
      - .github/workflows/stage15-review-retry.yml

permissions:
  contents: write

concurrency:
  group: stage15-review-case-retry
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage15-review-cases
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Apply Stage 15 schema/docs when needed and harden comparisons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          schema = Path("src/persistence/schema.ts")
          if "export const reviewCase = pgTable(" not in schema.read_text(encoding="utf-8"):
              transport = Path(".github/workflows/stage15-review-validation.yml")
              if not transport.exists():
                  raise SystemExit("Stage 15 schema is absent and the source transport is unavailable")
              source = transport.read_text(encoding="utf-8")
              opening = "          python3 - <<'PY'\n"
              start = source.index(opening) + len(opening)
              end = source.index("\n          PY\n", start)
              program = textwrap.dedent(source[start:end])
              exec(compile(program, "stage15-schema-docs", "exec"), {})

          repository = Path("src/persistence/review-repository.ts")
          text = repository.read_text(encoding="utf-8")
          old = "          existing.createdAt !== createdAt ||"
          new = "          timestamp(existing.createdAt) !== createdAt ||"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Review idempotence timestamp comparison marker is missing")
          repository.write_text(text, encoding="utf-8")

          text = schema.read_text(encoding="utf-8")
          text = text.replace("(\\\\\\\\.[a-z][a-z0-9_]*){0,5}", "([.][a-z][a-z0-9_]*){0,5}")
          text = text.replace("(\\\\.[a-z][a-z0-9_]*){0,5}", "([.][a-z][a-z0-9_]*){0,5}")
          schema.write_text(text, encoding="utf-8")
          PY
      - name: Format TypeScript sources
        run: npm run format
      - name: Generate or verify Stage 15 migration
        run: |
          set -euo pipefail
          migration="$(find drizzle -maxdepth 1 -type f -name '0003_*stage15_review_cases.sql' -print)"
          if [ -z "$migration" ]; then
            npx drizzle-kit generate --name=stage15_review_cases
            migration="$(find drizzle -maxdepth 1 -type f -name '0003_*stage15_review_cases.sql' -print)"
            cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION public.stage15_guard_review_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            RAISE EXCEPTION 'review records are append-only';
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER review_case_append_only
          BEFORE UPDATE OR DELETE ON review_case
          FOR EACH ROW EXECUTE FUNCTION public.stage15_guard_review_append_only();

          --> statement-breakpoint
          CREATE TRIGGER review_decision_event_append_only
          BEFORE UPDATE OR DELETE ON review_decision_event
          FOR EACH ROW EXECUTE FUNCTION public.stage15_guard_review_append_only();
          SQL
          fi
          test -n "$migration"
          test "$(find drizzle -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 4
          python3 - "$migration" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          text = text.replace("(\\\\.[a-z][a-z0-9_]*){0,5}", "([.][a-z][a-z0-9_]*){0,5}")
          path.write_text(text, encoding="utf-8")
          PY
          grep -q 'CREATE TABLE "review_case"' "$migration"
          grep -q 'review_case_append_only' "$migration"
      - name: Verify exact Stage 15 allowlist
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess
          allowed = {
              "docs/DECISIONS.md", "docs/ROADMAP.md", "docs/PHYSICAL_SCHEMA.md",
              "docs/DATA_MODEL.md", "src/review.ts", "src/review.test.ts",
              "src/persistence/schema.ts", "src/persistence/review-repository.ts",
              "src/persistence/review-persistence.test.ts",
              "drizzle/0003_stage15_review_cases.sql", "drizzle/meta/0003_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          transports = {
              ".github/workflows/stage15-review-validation.yml",
              ".github/workflows/stage15-review-retry.yml",
          }
          committed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          working = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          untracked = set(subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines())
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed - transports)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Stage 15 paths did not change: {missing}")
          PY
      - name: Run complete repository gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Run source guards and Python regression
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          trap 'mv "$RUNNER_TEMP/node_modules" node_modules 2>/dev/null || true' EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          mv "$RUNNER_TEMP/node_modules" node_modules
          trap - EXIT
          python -m unittest discover -s tests
      - name: Install Chromium and run browser regression
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Remove transports and publish verified Stage 15 commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage15-review-validation.yml
          rm -f .github/workflows/stage15-review-retry.yml
          git checkout -- tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/ROADMAP.md docs/PHYSICAL_SCHEMA.md docs/DATA_MODEL.md src/review.ts src/review.test.ts src/persistence/schema.ts src/persistence/review-repository.ts src/persistence/review-persistence.test.ts drizzle/0003_stage15_review_cases.sql drizzle/meta/0003_snapshot.json drizzle/meta/_journal.json
          git add -u .github/workflows/stage15-review-validation.yml .github/workflows/stage15-review-retry.yml
          git commit -m 'feat(review): add immutable local review cases for issue 111'
          git push origin HEAD:agent/stage15-review-cases
