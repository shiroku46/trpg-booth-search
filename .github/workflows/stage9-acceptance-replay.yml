name: Stage 9 Acceptance Replay

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage9-acceptance-replay
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      github.event.issue.number == 85 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/apply-stage9-acceptance-replay-v3' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage9-issue-85-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Load reviewed hardening steps
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '966a98c271e518bcfde100027413e76b6d4b7caf'
          git fetch origin main
          git show origin/main:.github/workflows/stage9-acceptance-hardening.yml > "$RUNNER_TEMP/hardening.yml"
          ruby -ryaml - "$RUNNER_TEMP/hardening.yml" "$RUNNER_TEMP" <<'RB'
          workflow_path, output_dir = ARGV
          steps = YAML.load_file(workflow_path).fetch("jobs").fetch("harden").fetch("steps")
          names = [
            "Verify exact candidate and harden source identity",
            "Enforce normalization-history entity ownership",
            "Add ownership, nested-envelope, and publication-parity tests",
            "Regenerate migration and add nested envelope validators",
            "Run audit and complete gates",
            "Commit acceptance-hardened candidate",
          ]
          names.each_with_index do |name, index|
            step = steps.find { |candidate| candidate["name"] == name }
            raise "missing reviewed step: #{name}" unless step
            File.write(File.join(output_dir, "stage9-step-#{index + 1}.sh"), step.fetch("run"))
          end
          RB

      - name: Apply reviewed hardening and migration-first recovery procedure
        env:
          EXPECTED_HEAD: 966a98c271e518bcfde100027413e76b6d4b7caf
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-1.sh"
          bash "$RUNNER_TEMP/stage9-step-2.sh"
          bash "$RUNNER_TEMP/stage9-step-3.sh"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/persistence/persistence.test.ts")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'const initialDump = await pgDump({ pg: client });':
                  'const initialDump = await pgDump({ pg: client, args: ["--data-only"] });',
              '    await restoredClient.exec(initialSql);':
                  '    await applyCommittedMigrations(restoredClient);\n    await restoredClient.exec(initialSql);',
              'const purgedDump = await pgDump({ pg: restoredClient });':
                  'const purgedDump = await pgDump({ pg: restoredClient, args: ["--data-only"] });',
              '    await purgedRestoredClient.exec(purgedSql);':
                  '    await applyCommittedMigrations(purgedRestoredClient);\n    await purgedRestoredClient.exec(purgedSql);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"recovery anchor mismatch: {old}")
              text = text.replace(old, new)

          if text.count('reason: "required_core",') != 2:
              raise SystemExit("protected publication reason changed unexpectedly")
          path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate and schema-qualify the committed migration
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-4.sh"
          python3 - <<'PY'
          from pathlib import Path
          import re

          migrations = sorted(Path("drizzle").glob("*.sql"))
          if len(migrations) != 1:
              raise SystemExit("expected exactly one Stage 9 migration")
          path = migrations[0]
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"CREATE OR REPLACE FUNCTION (stage9_[a-z0-9_]+)",
              r"CREATE OR REPLACE FUNCTION public.\1",
              text,
          )
          text = re.sub(
              r"(?<!public\.)\b(stage9_valid_[a-z0-9_]+)\b",
              r"public.\1",
              text,
          )
          text = re.sub(
              r"(?<!public\.)\bstage9_guard_append_only\b",
              "public.stage9_guard_append_only",
              text,
          )
          required = [
              "public.stage9_valid_base_envelope",
              "public.stage9_valid_relationship_array",
              "public.stage9_guard_append_only",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing qualified migration marker: {marker}")
          if re.search(r"(?<!public\.)\bstage9_(?:valid_|guard_)", text):
              raise SystemExit("unqualified Stage 9 helper remains")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Run every acceptance gate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-5.sh"

      - name: Commit corrected acceptance candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-6.sh"
