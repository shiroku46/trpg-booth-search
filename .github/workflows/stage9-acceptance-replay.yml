name: Stage 9 Acceptance Replay

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage9-acceptance-replay
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      github.event.issue.number == 85 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/apply-stage9-acceptance-replay' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage9-issue-85-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Load reviewed hardening steps
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '966a98c271e518bcfde100027413e76b6d4b7caf'
          git fetch origin main
          git show origin/main:.github/workflows/stage9-acceptance-hardening.yml > "$RUNNER_TEMP/hardening.yml"
          ruby -ryaml - "$RUNNER_TEMP/hardening.yml" "$RUNNER_TEMP" <<'RB'
          workflow_path, output_dir = ARGV
          steps = YAML.load_file(workflow_path).fetch("jobs").fetch("harden").fetch("steps")
          names = [
            "Verify exact candidate and harden source identity",
            "Enforce normalization-history entity ownership",
            "Add ownership, nested-envelope, and publication-parity tests",
            "Regenerate migration and add nested envelope validators",
            "Run audit and complete gates",
            "Commit acceptance-hardened candidate",
          ]
          names.each_with_index do |name, index|
            step = steps.find { |candidate| candidate["name"] == name }
            raise "missing reviewed step: #{name}" unless step
            File.write(File.join(output_dir, "stage9-step-#{index + 1}.sh"), step.fetch("run"))
          end
          RB

      - name: Apply reviewed schema and ownership hardening
        env:
          EXPECTED_HEAD: 966a98c271e518bcfde100027413e76b6d4b7caf
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-1.sh"
          bash "$RUNNER_TEMP/stage9-step-2.sh"
          bash "$RUNNER_TEMP/stage9-step-3.sh"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/persistence/persistence.test.ts")
          text = path.read_text(encoding="utf-8")
          old = 'reason: "required_core",'
          if text.count(old) != 2:
              raise SystemExit("unexpected protected reason count")
          path.write_text(text.replace(old, 'reason: "scenario_field",'), encoding="utf-8")
          PY

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate migration and run every gate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-4.sh"
          bash "$RUNNER_TEMP/stage9-step-5.sh"

      - name: Commit corrected acceptance candidate
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/stage9-step-6.sh"
