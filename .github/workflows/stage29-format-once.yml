name: Stage 29 Format Once

on:
  push:
    branches:
      - agent/stage29-discovery-manifest

permissions: {}

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage29-discovery-manifest
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx prettier --write src/discovery-manifest.ts src/discovery-manifest.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run src/discovery-manifest.test.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/discovery-manifest.ts src/discovery-manifest.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(discovery): format Stage 29 manifest"
          git push origin HEAD:agent/stage29-discovery-manifest
