name: Stage 30 Docs Once

on:
  push:
    branches:
      - agent/stage30-discovery-manifest-persistence

permissions: {}

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage30-discovery-manifest-persistence
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Synchronize Stage 30 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/DISCOVERY_MANIFEST.md': '''\n\n## Stage 30 local immutable persistence\n\nValidated identity-only manifests may be installed into the local `discovery_manifest` snapshot table by exact manifest fingerprint. The database stores the validated manifest plus only duplicated schema/source identity columns needed for fail-closed integrity checks. The repository validates before insert and after load, treats identical reinstall as an idempotent no-op, resolves only an explicit fingerprint, and returns detached immutable data.\n\nDatabase triggers prohibit update and delete. Installing or loading a manifest does not create a `booth_product`, scenario, review case, publication row, or permission to fetch a product page. The live CAPTCHA stop remains binding.\n''',
            'docs/ARCHITECTURE.md': '''\n\n## Stage 30 identity-only discovery persistence boundary\n\n`PostgresDiscoveryManifestRepository` is an offline adapter beneath the Stage 29 identity-only manifest contract. It persists only validated fingerprinted discovery manifests in local PostgreSQL-compatible storage and exposes exact-fingerprint install/load operations. There is no latest-manifest discovery, product promotion, network adapter, scheduler, or public projection at this boundary.\n\nThe `discovery_manifest` table is append-only. Database checks bind the duplicated source SHA, parser version, fixed listing URL, listing raw hash, schema version, and manifest fingerprint to the JSON envelope; application validation re-verifies the full Stage 29 contract after load.\n''',
            'docs/DATA_MODEL.md': '''\n\n## Stage 30 discovery-manifest persistence note\n\n`discovery_manifest` is a local ingestion-control snapshot, not a `booth_product` or public entity. Its identity is the Stage 29 manifest fingerprint. It contains only the versioned identity-only manifest and bounded source metadata. Product IDs/URLs inside the manifest remain discovery candidates with unknown age and classification and have no foreign-key promotion into product/scenario/publication state.\n''',
            'docs/DECISIONS.md': '''\n\n## D-047 — Discovery identities persist separately from products\n\n**Decision:** A validated Stage 29 identity-only discovery manifest may be persisted locally as one immutable fingerprint-keyed snapshot, but its entries may not be inserted into `booth_product` or any publication/review pipeline merely because they were discovered.\n\n**Rationale:** Durable identity handoff is useful for reproducibility and later explicitly authorized processing, while treating a listing link as an all-ages/classified product would collapse the project’s evidence boundary.\n\n**Consequences:** the snapshot table is append-only, exact-fingerprint addressed, and independently validated before write and after read. Reinstalling identical content is idempotent. No BOOTH request, CAPTCHA retry/bypass, product-detail access, hosted provider, or public eligibility change follows from persistence.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 30 — Immutable local discovery-manifest persistence\n\n- [x] Persist validated Stage 29 manifests by exact fingerprint only.\n- [x] Enforce source/parser/listing/hash identity at database and repository boundaries.\n- [x] Make identical reinstall idempotent and block update/delete.\n- [x] Return detached immutable manifests after full validation.\n- [x] Prove product, scenario, review, and publication state are not promoted by installation.\n- [x] Prove dump/restore compatibility entirely offline.\n''',
          }
          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              heading = next(line for line in section.splitlines() if line.startswith('## '))
              if heading not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - run: python scripts/validate_repository.py
      - run: python scripts/public_export_guard.py .
      - name: Commit Stage 30 docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/DISCOVERY_MANIFEST.md docs/ARCHITECTURE.md docs/DATA_MODEL.md docs/DECISIONS.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(persistence): record Stage 30 manifest boundary"
          git push origin HEAD:agent/stage30-discovery-manifest-persistence
