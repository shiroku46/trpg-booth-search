name: Stage 23 Complete

on:
  push:
    branches:
      - agent/stage23-fixture-reviewed-search

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage23-fixture-reviewed-search
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Add reviewed fixture adapter
        run: |
          cat > src/fixture-reviewed-search.ts <<'EOF'
          import type { FixtureRepository, Scenario } from "./domain";
          import { composeReviewedOverlayBatch } from "./reviewed-overlay-batch";
          import {
            composeReviewedPublicationIndex,
            type ReviewedPublicationIndexInput,
            type ReviewedPublicationIndexResult,
          } from "./reviewed-publication-index";
          import {
            executeReviewedSearch,
            type ReviewedSearchResult,
          } from "./reviewed-search";
          import { EMPTY_QUERY, type CanonicalSearchQuery } from "./search";

          export function buildFixtureReviewedPublicationIndex(
            repo: FixtureRepository,
          ): ReviewedPublicationIndexResult {
            const products = repo.products();
            const scenarios = repo.scenarios();
            const scenariosByProduct = new Map<string, Scenario[]>();

            for (const scenario of scenarios) {
              const group = scenariosByProduct.get(scenario.productId) ?? [];
              group.push(scenario);
              scenariosByProduct.set(scenario.productId, group);
            }

            const knownProductIds = new Set(products.map((product) => product.id));
            const inputs: ReviewedPublicationIndexInput[] = products.map((product) => ({
              productId: product.id,
              graph: composeReviewedOverlayBatch(
                product,
                scenariosByProduct.get(product.id) ?? [],
                [],
              ),
            }));

            for (const productId of scenariosByProduct.keys()) {
              if (!knownProductIds.has(productId)) inputs.push({ productId });
            }

            return composeReviewedPublicationIndex(inputs);
          }

          export function searchReviewedFixtureRepository(
            repo: FixtureRepository,
            query: CanonicalSearchQuery = EMPTY_QUERY,
          ): ReviewedSearchResult {
            return executeReviewedSearch(buildFixtureReviewedPublicationIndex(repo), {
              query,
            });
          }
          EOF
      - name: Add adapter regression tests
        run: |
          cat > src/fixture-reviewed-search.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { fixtureRepository } from "../fixtures";
          import type { FixtureRepository } from "./domain";
          import {
            buildFixtureReviewedPublicationIndex,
            searchReviewedFixtureRepository,
          } from "./fixture-reviewed-search";
          import {
            EMPTY_QUERY,
            SORT_ORDERS,
            search,
            type CanonicalSearchQuery,
          } from "./search";

          function query(
            overrides: Partial<CanonicalSearchQuery>,
          ): CanonicalSearchQuery {
            return {
              ...EMPTY_QUERY,
              ...overrides,
              tags: {
                ...EMPTY_QUERY.tags,
                ...(overrides.tags ?? {}),
              },
            };
          }

          describe("Stage 23 fixture reviewed-search adapter", () => {
            it.each(SORT_ORDERS)(
              "matches legacy fixture search for %s sorting",
              (sort) => {
                const request = query({ sort, seed: "stage23-seed" });
                expect(
                  searchReviewedFixtureRepository(fixtureRepository, request).rows,
                ).toEqual(search(fixtureRepository, request));
              },
            );

            it("matches representative legacy filters and explicit unknown states", () => {
              const requests: CanonicalSearchQuery[] = [
                query({ keyword: "図書館" }),
                query({ system: "合成システムB" }),
                query({ edition: "6版" }),
                query({ edition: "unknown" }),
                query({ playerCount: "1" }),
                query({ playerCount: "unknown" }),
                query({ playTime: "long" }),
                query({ modality: "offline" }),
                query({ book: "追加資料集" }),
                query({ compatibility: "旧版対応" }),
                query({ tags: { ...EMPTY_QUERY.tags, genre: "ホラー" } }),
                query({ keyword: "一致しない検索語" }),
              ];

              for (const request of requests) {
                expect(
                  searchReviewedFixtureRepository(fixtureRepository, request).rows,
                ).toEqual(search(fixtureRepository, request));
              }
            });

            it("is independent of fixture repository caller ordering", () => {
              const reversed: FixtureRepository = {
                products: () => [...fixtureRepository.products()].reverse(),
                scenarios: () => [...fixtureRepository.scenarios()].reverse(),
              };
              for (const sort of SORT_ORDERS) {
                const request = query({ sort, seed: "order-independent" });
                expect(
                  searchReviewedFixtureRepository(reversed, request),
                ).toEqual(
                  searchReviewedFixtureRepository(fixtureRepository, request),
                );
              }
            });

            it("does not mutate fixtures and returns detached immutable read models", () => {
              const before = JSON.stringify({
                products: fixtureRepository.products(),
                scenarios: fixtureRepository.scenarios(),
              });
              const index = buildFixtureReviewedPublicationIndex(fixtureRepository);
              const result = searchReviewedFixtureRepository(fixtureRepository);

              expect(
                JSON.stringify({
                  products: fixtureRepository.products(),
                  scenarios: fixtureRepository.scenarios(),
                }),
              ).toBe(before);
              expect(index.report).toHaveLength(fixtureRepository.products().length);
              expect(index.report.every((item) => item.state === "projected")).toBe(
                true,
              );
              expect(result.publicationReport).toEqual(index.report);
              expect(result.rows).not.toBe(index.rows);
              expect(Object.isFrozen(index)).toBe(true);
              expect(Object.isFrozen(index.rows)).toBe(true);
              expect(Object.isFrozen(index.report)).toBe(true);
              expect(Object.isFrozen(result)).toBe(true);
              expect(Object.isFrozen(result.query)).toBe(true);
              expect(Object.isFrozen(result.rows)).toBe(true);
              expect(Object.isFrozen(result.publicationReport)).toBe(true);
            });
          });
          EOF
      - name: Route Preview through reviewed fixture search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import { fixtureRepository } from "../fixtures";\n',
              'import { fixtureRepository } from "../fixtures";\nimport { searchReviewedFixtureRepository } from "../src/fixture-reviewed-search";\n',
              1,
          )
          text = text.replace('  search,\n', '', 1)
          old = '  const rows = parsed.invalid ? [] : search(fixtureRepository, parsed.query);\n'
          new = '  const rows = parsed.invalid\n    ? []\n    : searchReviewedFixtureRepository(fixtureRepository, parsed.query).rows;\n'
          if old not in text:
              raise SystemExit('expected legacy search call not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Document Stage 23
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/ARCHITECTURE.md': '''\n\n## Stage 23 fixture Preview integration\n\nThe public fixture Preview now enters the same provider-neutral read chain used by the reviewed data path: explicit fixture products are grouped with their scenarios, materialized as empty-target Stage 18 reviewed graphs, composed into the Stage 19 publication index, and executed through Stage 20 reviewed search. The fixture dataset remains synthetic and no persistence or network provider is introduced.\n''',
            'docs/DATA_MODEL.md': '''\n\n## Stage 23 fixture reviewed-search adapter\n\nThe fixture adapter is a derived read model only. It creates no stored entity and does not mutate fixture products or scenarios. Its output is the Stage 20 reviewed search result: a canonical query, public scenario rows, and the complete immutable Stage 19 publication report. Orphan scenario product IDs, if supplied by a fixture repository, remain explicit as missing-product report entries rather than being promoted into public rows.\n''',
            'docs/DECISIONS.md': '''\n\n## D-042 — The fixture Preview must exercise the reviewed read pipeline\n\n**Decision:** The visible synthetic Preview must no longer call the legacy fixture repository search path directly. It must compose fixtures through Stage 18 reviewed graphs, the Stage 19 publication index, and Stage 20 reviewed search while preserving byte/value-equivalent public results.\n\n**Rationale:** This keeps the public application integration aligned with the reviewed production-shaped read boundary even while live BOOTH collection is stopped, reducing the future provider-swap gap without pretending fixtures are production data.\n\n**Consequences:** No fixture content, publication rule, sort/filter semantics, CSS, provider, persistence schema, external request, or hosted resource changes. The legacy `search()` function remains as a regression oracle and fixture-level primitive.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 23 — Fixture Preview through reviewed search\n\n- [x] Group explicit fixture scenarios by product and create empty-target Stage 18 reviewed graphs.\n- [x] Compose the Stage 19 publication index and execute Stage 20 reviewed search.\n- [x] Route the visible fixture Preview through the reviewed adapter instead of direct legacy fixture search.\n- [x] Preserve exact existing filter/sort behavior including seeded random and explicit unknown states.\n- [x] Preserve complete immutable publication reports and source-fixture non-mutation.\n- [x] Keep live BOOTH access stopped at the challenge/login boundary.\n''',
          }
          for name, section in sections.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              heading = next(line for line in section.splitlines() if line.startswith('## '))
              if heading not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Format Stage 23 files
        run: npx prettier --write src/fixture-reviewed-search.ts src/fixture-reviewed-search.test.ts app/page.tsx
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Stage 23 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fixture-reviewed-search.ts src/fixture-reviewed-search.test.ts app/page.tsx docs/ARCHITECTURE.md docs/DATA_MODEL.md docs/DECISIONS.md docs/ROADMAP.md
          git commit -m "feat(stage23): route fixture preview through reviewed search"
          git push origin HEAD:agent/stage23-fixture-reviewed-search
