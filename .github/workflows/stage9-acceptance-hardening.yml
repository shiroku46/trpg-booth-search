          CREATE OR REPLACE FUNCTION stage9_valid_string_envelope_array(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN jsonb_typeof(value) <> 'array' THEN false
            ELSE NOT EXISTS (
              SELECT 1
              FROM jsonb_array_elements(value) AS envelope
              WHERE NOT stage9_valid_string_envelope(envelope, ARRAY[]::text[])
