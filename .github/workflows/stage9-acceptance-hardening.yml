          CREATE OR REPLACE FUNCTION stage9_valid_relationship_array(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN jsonb_typeof(value) <> 'array' THEN false
            ELSE NOT EXISTS (
              SELECT 1
              FROM jsonb_array_elements(value) AS relationship
              WHERE NOT ((
                jsonb_typeof(relationship) = 'object'
                AND (SELECT count(*) FROM jsonb_object_keys(relationship)) = 2
                AND relationship ?& ARRAY['system', 'aliases']
                AND stage9_valid_string_envelope(
                  relationship->'system', ARRAY[]::text[]
                )
                AND stage9_valid_string_array_envelope(relationship->'aliases')
              ) IS TRUE)
            )
          END;
          $$;

