      - name: Run audit and complete gates
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build
          rm -rf node_modules .next
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests

      - name: Commit acceptance-hardened candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/persistence/schema.ts src/persistence/repository.ts src/persistence/persistence.test.ts drizzle
          changed=$(git diff --cached --name-only)
          if printf '%s\n' "$changed" | grep -Ev '^(src/persistence/(schema|repository|persistence\.test)\.ts|drizzle/)' ; then
            echo 'Unexpected changed path' >&2
            exit 1
          fi
          git commit -m 'fix(stage9): close ownership and nested-envelope gaps'
          git push origin HEAD:fix/stage9-issue-85-persistence
