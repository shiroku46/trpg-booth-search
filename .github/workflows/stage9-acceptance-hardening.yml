name: Stage 9 Acceptance Hardening

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: stage9-acceptance-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.issue.number == 85 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/apply-stage9-acceptance-hardening' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/stage9-issue-85-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate and harden source identity
        env:
          EXPECTED_HEAD: 966a98c271e518bcfde100027413e76b6d4b7caf
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('src/persistence/schema.ts')
          text = schema.read_text(encoding='utf-8')
          anchor = '''    check(
                "booth_product_canonical_url_ck",
                sql`${table.canonicalUrl} ~ '^https://booth[.]pm/(?:[A-Za-z]{2}/)?items/[0-9]+$'`,
              ),
          '''
          addition = anchor + '''    check(
                "booth_product_source_identity_match_ck",
                sql`(
                  ${table.sourceProductId} ~ '^[0-9]+$'
                  AND substring(${table.canonicalUrl} from '/items/([0-9]+)$') = ${table.sourceProductId}
                ) IS TRUE`,
              ),
              check(
                "booth_product_version_and_time_ck",
                sql`(
                  length(btrim(${table.contentVersion})) > 0
                  AND ${table.firstSeenAt} <= ${table.lastCheckedAt}
                  AND ${table.firstSeenAt} <= ${table.currentRecordUpdatedAt}
                ) IS TRUE`,
              ),
          '''
          if text.count(anchor) != 1:
              raise SystemExit('product identity anchor mismatch')
          text = text.replace(anchor, addition)

          scenario_anchor = '''    index("scenario_last_checked_idx").on(table.lastCheckedAt),
          '''
          scenario_addition = scenario_anchor + '''    check(
                "scenario_version_and_time_ck",
                sql`(
                  length(btrim(${table.contentVersion})) > 0
                  AND ${table.firstSeenAt} <= ${table.lastCheckedAt}
                  AND ${table.firstSeenAt} <= ${table.currentRecordUpdatedAt}
                ) IS TRUE`,
              ),
          '''
          if text.count(scenario_anchor) != 1:
              raise SystemExit('scenario time anchor mismatch')
          text = text.replace(scenario_anchor, scenario_addition)

          snapshot_anchor = '''    check(
                "source_snapshot_normalized_hash_ck",
                sql`${table.normalizedSha256} IS NULL OR ${table.normalizedSha256} ~ '^[0-9a-f]{64}$'`,
              ),
          '''
          snapshot_addition = snapshot_anchor + '''    check(
                "source_snapshot_safe_metadata_ck",
                sql`(
                  ${table.outcome} ~ '^[a-z0-9_:-]{1,64}$'
                  AND length(btrim(${table.contentVersion})) > 0
                  AND length(btrim(${table.parserVersion})) > 0
                ) IS TRUE`,
              ),
          '''
          if text.count(snapshot_anchor) != 1:
              raise SystemExit('snapshot anchor mismatch')
          text = text.replace(snapshot_anchor, snapshot_addition)

          history_anchor = '''    check(
                "normalization_history_decision_shape_ck",
                sql`jsonb_typeof(${table.decision}) = 'object'`,
              ),
          '''
          history_addition = history_anchor + '''    check(
                "normalization_history_version_ck",
                sql`(
                  length(btrim(${table.contentVersion})) > 0
                  AND length(btrim(${table.normalizerVersion})) > 0
                  AND length(btrim(${table.registryVersion})) > 0
                ) IS TRUE`,
              ),
          '''
          if text.count(history_anchor) != 1:
              raise SystemExit('history anchor mismatch')
          schema.write_text(text.replace(history_anchor, history_addition), encoding='utf-8')
          PY

      - name: Enforce normalization-history entity ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/persistence/repository.ts')
          text = path.read_text(encoding='utf-8')
          anchor = '''    if (
                input.sourceSnapshots?.some(
                  (item) => item.productId !== input.product.id,
                ) ||
                input.normalizationHistory?.some(
                  (item) => item.productId !== input.product.id,
                )
              )
                throw new Error(
                  "Snapshot and history ownership must use the product ID.",
                );

          '''
          addition = anchor + '''    const scenarioIds = new Set(input.scenarios.map((item) => item.id));
              if (
                input.normalizationHistory?.some((item) =>
                  item.entityType === "booth_product"
                    ? item.entityId !== input.product.id
                    : !scenarioIds.has(item.entityId),
                )
              )
                throw new Error(
                  "Normalization history must reference an entity owned by the product graph.",
                );

          '''
          if text.count(anchor) != 1:
              raise SystemExit('repository ownership anchor mismatch')
          path.write_text(text.replace(anchor, addition), encoding='utf-8')
          PY

      - name: Add ownership, nested-envelope, and publication-parity tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/persistence/persistence.test.ts')
          text = path.read_text(encoding='utf-8')

          unknown_anchor = '''const known = <T>(value: T): EvidencedValue<T> => ({
            state: "known",
            value,
            ...meta(),
          });

          '''
          unknown_addition = unknown_anchor + '''const unknown = <T>(): EvidencedValue<T> => ({
            state: "unknown",
            ...meta(),
          });

          '''
          if text.count(unknown_anchor) != 1:
              raise SystemExit('unknown helper anchor mismatch')
          text = text.replace(unknown_anchor, unknown_addition)

          identity_anchor = '''    await expect(
                db.insert(scenarioTable).values({
                  id: "24444444-4444-4444-8444-444444444444",
          '''
          identity_addition = '''    await expect(
                db.insert(boothProduct).values({
                  id: "14444444-4444-4444-8444-444444444445",
                  sourcePlatform: "booth",
                  sourceProductId: "100099",
                  canonicalUrl: "https://booth.pm/ja/items/100004",
                  observedTitle: "不一致ID",
                  allAgesState: known("all_ages_confirmed"),
                  classification: classification(),
                  salesState: known<SalesState>("available"),
                  sourcePublicationDate: known("2026-08-01T00:00:00Z"),
                  isFree: null,
                  firstSeenAt: NOW,
                  lastCheckedAt: NOW,
                  contentVersion: "synthetic-product-v1",
                  currentRecordUpdatedAt: NOW,
                }),
              ).rejects.toThrow();

          ''' + identity_anchor
          if text.count(identity_anchor) != 1:
              raise SystemExit('identity test anchor mismatch')
          text = text.replace(identity_anchor, identity_addition)

          nested_anchor = '''    const incompleteTags = tags() as Record<string, unknown>;
              delete incompleteTags.content;
          '''
          nested_addition = '''    const invalidTagValue = tags();
              invalidTagValue.genre = known([""]);
              await expect(
                db.insert(scenarioTable).values({
                  ...scenarioBase,
                  id: "29999999-9999-4999-8999-999999999994",
                  playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
                  modality: known<Modality>("online"),
                  tags: invalidTagValue,
                }),
              ).rejects.toThrow();

              await expect(
                db.insert(scenarioTable).values({
                  ...scenarioBase,
                  id: "29999999-9999-4999-8999-999999999995",
                  playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
                  modality: known<Modality>("online"),
                  requiredBooks: [
                    known({ title: "不正書籍", kind: "forbidden" }) as never,
                  ],
                }),
              ).rejects.toThrow();

              await expect(
                db.insert(scenarioTable).values({
                  ...scenarioBase,
                  id: "29999999-9999-4999-8999-999999999996",
                  playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
                  modality: known<Modality>("online"),
                  relationships: [
                    { system: known(""), aliases: known(["別名"]) },
                  ],
                }),
              ).rejects.toThrow();

          ''' + nested_anchor
          if text.count(nested_anchor) != 1:
              raise SystemExit('nested test anchor mismatch')
          text = text.replace(nested_anchor, nested_addition)

          history_anchor = '''  it("keeps permitted history append-only outside the restricted purge service", async () => {
          '''
          ownership_test = '''  it("rejects product, snapshot, and history entity ownership mismatches", async () => {
              const { repository } = await freshDatabase();
              const scenarioMismatch = graph({
                productId: "31111111-1111-4111-8111-111111111111",
                scenarioId: "41111111-1111-4111-8111-111111111111",
                sourceProductId: "200001",
              });
              scenarioMismatch.scenarios = scenarioMismatch.scenarios.map((item) => ({
                ...item,
                productId: "31111111-1111-4111-8111-111111111112",
              }));
              await expect(repository.saveGraph(scenarioMismatch)).rejects.toThrow();

              const snapshotMismatch = graph({
                productId: "32222222-2222-4222-8222-222222222222",
                scenarioId: "42222222-2222-4222-8222-222222222222",
                sourceProductId: "200002",
              });
              snapshotMismatch.sourceSnapshots = snapshotMismatch.sourceSnapshots?.map(
                (item) => ({
                  ...item,
                  productId: "32222222-2222-4222-8222-222222222223",
                }),
              );
              await expect(repository.saveGraph(snapshotMismatch)).rejects.toThrow();

              const entityMismatch = graph({
                productId: "33333333-3333-4333-8333-333333333333",
                scenarioId: "43333333-3333-4333-8333-333333333333",
                sourceProductId: "200003",
              });
              entityMismatch.normalizationHistory =
                entityMismatch.normalizationHistory?.map((item) => ({
                  ...item,
                  entityId: "43333333-3333-4333-8333-333333333334",
                }));
              await expect(repository.saveGraph(entityMismatch)).rejects.toThrow();
            });

          ''' + history_anchor
          if text.count(history_anchor) != 1:
              raise SystemExit('ownership test anchor mismatch')
          text = text.replace(history_anchor, ownership_test)

          dump_anchor = '''  it("dumps and restores the database before and after a product-scoped age purge", async () => {
          '''
          publication_test = '''  it("preserves sold-out publication and keeps unsafe values fail-closed after persistence", async () => {
              const { repository } = await freshDatabase();

              const soldOut = graph({
                productId: "34444444-4444-4444-8444-444444444444",
                scenarioId: "44444444-4444-4444-8444-444444444444",
                sourceProductId: "200004",
                salesState: "sold_out",
              });
              await repository.saveGraph(soldOut);
              const soldOutLoaded = await repository.loadGraph(soldOut.product.id);
              expect(project(soldOutLoaded?.product, soldOutLoaded!.scenarios[0]!).publish).toBe(
                true,
              );

              const ended = graph({
                productId: "35555555-5555-4555-8555-555555555555",
                scenarioId: "45555555-5555-4555-8555-555555555555",
                sourceProductId: "200005",
                salesState: "sales_ended",
              });
              await repository.saveGraph(ended);
              const endedLoaded = await repository.loadGraph(ended.product.id);
              expect(project(endedLoaded?.product, endedLoaded!.scenarios[0]!)).toMatchObject({
                publish: false,
                reason: "sales_ended",
              });

              const held = graph({
                productId: "36666666-6666-4666-8666-666666666666",
                scenarioId: "46666666-6666-4666-8666-666666666666",
                sourceProductId: "200006",
              });
              held.scenarios = held.scenarios.map((item) => ({ ...item, hold: true }));
              await repository.saveGraph(held);
              const heldLoaded = await repository.loadGraph(held.product.id);
              expect(project(heldLoaded?.product, heldLoaded!.scenarios[0]!)).toMatchObject({
                publish: false,
                reason: "hold_or_missing_product",
              });

              const explicitUnknown = graph({
                productId: "37777777-7777-4777-8777-777777777777",
                scenarioId: "47777777-7777-4777-8777-777777777777",
                sourceProductId: "200007",
              });
              explicitUnknown.scenarios = explicitUnknown.scenarios.map((item) => ({
                ...item,
                playerCount: unknown<PlayerCountRange>(),
              }));
              await repository.saveGraph(explicitUnknown);
              const unknownLoaded = await repository.loadGraph(explicitUnknown.product.id);
              const unknownDecision = project(
                unknownLoaded?.product,
                unknownLoaded!.scenarios[0]!,
              );
              expect(unknownDecision.publish).toBe(true);
              if (unknownDecision.publish)
                expect(unknownDecision.value.playerCount).toEqual({ state: "unknown" });

              const conflicted = graph({
                productId: "38888888-8888-4888-8888-888888888888",
                scenarioId: "48888888-8888-4888-8888-888888888888",
                sourceProductId: "200008",
              });
              conflicted.scenarios = conflicted.scenarios.map((item) => ({
                ...item,
                title: {
                  ...item.title,
                  conflictReason: "synthetic_conflict",
                },
              }));
              await repository.saveGraph(conflicted);
              const conflictLoaded = await repository.loadGraph(conflicted.product.id);
              expect(project(conflictLoaded?.product, conflictLoaded!.scenarios[0]!)).toMatchObject({
                publish: false,
                reason: "required_core",
              });

              const aiUnreviewed = graph({
                productId: "39999999-9999-4999-8999-999999999999",
                scenarioId: "49999999-9999-4999-8999-999999999999",
                sourceProductId: "200009",
              });
              aiUnreviewed.scenarios = aiUnreviewed.scenarios.map((item) => ({
                ...item,
                title: {
                  ...item.title,
                  reviewState: "unreviewed",
                  evidence: [{ pointer: "synthetic", method: "ai_candidate" }],
                },
              }));
              await repository.saveGraph(aiUnreviewed);
              const aiLoaded = await repository.loadGraph(aiUnreviewed.product.id);
              expect(project(aiLoaded?.product, aiLoaded!.scenarios[0]!)).toMatchObject({
                publish: false,
                reason: "required_core",
              });

              const unsafeRelationship = graph({
                productId: "3aaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
                scenarioId: "4aaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
                sourceProductId: "200010",
              });
              unsafeRelationship.scenarios = unsafeRelationship.scenarios.map((item) => ({
                ...item,
                relationships: [
                  {
                    system: {
                      ...known("未承認AIシステム"),
                      reviewState: "unreviewed",
                      evidence: [
                        { pointer: "synthetic", method: "ai_candidate" },
                      ],
                    },
                    aliases: known(["未承認別名"]),
                  },
                ],
              }));
              await repository.saveGraph(unsafeRelationship);
              const unsafeLoaded = await repository.loadGraph(
                unsafeRelationship.product.id,
              );
              const unsafeDecision = project(
                unsafeLoaded?.product,
                unsafeLoaded!.scenarios[0]!,
              );
              expect(unsafeDecision.publish).toBe(true);
              if (unsafeDecision.publish) {
                expect(unsafeDecision.value.systems).toEqual({ state: "omitted" });
                expect(unsafeDecision.value.systemAliases).toEqual([]);
              }
            });

          ''' + dump_anchor
          if text.count(dump_anchor) != 1:
              raise SystemExit('publication test anchor mismatch')
          path.write_text(text.replace(dump_anchor, publication_test), encoding='utf-8')
          PY

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate migration and add nested envelope validators
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          rm -rf drizzle
          npm run db:generate
          migration=$(find drizzle -maxdepth 1 -type f -name '*.sql' | sort | head -n 1)
          test -n "$migration"
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_base_envelope(value jsonb, extra_keys text[])
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN jsonb_typeof(value) <> 'object' THEN false
            WHEN jsonb_typeof(value->'evidence') <> 'array' THEN false
            ELSE (
              value->>'state' IN ('known', 'unknown', 'hold', 'not_applicable')
              AND value->>'confidence' IN ('high', 'medium', 'low', 'unresolved')
              AND value->>'reviewState' IN ('unreviewed', 'approved', 'rejected', 'needs_more_evidence')
              AND jsonb_typeof(value->'contentVersion') = 'string'
              AND length(value->>'contentVersion') > 0
              AND jsonb_typeof(value->'checkedAt') = 'string'
              AND length(value->>'checkedAt') > 0
              AND (value->>'state' <> 'known' OR jsonb_array_length(value->'evidence') > 0)
              AND (NOT (value ? 'conflictReason') OR (
                jsonb_typeof(value->'conflictReason') = 'string'
                AND length(value->>'conflictReason') > 0
              ))
              AND NOT EXISTS (
                SELECT 1
                FROM jsonb_object_keys(value) AS envelope_key
                WHERE NOT (
                  envelope_key = ANY(
                    ARRAY[
                      'state', 'value', 'holdReason', 'confidence', 'reviewState',
                      'evidence', 'contentVersion', 'checkedAt', 'conflictReason'
                    ] || extra_keys
                  )
                )
              )
              AND NOT EXISTS (
                SELECT 1
                FROM jsonb_array_elements(value->'evidence') AS evidence_item
                WHERE NOT ((
                  jsonb_typeof(evidence_item) = 'object'
                  AND (SELECT count(*) FROM jsonb_object_keys(evidence_item)) = 2
                  AND jsonb_typeof(evidence_item->'pointer') = 'string'
                  AND length(evidence_item->>'pointer') > 0
                  AND evidence_item->>'method' IN (
                    'explicit_source', 'deterministic_rule', 'ai_candidate'
                  )
                ) IS TRUE)
              )
            ) IS TRUE
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_string_envelope(value jsonb, extra_keys text[])
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN NOT stage9_valid_base_envelope(value, extra_keys) THEN false
            WHEN value->>'state' = 'known' THEN (
              jsonb_typeof(value->'value') = 'string'
              AND length(btrim(value->>'value')) > 0
              AND NOT (value ? 'holdReason')
            ) IS TRUE
            WHEN value->>'state' IN ('unknown', 'not_applicable') THEN (
              NOT (value ? 'value') AND NOT (value ? 'holdReason')
            )
            WHEN value->>'state' = 'hold' THEN (
              jsonb_typeof(value->'holdReason') = 'string'
              AND length(value->>'holdReason') > 0
              AND NOT (value ? 'value')
            ) IS TRUE
            ELSE false
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_boolean_envelope(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN NOT stage9_valid_base_envelope(value, ARRAY[]::text[]) THEN false
            WHEN value->>'state' = 'known' THEN (
              jsonb_typeof(value->'value') = 'boolean'
              AND NOT (value ? 'holdReason')
            ) IS TRUE
            WHEN value->>'state' IN ('unknown', 'not_applicable') THEN (
              NOT (value ? 'value') AND NOT (value ? 'holdReason')
            )
            WHEN value->>'state' = 'hold' THEN (
              jsonb_typeof(value->'holdReason') = 'string'
              AND length(value->>'holdReason') > 0
              AND NOT (value ? 'value')
            ) IS TRUE
            ELSE false
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_string_array_envelope(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN NOT stage9_valid_base_envelope(value, ARRAY[]::text[]) THEN false
            WHEN value->>'state' = 'known' THEN CASE
              WHEN jsonb_typeof(value->'value') <> 'array' THEN false
              ELSE (
                NOT (value ? 'holdReason')
                AND NOT EXISTS (
                  SELECT 1
                  FROM jsonb_array_elements(value->'value') AS array_item
                  WHERE NOT ((
                    jsonb_typeof(array_item) = 'string'
                    AND length(btrim(array_item #>> '{}')) > 0
                  ) IS TRUE)
                )
              )
            END
            WHEN value->>'state' IN ('unknown', 'not_applicable') THEN (
              NOT (value ? 'value') AND NOT (value ? 'holdReason')
            )
            WHEN value->>'state' = 'hold' THEN (
              jsonb_typeof(value->'holdReason') = 'string'
              AND length(value->>'holdReason') > 0
              AND NOT (value ? 'value')
            ) IS TRUE
            ELSE false
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_book_envelope(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN NOT stage9_valid_base_envelope(value, ARRAY[]::text[]) THEN false
            WHEN value->>'state' = 'known' THEN (
              jsonb_typeof(value->'value') = 'object'
              AND (SELECT count(*) FROM jsonb_object_keys(value->'value')) = 2
              AND jsonb_typeof(value->'value'->'title') = 'string'
              AND length(btrim(value->'value'->>'title')) > 0
              AND value->'value'->>'kind' IN ('required', 'optional')
              AND NOT (value ? 'holdReason')
            ) IS TRUE
            WHEN value->>'state' IN ('unknown', 'not_applicable') THEN (
              NOT (value ? 'value') AND NOT (value ? 'holdReason')
            )
            WHEN value->>'state' = 'hold' THEN (
              jsonb_typeof(value->'holdReason') = 'string'
              AND length(value->>'holdReason') > 0
              AND NOT (value ? 'value')
            ) IS TRUE
            ELSE false
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_player_range_envelope(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN NOT stage9_valid_base_envelope(value, ARRAY[]::text[]) THEN false
            WHEN value->>'state' = 'known' THEN CASE
              WHEN jsonb_typeof(value->'value') <> 'object' THEN false
              WHEN jsonb_typeof(value->'value'->'minimumPlayers') <> 'number' THEN false
              WHEN jsonb_typeof(value->'value'->'maximumPlayers') <> 'number' THEN false
              ELSE (
                (value->'value'->>'minimumPlayers')::integer >= 1
                AND (value->'value'->>'minimumPlayers')::integer
                  <= (value->'value'->>'maximumPlayers')::integer
                AND NOT (value ? 'holdReason')
              ) IS TRUE
            END
            WHEN value->>'state' IN ('unknown', 'not_applicable') THEN (
              NOT (value ? 'value') AND NOT (value ? 'holdReason')
            )
            WHEN value->>'state' = 'hold' THEN (
              jsonb_typeof(value->'holdReason') = 'string'
              AND length(value->>'holdReason') > 0
              AND NOT (value ? 'value')
            ) IS TRUE
            ELSE false
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_time_range_envelope(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN NOT stage9_valid_base_envelope(value, ARRAY[]::text[]) THEN false
            WHEN value->>'state' = 'known' THEN CASE
              WHEN jsonb_typeof(value->'value') <> 'object' THEN false
              WHEN jsonb_typeof(value->'value'->'minimumMinutes') <> 'number' THEN false
              WHEN jsonb_typeof(value->'value'->'maximumMinutes') <> 'number' THEN false
              ELSE (
                (value->'value'->>'minimumMinutes')::integer >= 0
                AND (value->'value'->>'minimumMinutes')::integer
                  <= (value->'value'->>'maximumMinutes')::integer
                AND NOT (value ? 'holdReason')
              ) IS TRUE
            END
            WHEN value->>'state' IN ('unknown', 'not_applicable') THEN (
              NOT (value ? 'value') AND NOT (value ? 'holdReason')
            )
            WHEN value->>'state' = 'hold' THEN (
              jsonb_typeof(value->'holdReason') = 'string'
              AND length(value->>'holdReason') > 0
              AND NOT (value ? 'value')
            ) IS TRUE
            ELSE false
          END;
          $$;

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION stage9_valid_tag_map(value jsonb)
          RETURNS boolean
          LANGUAGE sql
          IMMUTABLE
          AS $$
          SELECT CASE
            WHEN jsonb_typeof(value) <> 'object' THEN false
            ELSE (
              (SELECT count(*) FROM jsonb_object_keys(value)) = 5
              AND value ?& ARRAY['genre', 'tone', 'setting', 'structure', 'content']
              AND stage9_valid_string_array_envelope(value->'genre')
              AND stage9_valid_string_array_envelope(value->'tone')
              AND stage9_valid_string_array_envelope(value->'setting')
              AND stage9_valid_string_array_envelope(value->'structure')
