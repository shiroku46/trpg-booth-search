name: Stage 24 Complete

on:
  push:
    branches:
      - agent/stage24-reviewed-search-source

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage24-reviewed-search-source
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Add application reviewed-search source port
        run: |
          cat > src/reviewed-search-source.ts <<'EOF'
          import type { ReviewedSearchResult } from "./reviewed-search";
          import type { CanonicalSearchQuery } from "./search";

          export interface ReviewedSearchSource {
            search(query?: CanonicalSearchQuery): Promise<ReviewedSearchResult>;
          }
          EOF
      - name: Make fixture adapter a reviewed-search source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/fixture-reviewed-search.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import { EMPTY_QUERY, type CanonicalSearchQuery } from "./search";\n',
              'import type { ReviewedSearchSource } from "./reviewed-search-source";\nimport { EMPTY_QUERY, type CanonicalSearchQuery } from "./search";\n',
              1,
          )
          addition = '''\n\nexport class FixtureReviewedSearchSource implements ReviewedSearchSource {\n  constructor(private readonly repo: FixtureRepository) {}\n\n  async search(\n    query: CanonicalSearchQuery = EMPTY_QUERY,\n  ): Promise<ReviewedSearchResult> {\n    return searchReviewedFixtureRepository(this.repo, query);\n  }\n}\n'''
          if 'export class FixtureReviewedSearchSource' not in text:
              text = text.rstrip() + addition
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add persistence reviewed-search source
        run: |
          cat > src/persistence/reviewed-search-source.ts <<'EOF'
          import type { ReviewedSearchResult } from "../reviewed-search";
          import type { ReviewedSearchSource } from "../reviewed-search-source";
          import { EMPTY_QUERY, type CanonicalSearchQuery } from "../search";
          import type { PersistenceDatabase } from "./database";
          import type { ReviewedPublicationIndexRequest } from "./reviewed-publication-index-service";
          import { PostgresReviewedSearchService } from "./reviewed-search-service";

          function detach<T>(value: T): T {
            if (Array.isArray(value)) return value.map((item) => detach(item)) as T;
            if (value && typeof value === "object") {
              const copy: Record<string, unknown> = {};
              for (const [key, nested] of Object.entries(
                value as Record<string, unknown>,
              )) {
                copy[key] = detach(nested);
              }
              return copy as T;
            }
            return value;
          }

          function deepFreeze<T>(value: T): T {
            if (value && typeof value === "object" && !Object.isFrozen(value)) {
              Object.freeze(value);
              for (const nested of Object.values(value as Record<string, unknown>)) {
                deepFreeze(nested);
              }
            }
            return value;
          }

          export class PostgresReviewedSearchSource implements ReviewedSearchSource {
            private readonly service: PostgresReviewedSearchService;
            private readonly products: readonly ReviewedPublicationIndexRequest[];

            constructor(
              db: PersistenceDatabase,
              products: readonly ReviewedPublicationIndexRequest[],
            ) {
              this.service = new PostgresReviewedSearchService(db);
              this.products = deepFreeze(detach([...products]));
            }

            async search(
              query: CanonicalSearchQuery = EMPTY_QUERY,
            ): Promise<ReviewedSearchResult> {
              return this.service.search({ products: this.products, query });
            }
          }
          EOF
      - name: Route page through source port
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import { searchReviewedFixtureRepository } from "../src/fixture-reviewed-search";\n',
              'import { FixtureReviewedSearchSource } from "../src/fixture-reviewed-search";\nimport type { ReviewedSearchSource } from "../src/reviewed-search-source";\n',
              1,
          )
          marker = 'type Params = Promise<Record<string, string | string[] | undefined>>;\n'
          binding = 'const reviewedSearchSource: ReviewedSearchSource =\n  new FixtureReviewedSearchSource(fixtureRepository);\n\n'
          if binding not in text:
              text = text.replace(marker, binding + marker, 1)
          old = '  const rows = parsed.invalid\n    ? []\n    : searchReviewedFixtureRepository(fixtureRepository, parsed.query).rows;\n'
          new = '  const rows = parsed.invalid\n    ? []\n    : (await reviewedSearchSource.search(parsed.query)).rows;\n'
          if old not in text:
              raise SystemExit('expected Stage 23 page call not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Extend fixture source tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/fixture-reviewed-search.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  buildFixtureReviewedPublicationIndex,\n',
              '  buildFixtureReviewedPublicationIndex,\n  FixtureReviewedSearchSource,\n',
              1,
          )
          insert = '''\n\n  it.each(SORT_ORDERS)(\n    "implements the async reviewed-search source contract for %s sorting",\n    async (sort) => {\n      const request = query({ sort, seed: "stage24-source" });\n      const source = new FixtureReviewedSearchSource(fixtureRepository);\n      expect((await source.search(request)).rows).toEqual(\n        searchReviewedFixtureRepository(fixtureRepository, request).rows,\n      );\n    },\n  );\n'''
          closing = '\n});\n'
          if 'implements the async reviewed-search source contract' not in text:
              index = text.rfind(closing)
              if index < 0:
                  raise SystemExit('describe closing marker not found')
              text = text[:index] + insert + text[index:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add persistence source tests
        run: |
          cat > src/persistence/reviewed-search-source.test.ts <<'EOF'
          import { PGlite } from "@electric-sql/pglite";
          import { afterEach, describe, expect, it } from "vitest";
          import type {
            EvidencedValue,
            Product,
            Scenario,
            ScenarioTags,
          } from "../domain";
          import { EMPTY_QUERY } from "../search";
          import {
            applyCommittedMigrations,
            createPersistenceDatabase,
          } from "./database";
          import {
            PostgresProductScenarioRepository,
            type StoredGraphInput,
          } from "./repository";
          import { PostgresReviewedSearchSource } from "./reviewed-search-source";

          const clients: PGlite[] = [];
          const PRODUCT_A = "11111111-1111-4111-8111-111111111111";
          const PRODUCT_B = "22222222-2222-4222-8222-222222222222";
          const SCENARIO_A = "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa";
          const SCENARIO_B = "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb";
          const BASE_TIME = "2026-08-06T00:00:00Z";

          function known<T>(value: T): EvidencedValue<T> {
            return {
              state: "known",
              value,
              confidence: "high",
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              contentVersion: "content-v1",
              checkedAt: BASE_TIME,
            };
          }

          function tags(): ScenarioTags {
            const list = known<readonly string[]>(["synthetic"]);
            return {
              genre: list,
              tone: list,
              setting: list,
              structure: list,
              content: list,
            };
          }

          function graph(
            productId: string,
            scenarioId: string,
            title: string,
          ): StoredGraphInput {
            const product: Product = {
              id: productId,
              canonicalUrl: `https://booth.pm/ja/items/${productId.slice(0, 8)}`,
              title: `商品-${title}`,
              salesState: known("available"),
              sourcePublicationDate: known("2026-08-01T00:00:00Z"),
              firstSeenAt: BASE_TIME,
              lastCheckedAt: BASE_TIME,
              allAges: known("all_ages_confirmed"),
              classification: {
                ...known("scenario_single"),
                normalizerVersion: "normalizer-v1",
                registryVersion: "registry-v1",
              },
            };
            const scenario: Scenario = {
              id: scenarioId,
              productId,
              title: known(title),
              playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
              edition: known("テスト版"),
              playTimeMinutes: known({ minimumMinutes: 120, maximumMinutes: 180 }),
              modality: known("online"),
              tags: tags(),
              requiredBooks: [],
              compatibility: [],
              separationApproved: true,
              relationships: [],
            };
            return {
              product,
              sourceProductId: productId.slice(0, 8),
              contentVersion: "content-v1",
              currentRecordUpdatedAt: BASE_TIME,
              scenarios: [scenario],
              normalizationHistory: [],
            };
          }

          afterEach(async () => {
            await Promise.all(clients.splice(0).map((client) => client.close()));
          });

          describe("Stage 24 persistence reviewed-search source", () => {
            it("binds explicit products defensively and does not mutate storage", async () => {
              const client = new PGlite();
              clients.push(client);
              await applyCommittedMigrations(client);
              const { db } = createPersistenceDatabase(client);
              const repository = new PostgresProductScenarioRepository(db);
              await repository.saveGraph(graph(PRODUCT_A, SCENARIO_A, "Alpha"));
              await repository.saveGraph(graph(PRODUCT_B, SCENARIO_B, "Beta"));
              const beforeA = await repository.loadGraph(PRODUCT_A);
              const beforeB = await repository.loadGraph(PRODUCT_B);

              const requests = [{ productId: PRODUCT_A, targets: [] }];
              const source = new PostgresReviewedSearchSource(db, requests);
              requests[0]!.productId = PRODUCT_B;
              requests.push({ productId: PRODUCT_B, targets: [] });

              const result = await source.search({
                ...EMPTY_QUERY,
                keyword: "  Alpha  ",
                tags: { ...EMPTY_QUERY.tags },
              });

              expect(result.query.keyword).toBe("Alpha");
              expect(result.rows.map((row) => row.title)).toEqual(["Alpha"]);
              expect(result.publicationReport).toMatchObject([
                { state: "projected", productId: PRODUCT_A },
              ]);
              expect(Object.isFrozen(result)).toBe(true);
              expect(Object.isFrozen(result.rows)).toBe(true);
              expect(Object.isFrozen(result.publicationReport)).toBe(true);
              expect(await repository.loadGraph(PRODUCT_A)).toEqual(beforeA);
              expect(await repository.loadGraph(PRODUCT_B)).toEqual(beforeB);
            });

            it("is deterministic for equivalent explicit product ordering", async () => {
              const client = new PGlite();
              clients.push(client);
              await applyCommittedMigrations(client);
              const { db } = createPersistenceDatabase(client);
              const repository = new PostgresProductScenarioRepository(db);
              await repository.saveGraph(graph(PRODUCT_A, SCENARIO_A, "Alpha"));
              await repository.saveGraph(graph(PRODUCT_B, SCENARIO_B, "Beta"));

              const forward = new PostgresReviewedSearchSource(db, [
                { productId: PRODUCT_A, targets: [] },
                { productId: PRODUCT_B, targets: [] },
              ]);
              const reverse = new PostgresReviewedSearchSource(db, [
                { productId: PRODUCT_B, targets: [] },
                { productId: PRODUCT_A, targets: [] },
              ]);
              const query = {
                ...EMPTY_QUERY,
                sort: "random" as const,
                seed: "stage24-source",
                tags: { ...EMPTY_QUERY.tags },
              };

              expect(await reverse.search(query)).toEqual(await forward.search(query));
            });
          });
          EOF
      - name: Document Stage 24
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/ARCHITECTURE.md': '''\n\n## Stage 24 reviewed-search source port\n\nThe application-facing search boundary is now the async `ReviewedSearchSource` port. The fixture Preview implements this port through the Stage 23 adapter, while `PostgresReviewedSearchSource` binds an explicit immutable set of product/target requests to the existing persistence-backed Stage 20 service. The page remains fixture-backed; provider selection is not automatic and no hosted connection is introduced.\n''',
            'docs/DATA_MODEL.md': '''\n\n## Stage 24 bound reviewed-search source\n\nA reviewed-search source is a behavior contract rather than stored data: one canonical query produces one immutable `ReviewedSearchResult`. The PostgreSQL adapter owns a defensive frozen copy of its explicitly supplied publication requests so caller-side mutation cannot change later reads. It does not enumerate products or persist source configuration.\n''',
            'docs/DECISIONS.md': '''\n\n## D-043 — The public application depends on a reviewed-search source port\n\n**Decision:** Application search composition must depend on one async `ReviewedSearchSource` contract. Fixture and PostgreSQL adapters may implement it, but runtime provider selection must remain explicit and the fixture adapter remains the active Preview implementation until a separately authorized persistence configuration exists.\n\n**Rationale:** A narrow port isolates the page from provider-specific repositories and makes a future persistence switch a composition change rather than a search/UI rewrite, while preventing hidden environment selection or storage enumeration.\n\n**Consequences:** Stage 24 adds no provider auto-detection, environment toggle, hosted database, Secret, migration, external request, API route, UI change, or production-data claim.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 24 — Application reviewed-search source port\n\n- [x] Define one async application-facing reviewed-search source contract.\n- [x] Implement the contract for the synthetic fixture Preview.\n- [x] Implement a PostgreSQL adapter bound to explicit immutable product/target requests.\n- [x] Route the page through the source contract while retaining the fixture source as default.\n- [x] Prove defensive request detachment, deterministic product ordering, storage non-mutation, and immutable results.\n- [x] Keep provider selection, hosted persistence, and BOOTH access outside this stage.\n''',
          }
          for name, section in sections.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              heading = next(line for line in section.splitlines() if line.startswith('## '))
              if heading not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Format Stage 24 files
        run: npx prettier --write src/reviewed-search-source.ts src/fixture-reviewed-search.ts src/fixture-reviewed-search.test.ts src/persistence/reviewed-search-source.ts src/persistence/reviewed-search-source.test.ts app/page.tsx
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Stage 24 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/reviewed-search-source.ts src/fixture-reviewed-search.ts src/fixture-reviewed-search.test.ts src/persistence/reviewed-search-source.ts src/persistence/reviewed-search-source.test.ts app/page.tsx docs/ARCHITECTURE.md docs/DATA_MODEL.md docs/DECISIONS.md docs/ROADMAP.md
          git commit -m "feat(stage24): add reviewed search source port"
          git push origin HEAD:agent/stage24-reviewed-search-source
