name: Stage 19 Complete

on:
  push:
    branches:
      - agent/stage19-reviewed-publication-index

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage19-reviewed-publication-index
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Implement public-row search reuse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/search.ts')
          text = path.read_text(encoding='utf-8')
          marker = 'export function search(\n'
          start = text.index(marker)
          prefix = text[:start]
          replacement = '''export function searchPublicRows(\n  rows: readonly PublicScenario[],\n  query: CanonicalSearchQuery = EMPTY_QUERY,\n): PublicScenario[] {\n  const filtered = rows.filter((row) => {\n    if (!matchesKeyword(row, query.keyword)) return false;\n    if (!matchesSystem(row, query.system)) return false;\n    if (!matchesFacet(row.edition, query.edition, matchesString)) return false;\n    if (!matchesPlayerCount(row.playerCount, query.playerCount)) return false;\n    if (!matchesPlayTime(row.playTimeMinutes, query.playTime)) return false;\n    if (!matchesFacet(row.modality, query.modality, matchesString))\n      return false;\n    if (!matchesFacet(row.requiredBooks, query.book, matchesBooks))\n      return false;\n    if (!matchesFacet(row.compatibility, query.compatibility, matchesArray))\n      return false;\n    return TAG_CATEGORIES.every((category) =>\n      matchesFacet(row.tags[category], query.tags[category], matchesArray),\n    );\n  });\n\n  return sortRows(filtered, query.sort, query.seed);\n}\n\nexport function search(\n  repo: FixtureRepository,\n  query: CanonicalSearchQuery = EMPTY_QUERY,\n): PublicScenario[] {\n  const products = new Map(\n    repo.products().map((product) => [product.id, product]),\n  );\n  const projected = repo\n    .scenarios()\n    .map((scenario) => project(products.get(scenario.productId), scenario))\n    .filter(\n      (decision): decision is Extract<typeof decision, { publish: true }> =>\n        decision.publish,\n    )\n    .map((decision) => decision.value);\n\n  return searchPublicRows(projected, query);\n}\n'''
          path.write_text(prefix + replacement, encoding='utf-8')
          PY
      - name: Add Stage 19 unit tests
        run: |
          cat > src/reviewed-publication-index.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { fixtureRepository } from "../fixtures";
          import type {
            EvidencedValue,
            Product,
            PublicScenario,
            Scenario,
          } from "./domain";
          import { project } from "./publication";
          import type { ReviewApplicationTarget } from "./review-application";
          import type { ReviewedOverlayBatchResult } from "./reviewed-overlay-batch";
          import {
            composeReviewedPublicationIndex,
            type ReviewedPublicationIndexInput,
          } from "./reviewed-publication-index";
          import { EMPTY_QUERY, search, searchPublicRows } from "./search";

          const PRODUCT_A = "11111111-1111-4111-8111-111111111111";
          const PRODUCT_B = "22222222-2222-4222-8222-222222222222";
          const PRODUCT_C = "33333333-3333-4333-8333-333333333333";

          function known<T>(value: T): EvidencedValue<T> {
            return {
              state: "known",
              value,
              confidence: "high",
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              contentVersion: "content-v1",
              checkedAt: "2026-08-06T00:00:00Z",
            };
          }

          function product(id: string): Product {
            return {
              id,
              canonicalUrl: `https://booth.pm/ja/items/${id.slice(0, 8)}`,
              title: `商品-${id.slice(0, 4)}`,
              salesState: known("available" as const),
              sourcePublicationDate: known("2026-08-01T00:00:00Z"),
              firstSeenAt: "2026-08-06T00:00:00Z",
              lastCheckedAt: "2026-08-06T00:00:00Z",
              allAges: known("all_ages_confirmed" as const),
              classification: {
                ...known("scenario_single" as const),
                normalizerVersion: "normalizer-v1",
                registryVersion: "registry-v1",
              },
            };
          }

          function scenario(productId: string, id: string, title: string, hold = false): Scenario {
            const list = known<readonly string[]>(["synthetic"]);
            return {
              id,
              productId,
              title: known(title),
              playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
              edition: known("テスト版"),
              playTimeMinutes: known({ minimumMinutes: 120, maximumMinutes: 180 }),
              modality: known("online" as const),
              tags: {
                genre: list,
                tone: list,
                setting: list,
                structure: list,
                content: list,
              },
              requiredBooks: [],
              compatibility: [],
              separationApproved: true,
              relationships: [],
              ...(hold ? { hold: true } : {}),
            };
          }

          function target(productId: string, scenarioId: string): ReviewApplicationTarget {
            return {
              productId,
              entityType: "scenario",
              entityId: scenarioId,
              fieldPath: "edition",
              versionKey: {
                contentVersion: "content-v1",
                normalizerVersion: "normalizer-v1",
                registryVersion: "registry-v1",
              },
            };
          }

          function graph(
            sourceProduct: Product,
            scenarios: readonly Scenario[],
            withReport = false,
          ): ReviewedOverlayBatchResult {
            return {
              product: sourceProduct,
              scenarios,
              report: withReport
                ? [
                    {
                      state: "omitted",
                      reason: "unapplied",
                      target: target(sourceProduct.id, scenarios[0]!.id),
                    },
                  ]
                : [],
            };
          }

          describe("Stage 19 deterministic reviewed publication index", () => {
            it("returns detached immutable empty output", () => {
              const result = composeReviewedPublicationIndex([]);
              expect(result).toEqual({ rows: [], report: [] });
              expect(Object.isFrozen(result)).toBe(true);
              expect(Object.isFrozen(result.rows)).toBe(true);
              expect(Object.isFrozen(result.report)).toBe(true);
            });

            it("canonicalizes product and scenario order independent of caller order", () => {
              const a = graph(product(PRODUCT_A), [
                scenario(PRODUCT_A, "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", "B"),
                scenario(PRODUCT_A, "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa", "A"),
              ]);
              const b = graph(product(PRODUCT_B), [
                scenario(PRODUCT_B, "cccccccc-cccc-4ccc-8ccc-cccccccccccc", "C"),
              ]);
              const forward = composeReviewedPublicationIndex([
                { productId: PRODUCT_A, graph: a },
                { productId: PRODUCT_B, graph: b },
              ]);
              const reverse = composeReviewedPublicationIndex([
                { productId: PRODUCT_B, graph: b },
                { productId: PRODUCT_A, graph: a },
              ]);
              expect(reverse).toEqual(forward);
              expect(forward.rows.map((row) => row.title)).toEqual(["A", "B", "C"]);
              expect(forward.report.map((item) => item.productId)).toEqual([
                PRODUCT_A,
                PRODUCT_B,
              ]);
            });

            it("rejects duplicate products and reports missing, malformed, mismatch, and unpublished scenarios", () => {
              const sourceProduct = product(PRODUCT_A);
              const sourceScenario = scenario(
                PRODUCT_A,
                "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
                "公開候補",
              );
              expect(() =>
                composeReviewedPublicationIndex([
                  { productId: PRODUCT_A, graph: graph(sourceProduct, [sourceScenario]) },
                  { productId: PRODUCT_A },
                ]),
              ).toThrow("duplicate product request");

              const mixed = composeReviewedPublicationIndex([
                { productId: "" },
                { productId: PRODUCT_B },
                {
                  productId: PRODUCT_C,
                  graph: graph(product(PRODUCT_B), [
                    scenario(
                      PRODUCT_B,
                      "dddddddd-dddd-4ddd-8ddd-dddddddddddd",
                      "不一致",
                    ),
                  ]),
                },
                {
                  productId: PRODUCT_A,
                  graph: graph(sourceProduct, [
                    sourceScenario,
                    scenario(
                      PRODUCT_A,
                      "eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee",
                      "保留",
                      true,
                    ),
                  ], true),
                },
              ]);

              expect(mixed.rows.map((row) => row.title)).toEqual(["公開候補"]);
              expect(mixed.report).toMatchObject([
                { state: "malformed_product_id", productId: "" },
                {
                  state: "projected",
                  productId: PRODUCT_A,
                  targetReport: [{ state: "omitted", reason: "unapplied" }],
                  scenarios: [
                    { state: "published" },
                    { state: "omitted", reason: "hold_or_missing_product" },
                  ],
                },
                { state: "missing_product", productId: PRODUCT_B },
                {
                  state: "product_mismatch",
                  productId: PRODUCT_C,
                  actualProductId: PRODUCT_B,
                },
              ]);
              expect(Object.isFrozen(mixed.report[1])).toBe(true);
              expect(Object.isFrozen(mixed.report[1]!.targetReport)).toBe(true);
            });

            it("does not mutate source graphs", () => {
              const sourceProduct = product(PRODUCT_A);
              const sourceScenarios = [
                scenario(PRODUCT_A, "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa", "A"),
              ];
              const sourceGraph = graph(sourceProduct, sourceScenarios, true);
              const before = JSON.stringify(sourceGraph);
              const result = composeReviewedPublicationIndex([
                { productId: PRODUCT_A, graph: sourceGraph },
              ]);
              expect(JSON.stringify(sourceGraph)).toBe(before);
              expect(result.rows[0]).not.toBe(sourceScenarios[0]);
              expect(Object.isFrozen(result.rows[0])).toBe(true);
            });

            it("searches projected public rows with the existing search semantics", () => {
              const products = new Map(
                fixtureRepository.products().map((item) => [item.id, item]),
              );
              const publicRows: PublicScenario[] = fixtureRepository
                .scenarios()
                .map((item) => project(products.get(item.productId), item))
                .filter(
                  (decision): decision is Extract<typeof decision, { publish: true }> =>
                    decision.publish,
                )
                .map((decision) => decision.value);
              const queries = [
                EMPTY_QUERY,
                { ...EMPTY_QUERY, sort: "free-first" as const },
                { ...EMPTY_QUERY, keyword: "合成" },
                { ...EMPTY_QUERY, edition: "6版" },
              ];
              for (const query of queries) {
                expect(searchPublicRows(publicRows, query)).toEqual(
                  search(fixtureRepository, query),
                );
              }
            });
          });
          EOF
      - name: Add Stage 19 persistence integration
        run: |
          cat > src/persistence/reviewed-publication-index-persistence.test.ts <<'EOF'
          import { PGlite } from "@electric-sql/pglite";
          import { afterEach, describe, expect, it } from "vitest";
          import type { EvidencedValue, Product, Scenario, ScenarioTags } from "../domain";
          import type { ReviewApplicationTarget } from "../review-application";
          import { applyCommittedMigrations, createPersistenceDatabase } from "./database";
          import { PostgresProductScenarioRepository, type StoredGraphInput } from "./repository";
          import { PostgresReviewedPublicationIndexService } from "./reviewed-publication-index-service";

          const clients: PGlite[] = [];
          const PRODUCT_ID = "11111111-1111-4111-8111-111111111111";
          const SCENARIO_ID = "22222222-2222-4222-8222-222222222222";
          const BASE_TIME = "2026-08-06T00:00:00Z";

          function known<T>(value: T): EvidencedValue<T> {
            return {
              state: "known",
              value,
              confidence: "high",
              reviewState: "approved",
              evidence: [{ pointer: "synthetic", method: "explicit_source" }],
              contentVersion: "content-v1",
              checkedAt: BASE_TIME,
            };
          }

          function tags(): ScenarioTags {
            const list = known<readonly string[]>(["synthetic"]);
            return {
              genre: list,
              tone: list,
              setting: list,
              structure: list,
              content: list,
            };
          }

          function storedGraph(): StoredGraphInput {
            const product: Product = {
              id: PRODUCT_ID,
              canonicalUrl: "https://booth.pm/ja/items/1234567",
              title: "永続化商品",
              salesState: known("available"),
              sourcePublicationDate: known("2026-08-01T00:00:00Z"),
              firstSeenAt: BASE_TIME,
              lastCheckedAt: BASE_TIME,
              allAges: known("all_ages_confirmed"),
              classification: {
                ...known("scenario_single"),
                normalizerVersion: "normalizer-v1",
                registryVersion: "registry-v1",
              },
            };
            const scenario: Scenario = {
              id: SCENARIO_ID,
              productId: PRODUCT_ID,
              title: known("永続化シナリオ"),
              playerCount: known({ minimumPlayers: 2, maximumPlayers: 4 }),
              edition: known("テスト版"),
              playTimeMinutes: known({ minimumMinutes: 120, maximumMinutes: 180 }),
              modality: known("online"),
              tags: tags(),
              requiredBooks: [],
              compatibility: [],
              separationApproved: true,
              relationships: [],
            };
            return {
              product,
              sourceProductId: "1234567",
              contentVersion: "content-v1",
              currentRecordUpdatedAt: BASE_TIME,
              scenarios: [scenario],
              normalizationHistory: [],
            };
          }

          const target = (): ReviewApplicationTarget => ({
            productId: PRODUCT_ID,
            entityType: "scenario",
            entityId: SCENARIO_ID,
            fieldPath: "edition",
            versionKey: {
              contentVersion: "content-v1",
              normalizerVersion: "normalizer-v1",
              registryVersion: "registry-v1",
            },
          });

          afterEach(async () => {
            await Promise.all(clients.splice(0).map((client) => client.close()));
          });

          describe("Stage 19 persistence-backed publication index", () => {
            it("resolves explicit products and exact targets without mutating storage", async () => {
              const client = new PGlite();
              clients.push(client);
              await applyCommittedMigrations(client);
              const { db } = createPersistenceDatabase(client);
              const repository = new PostgresProductScenarioRepository(db);
              await repository.saveGraph(storedGraph());
              const service = new PostgresReviewedPublicationIndexService(db);
              const before = await repository.loadGraph(PRODUCT_ID);

              const result = await service.loadPublicationIndex([
                { productId: PRODUCT_ID, targets: [target()] },
                {
                  productId: "33333333-3333-4333-8333-333333333333",
                  targets: [],
                },
              ]);

              expect(result.rows).toHaveLength(1);
              expect(result.rows[0]?.title).toBe("永続化シナリオ");
              expect(result.report).toMatchObject([
                {
                  state: "projected",
                  productId: PRODUCT_ID,
                  targetReport: [{ state: "omitted", reason: "unapplied" }],
                  scenarios: [{ state: "published", scenarioId: SCENARIO_ID }],
                },
                {
                  state: "missing_product",
                  productId: "33333333-3333-4333-8333-333333333333",
                },
              ]);
              expect(await repository.loadGraph(PRODUCT_ID)).toEqual(before);
              expect(Object.isFrozen(result)).toBe(true);
            });

            it("rejects duplicate product requests and cross-product targets", async () => {
              const client = new PGlite();
              clients.push(client);
              await applyCommittedMigrations(client);
              const { db } = createPersistenceDatabase(client);
              const service = new PostgresReviewedPublicationIndexService(db);

              await expect(
                service.loadPublicationIndex([
                  { productId: PRODUCT_ID, targets: [] },
                  { productId: PRODUCT_ID, targets: [] },
                ]),
              ).rejects.toThrow("duplicate product request");

              await expect(
                service.loadPublicationIndex([
                  {
                    productId: PRODUCT_ID,
                    targets: [
                      {
                        ...target(),
                        productId: "33333333-3333-4333-8333-333333333333",
                      },
                    ],
                  },
                ]),
              ).rejects.toThrow("does not belong to requested product");
            });
          });
          EOF
      - name: Complete Stage 19 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/ARCHITECTURE.md': '''\n\n## Stage 19 reviewed publication index\n\nStage 19 adds a deterministic provider-neutral read layer above Stage 18. Explicit product requests are resolved into reviewed overlay batches, then every detached scenario is passed through the unchanged fail-closed publication projection. Product IDs and scenario IDs are canonically ordered, and no storage enumeration or latest-version heuristic is introduced.\n\n`PostgresReviewedPublicationIndexService` accepts only explicit `{ productId, targets }` requests. Missing products and exact targets remain visible in immutable reports. Search can consume the resulting `PublicScenario` rows through `searchPublicRows`, which reuses the existing filter/sort implementation without re-projecting raw source graphs.\n''',
            'docs/DATA_MODEL.md': '''\n\n## Stage 19 reviewed publication index read model\n\nA reviewed publication index contains immutable public scenario rows plus an immutable product report. Each projected product preserves its Stage 18 target report and records every scenario as `published` or `omitted` with the unchanged publication reason. Missing product requests, malformed product IDs, and product/graph mismatches remain explicit.\n\nThe index is derived only from explicitly supplied product IDs and exact review targets. It is not a stored publication table and does not select historical review state implicitly.\n''',
            'docs/DECISIONS.md': '''\n\n## D-040 — Public search indexes only explicit reviewed product batches\n\n**Decision:** The reviewed public index must accept explicit product requests, resolve each through Stage 18, apply the existing publication projection unchanged, and expose search over already-projected public rows.\n\n**Rationale:** This keeps search downstream of the immutable exact-target review chain while preventing storage-wide discovery, latest-version guessing, silent product loss, and raw-source re-projection inside public-row search.\n\n**Consequences:** Stage 19 adds no publication table, migration, automatic product enumeration, provider, network request, UI change, or hosted resource. Missing products and unpublished scenarios are reportable read outcomes rather than mutations.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 19 — Deterministic reviewed publication index\n\n- [x] Compose explicit Stage 18 product graphs into one canonical public scenario index.\n- [x] Preserve per-product Stage 18 target reports and per-scenario publication outcomes.\n- [x] Keep missing, malformed, and mismatched product requests explicit.\n- [x] Resolve only explicit `{ productId, targets }` persistence requests.\n- [x] Reuse existing filters and sort orders over already-projected public rows.\n- [x] Prove caller-order independence, storage immutability, and fail-closed publication behavior.\n''',
          }
          for name, section in sections.items():
            path = Path(name)
            text = path.read_text(encoding='utf-8')
            heading = next(line for line in section.splitlines() if line.startswith('## '))
            if heading not in text:
              path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Format Stage 19 files
        run: npx prettier --write src/search.ts src/reviewed-publication-index.ts src/reviewed-publication-index.test.ts src/persistence/reviewed-publication-index-service.ts src/persistence/reviewed-publication-index-persistence.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Stage 19 completion
        run: |
          rm .github/workflows/stage19-complete.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE.md docs/DATA_MODEL.md docs/DECISIONS.md docs/ROADMAP.md src/search.ts src/reviewed-publication-index.ts src/reviewed-publication-index.test.ts src/persistence/reviewed-publication-index-service.ts src/persistence/reviewed-publication-index-persistence.test.ts .github/workflows/stage19-complete.yml
          git commit -m "feat(stage19): complete reviewed publication index"
          git push origin HEAD:agent/stage19-reviewed-publication-index
