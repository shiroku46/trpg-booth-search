name: Stage 13 registry snapshot validation

on:
  push:
    branches:
      - agent/stage13-registry-snapshot
    paths:
      - .github/workflows/stage13-registry-snapshot-validation.yml

permissions:
  contents: write

concurrency:
  group: stage13-registry-snapshot-validation
  cancel-in-progress: false

jobs:
  implement-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage13-registry-snapshot
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Add snapshot schema and accepted documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacement(s), found {count}")
              file.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace(
              "src/persistence/schema.ts",
              '''  boolean,
            check,
            index,''',
              '''  boolean,
            check,
            date,
            index,''',
          )
          replace(
              "src/persistence/schema.ts",
              '''} from "../domain";

          export type StoredAllAges''',
              '''} from "../domain";
          import type { RegistryManifest } from "../registry";

          export type StoredAllAges''',
          )
          table = r'''
          export const registrySnapshot = pgTable(
            "registry_snapshot",
            {
              registryVersion: text("registry_version").primaryKey(),
              schemaVersion: integer("schema_version").notNull(),
              normalizerVersion: text("normalizer_version").notNull(),
              reviewedAt: date("reviewed_at", { mode: "string" }).notNull(),
              manifestSha256: text("manifest_sha256").notNull(),
              manifest: jsonb("manifest").$type<RegistryManifest>().notNull(),
              installedAt: timestamp("installed_at", {
                withTimezone: true,
                mode: "string",
              }).notNull(),
            },
            (table) => [
              index("registry_snapshot_reviewed_idx").on(
                table.reviewedAt,
                table.registryVersion,
              ),
              check(
                "registry_snapshot_version_ck",
                sql`${table.registryVersion} ~ '^registry-[0-9]{4}-[0-9]{2}-[0-9]{2}[.][0-9]+$'`,
              ),
              check(
                "registry_snapshot_schema_version_ck",
                sql`${table.schemaVersion} > 0`,
              ),
              check(
                "registry_snapshot_normalizer_version_ck",
                sql`length(btrim(${table.normalizerVersion})) > 0`,
              ),
              check(
                "registry_snapshot_manifest_sha256_ck",
                sql`${table.manifestSha256} ~ '^[0-9a-f]{64}$'`,
              ),
              check(
                "registry_snapshot_manifest_shape_ck",
                sql`(
                  jsonb_typeof(${table.manifest}) = 'object'
                  AND jsonb_typeof(${table.manifest}->'schemaVersion') = 'number'
                  AND jsonb_typeof(${table.manifest}->'registryVersion') = 'string'
                  AND jsonb_typeof(${table.manifest}->'normalizerVersion') = 'string'
                  AND jsonb_typeof(${table.manifest}->'reviewedAt') = 'string'
                  AND jsonb_typeof(${table.manifest}->'officialDomains') = 'array'
                  AND jsonb_typeof(${table.manifest}->'systemFamilies') = 'array'
                  AND jsonb_typeof(${table.manifest}->'editions') = 'array'
                  AND jsonb_typeof(${table.manifest}->'books') = 'array'
                  AND jsonb_typeof(${table.manifest}->'aliases') = 'array'
                ) IS TRUE`,
              ),
              check(
                "registry_snapshot_manifest_identity_ck",
                sql`(
                  (${table.manifest}->>'schemaVersion')::integer = ${table.schemaVersion}
                  AND ${table.manifest}->>'registryVersion' = ${table.registryVersion}
                  AND ${table.manifest}->>'normalizerVersion' = ${table.normalizerVersion}
                  AND ${table.manifest}->>'reviewedAt' = ${table.reviewedAt}::text
                ) IS TRUE`,
              ),
            ],
          );

          '''
          replace(
              "src/persistence/schema.ts",
              'export const boothProduct = pgTable(',
              table + 'export const boothProduct = pgTable(',
          )
          replace(
              "src/persistence/schema.ts",
              '''export const persistenceSchema = {
            boothProduct,''',
              '''export const persistenceSchema = {
            registrySnapshot,
            boothProduct,''',
          )

          replace(
              "docs/PHYSICAL_SCHEMA.md",
              '''## 3. Canonical-system and normalization tables

          ### 3.1 `system_family`''',
              '''## 3. Canonical-system and normalization tables

          ### 3.0 `registry_snapshot` — executable local compiled snapshot

          Stage 13 adds one repository-local PostgreSQL/PGlite table before any relational canonical catalogue is created. It stores a reviewed registry manifest as an immutable compiled artifact with these columns:

          | Column | Type | Required | Meaning |
          |---|---|---:|---|
          | `registry_version` | TEXT | yes | primary key; exact reviewed manifest version |
          | `schema_version` | INTEGER | yes | positive manifest schema version |
          | `normalizer_version` | TEXT | yes | non-empty comparison-key processor version |
          | `reviewed_at` | DATE | yes | reviewed manifest date |
          | `manifest_sha256` | TEXT | yes | lowercase SHA-256 over recursively key-sorted canonical JSON |
          | `manifest` | JSONB | yes | complete reviewed provider-neutral registry manifest |
          | `installed_at` | TIMESTAMPTZ | yes | local installation time |

          Column metadata must equal the embedded manifest metadata. The manifest must contain the required registry object/array shapes. UPDATE and DELETE are blocked by a dedicated append-only trigger. The application validates the manifest before insertion and verifies both the hash and metadata again on every load.

          This compiled snapshot preserves the accepted machine-safe text IDs from `registry-2026-08-06.1`. It is not the future relational canonical catalogue and does not populate `system_family`, `edition`, `book`, or product-owned `observed_alias`. The older UUID-wide physical convention and the accepted text canonical-ID contract therefore remain unresolved for those future tables rather than being silently collapsed. Their mapping, relational expansion, source-snapshot ownership, hosted seeding, and public UI integration require a later reviewed Issue.

          ### 3.1 `system_family`''',
          )

          decisions = Path("docs/DECISIONS.md")
          text = decisions.read_text(encoding="utf-8")
          text = text.replace(
              "Decisions D-001 through D-034 are accepted",
              "Decisions D-001 through D-035 are accepted",
              1,
          )
          marker = "\n---\n\n## Pending Decisions\n"
          if text.count(marker) != 1:
              raise SystemExit("docs/DECISIONS.md: pending marker mismatch")
          d035 = '''
          ### D-035 — Immutable local compiled-registry snapshot

          **Decision date:** 2026-08-06.

          Before building relational canonical tables or provisioning hosted persistence, the reviewed registry is stored locally as an immutable `registry_snapshot` JSONB artifact keyed by its accepted registry version. The repository validates the manifest before insertion, computes SHA-256 over recursively key-sorted canonical JSON, verifies the fingerprint and duplicated metadata on every load, treats an identical reinstall as an idempotent no-op, and rejects same-version content conflicts. A database trigger prohibits UPDATE and DELETE.

          The snapshot preserves the machine-safe text canonical IDs accepted by D-034. It does not decide how those IDs map to the older UUID-oriented physical-table convention and does not populate `system_family`, `edition`, `book`, or product-owned `observed_alias`. Relational catalogue design, source-evidence ownership, hosted seeding, and public integration remain separate later work.

          Stage 13 uses only committed migrations and local PGlite tests. It creates no hosted resource, provider setting, Secret, deployment, BOOTH access, user state, commercial field, or public fixture change. This decision is implemented by Issue #107.
          '''
          text = text.replace(marker, "\n" + d035.strip() + marker, 1)
          decisions.write_text(text, encoding="utf-8")

          roadmap = Path("docs/ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          stage12_tail = "Collection and integration remain later separately authorized stages."
          if text.count(stage12_tail) != 1:
              raise SystemExit("docs/ROADMAP.md: Stage 12 tail mismatch")
          stage13 = '''

          ## Stage 13 repository delivery — 2026-08-06

          Issue #107 adds immutable local persistence for the reviewed registry as a versioned, SHA-256-verified JSONB snapshot. Fresh migrations, idempotent installation, conflict rejection, append-only database enforcement, fail-closed loading, and dump/restore are proven with PGlite.

          Stage 13 intentionally does not create relational canonical tables or select a UUID/text-ID mapping. It does not seed a hosted database or change the synthetic fixture Preview. Those boundaries remain separately reviewed later work.
          '''
          text = text.replace(stage12_tail, stage12_tail + stage13, 1)
          roadmap.write_text(text, encoding="utf-8")
          PY
      - name: Format TypeScript sources
        run: npm run format
      - name: Generate the Stage 13 Drizzle migration
        run: |
          set -euo pipefail
          npx drizzle-kit generate --name=stage13_registry_snapshot
          migration="$(find drizzle -maxdepth 1 -type f -name '0001_*stage13_registry_snapshot.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION public.stage13_guard_registry_snapshot_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            RAISE EXCEPTION 'registry_snapshot is append-only';
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER registry_snapshot_append_only
          BEFORE UPDATE OR DELETE ON registry_snapshot
          FOR EACH ROW EXECUTE FUNCTION public.stage13_guard_registry_snapshot_append_only();
          SQL
          test "$(find drizzle -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 2
          grep -q 'CREATE TABLE "registry_snapshot"' "$migration"
          grep -q 'registry_snapshot_append_only' "$migration"
      - name: Verify exact Stage 13 allowlist
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import subprocess

          allowed = {
              "docs/DECISIONS.md",
              "docs/ROADMAP.md",
              "docs/PHYSICAL_SCHEMA.md",
              "src/persistence/schema.ts",
              "src/persistence/registry-repository.ts",
              "src/persistence/registry-persistence.test.ts",
              "drizzle/0001_stage13_registry_snapshot.sql",
              "drizzle/meta/0001_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          transport = {".github/workflows/stage13-registry-snapshot-validation.yml"}
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          working = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed - transport)
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"required Stage 13 paths did not change: {missing}")
          status = subprocess.check_output(
              ["git", "diff", "--name-status", "origin/main...HEAD"], text=True
          ) + subprocess.check_output(["git", "diff", "--name-status"], text=True)
          if any(line.startswith(("R", "C")) for line in status.splitlines()):
              raise SystemExit("renames or copies are outside the Stage 13 allowlist")
          PY
      - name: Run migration, format, lint, type, and unit gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Run repository guards without dependency-tree false positives
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          restore_dependencies() {
            if [ -d "$RUNNER_TEMP/node_modules" ] && [ ! -d node_modules ]; then
              mv "$RUNNER_TEMP/node_modules" node_modules
            fi
          }
          trap restore_dependencies EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          restore_dependencies
          trap - EXIT
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests
      - name: Build production application
        run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify unchanged Design B browser suite
        run: npm run test:e2e
      - name: Remove validation transport and publish verified Stage 13 commit
        run: |
          set -euo pipefail
          rm .github/workflows/stage13-registry-snapshot-validation.yml
          git checkout -- tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/ROADMAP.md docs/PHYSICAL_SCHEMA.md src/persistence/schema.ts src/persistence/registry-repository.ts src/persistence/registry-persistence.test.ts drizzle/0001_stage13_registry_snapshot.sql drizzle/meta/0001_snapshot.json drizzle/meta/_journal.json
          git add -u .github/workflows/stage13-registry-snapshot-validation.yml
          git commit -m 'feat(persistence): add immutable registry snapshot for issue 107'
          git push origin HEAD:agent/stage13-registry-snapshot
