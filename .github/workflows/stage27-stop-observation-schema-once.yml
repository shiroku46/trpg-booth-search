name: Stage 27 Stop Observation Schema Once

on:
  push:
    branches:
      - agent/stage27-stop-observation-schema

permissions: {}

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage27-stop-observation-schema
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Implement strict stop-observation schema
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/booth_collection_pilot.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PARSER_VERSION = "stage26-pilot-v6"', 'PARSER_VERSION = "stage27-pilot-v7"', 1)

          marker = '''AGE_CONTENT_MARKERS = (\n    ("age_confirmation", "年齢確認".encode()),\n    ("r18_hyphen", b"r-18"),\n    ("r18_compact", b"r18"),\n)\n'''
          addition = marker + '''STOP_MARKER_IDS = tuple(\n    marker_id\n    for marker_id, _ in ACCESS_CHALLENGE_MARKERS + AGE_CONTENT_MARKERS\n)\nSTOP_OBSERVATION_KEYS = frozenset(\n    {\n        "url",\n        "final_url",\n        "status",\n        "content_type",\n        "elapsed_ms",\n        "request_attempts",\n        "redirect_count",\n        "byte_length",\n        "raw_sha256",\n        "normalized_version",\n        "normalized_sha256",\n        "marker_ids",\n    }\n)\nSHA256_HEX_RE = re.compile(r"^[0-9a-f]{64}$")\n'''
          if marker not in text:
              raise SystemExit('marker constants changed unexpectedly')
          text = text.replace(marker, addition, 1)

          marker = '''def safe_response_observation(\n    result: FetchResult,\n    *,\n    marker_ids: Iterable[str],\n) -> dict[str, object]:\n'''
          validator = '''def validate_stop_observation(\n    value: Mapping[str, object],\n) -> dict[str, object]:\n    """Fail closed unless a stopped-response fingerprint matches the exact schema."""\n\n    if set(value) != STOP_OBSERVATION_KEYS:\n        raise PilotStop("invalid_stop_observation")\n\n    url = value["url"]\n    final_url = value["final_url"]\n    if not isinstance(url, str) or not isinstance(final_url, str):\n        raise PilotStop("invalid_stop_observation")\n    try:\n        require_url(\n            url,\n            allowed_hosts={"booth.pm"},\n            allowed_exact=PILOT_ENDPOINTS,\n        )\n        require_url(\n            final_url,\n            allowed_hosts={"booth.pm"},\n            allowed_exact=PILOT_ENDPOINTS,\n        )\n    except PilotStop as exc:\n        raise PilotStop("invalid_stop_observation") from exc\n    if final_url != url:\n        raise PilotStop("invalid_stop_observation")\n\n    if type(value["status"]) is not int or value["status"] != 200:\n        raise PilotStop("invalid_stop_observation")\n    if value["content_type"] != "text/html":\n        raise PilotStop("invalid_stop_observation")\n\n    for key in ("elapsed_ms", "byte_length"):\n        item = value[key]\n        if type(item) is not int or item < 0:\n            raise PilotStop("invalid_stop_observation")\n    if value["byte_length"] > MAX_PAGE_BYTES:\n        raise PilotStop("invalid_stop_observation")\n    if type(value["request_attempts"]) is not int or value["request_attempts"] != 1:\n        raise PilotStop("invalid_stop_observation")\n    if type(value["redirect_count"]) is not int or value["redirect_count"] != 0:\n        raise PilotStop("invalid_stop_observation")\n\n    raw_sha256 = value["raw_sha256"]\n    if not isinstance(raw_sha256, str) or not SHA256_HEX_RE.fullmatch(raw_sha256):\n        raise PilotStop("invalid_stop_observation")\n\n    normalized_version = value["normalized_version"]\n    normalized_sha256 = value["normalized_sha256"]\n    if normalized_version is None or normalized_sha256 is None:\n        if normalized_version is not None or normalized_sha256 is not None:\n            raise PilotStop("invalid_stop_observation")\n    elif (\n        normalized_version != TEXT_NORMALIZATION_VERSION\n        or not isinstance(normalized_sha256, str)\n        or not SHA256_HEX_RE.fullmatch(normalized_sha256)\n    ):\n        raise PilotStop("invalid_stop_observation")\n\n    marker_ids = value["marker_ids"]\n    if not isinstance(marker_ids, list) or not marker_ids:\n        raise PilotStop("invalid_stop_observation")\n    if any(not isinstance(marker_id, str) for marker_id in marker_ids):\n        raise PilotStop("invalid_stop_observation")\n    if len(marker_ids) != len(set(marker_ids)):\n        raise PilotStop("invalid_stop_observation")\n    marker_set = set(marker_ids)\n    if not marker_set.issubset(STOP_MARKER_IDS):\n        raise PilotStop("invalid_stop_observation")\n    canonical_marker_ids = [\n        marker_id for marker_id in STOP_MARKER_IDS if marker_id in marker_set\n    ]\n    if marker_ids != canonical_marker_ids:\n        raise PilotStop("invalid_stop_observation")\n\n    return {\n        "url": url,\n        "final_url": final_url,\n        "status": value["status"],\n        "content_type": value["content_type"],\n        "elapsed_ms": value["elapsed_ms"],\n        "request_attempts": value["request_attempts"],\n        "redirect_count": value["redirect_count"],\n        "byte_length": value["byte_length"],\n        "raw_sha256": raw_sha256,\n        "normalized_version": normalized_version,\n        "normalized_sha256": normalized_sha256,\n        "marker_ids": list(marker_ids),\n    }\n\n\n'''
          if marker not in text:
              raise SystemExit('safe_response_observation changed unexpectedly')
          text = text.replace(marker, validator + marker, 1)

          old = '''    return {\n        "url": result.requested_url,\n        "final_url": result.final_url,\n        "status": result.status,\n        "content_type": result.content_type.split(";", 1)[0].strip().lower(),\n        "elapsed_ms": result.elapsed_ms,\n        "request_attempts": result.request_attempts,\n        "redirect_count": result.redirect_count,\n        "byte_length": len(result.body),\n        "raw_sha256": hashlib.sha256(result.body).hexdigest(),\n        "normalized_version": normalized_version,\n        "normalized_sha256": normalized_sha256,\n        "marker_ids": list(marker_ids),\n    }\n'''
          new = '''    return validate_stop_observation(\n        {\n            "url": result.requested_url,\n            "final_url": result.final_url,\n            "status": result.status,\n            "content_type": result.content_type.split(";", 1)[0].strip().lower(),\n            "elapsed_ms": result.elapsed_ms,\n            "request_attempts": result.request_attempts,\n            "redirect_count": result.redirect_count,\n            "byte_length": len(result.body),\n            "raw_sha256": hashlib.sha256(result.body).hexdigest(),\n            "normalized_version": normalized_version,\n            "normalized_sha256": normalized_sha256,\n            "marker_ids": list(marker_ids),\n        }\n    )\n'''
          if old not in text:
              raise SystemExit('safe observation return changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '''        candidate = exc.details.get("stop_observation")\n        if isinstance(candidate, dict):\n            stop_observation = dict(candidate)\n'''
          new = '''        candidate = exc.details.get("stop_observation")\n        if candidate is not None:\n            if not isinstance(candidate, Mapping):\n                stop_reason = "invalid_stop_observation"\n            else:\n                try:\n                    stop_observation = validate_stop_observation(candidate)\n                except PilotStop:\n                    stop_reason = "invalid_stop_observation"\n                    stop_observation = None\n'''
          if old not in text:
              raise SystemExit('run_network observation catch changed unexpectedly')
          text = text.replace(old, new, 1)

          marker = '''def write_evidence(path: Path, evidence: dict[str, object]) -> None:\n'''
          replacement = marker + '''    stop_observation = evidence.get("stop_observation")\n    if stop_observation is not None:\n        if not isinstance(stop_observation, Mapping):\n            raise PilotStop("invalid_stop_observation")\n        validate_stop_observation(stop_observation)\n'''
          if marker not in text:
              raise SystemExit('write_evidence changed unexpectedly')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add strict-schema offline regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_booth_collection_pilot.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    validate_request_limit,\n', '    validate_request_limit,\n    validate_stop_observation,\n', 1)
          marker = '''    def test_network_stops_before_listing_without_policy_approval(self):\n'''
          tests = '''    def test_stop_observation_schema_round_trips_detached(self):\n        body = b"<html>captcha</html>"\n        with self.assertRaises(PilotStop) as raised:\n            classify_response(\n                result(PILOT_ENDPOINTS[0], body),\n                expected_types=("text/html",),\n                limit=1_000_000,\n                inspect_listing_markers=True,\n            )\n        source = raised.exception.details["stop_observation"]\n        validated = validate_stop_observation(source)\n        self.assertEqual(validated, source)\n        self.assertIsNot(validated, source)\n        self.assertIsNot(validated["marker_ids"], source["marker_ids"])\n\n    def test_stop_observation_schema_rejects_unknown_keys_and_bad_markers(self):\n        body = b"<html>captcha cloudflare ray id</html>"\n        with self.assertRaises(PilotStop) as raised:\n            classify_response(\n                result(PILOT_ENDPOINTS[0], body),\n                expected_types=("text/html",),\n                limit=1_000_000,\n                inspect_listing_markers=True,\n            )\n        base = raised.exception.details["stop_observation"]\n        invalid = [\n            {**base, "snippet": "forbidden"},\n            {**base, "marker_ids": []},\n            {**base, "marker_ids": ["unknown_marker"]},\n            {**base, "marker_ids": ["captcha", "captcha"]},\n            {**base, "marker_ids": ["cloudflare_ray_id", "captcha"]},\n        ]\n        for candidate in invalid:\n            with self.subTest(candidate=candidate), self.assertRaises(PilotStop) as stopped:\n                validate_stop_observation(candidate)\n            self.assertEqual(stopped.exception.reason, "invalid_stop_observation")\n\n    def test_stop_observation_schema_rejects_transport_hash_and_version_mismatches(self):\n        body = b"<html>captcha</html>"\n        with self.assertRaises(PilotStop) as raised:\n            classify_response(\n                result(PILOT_ENDPOINTS[0], body),\n                expected_types=("text/html",),\n                limit=1_000_000,\n                inspect_listing_markers=True,\n            )\n        base = raised.exception.details["stop_observation"]\n        invalid = [\n            {**base, "url": "https://example.com/"},\n            {**base, "final_url": "https://booth.pm/ja/items/1"},\n            {**base, "status": 403},\n            {**base, "content_type": "text/plain"},\n            {**base, "elapsed_ms": -1},\n            {**base, "request_attempts": 2},\n            {**base, "redirect_count": 1},\n            {**base, "byte_length": 1_000_001},\n            {**base, "raw_sha256": "A" * 64},\n            {**base, "raw_sha256": "0" * 63},\n            {**base, "normalized_version": None},\n            {**base, "normalized_sha256": None, "normalized_version": "booth-text-v1"},\n            {**base, "normalized_version": "other-version"},\n        ]\n        for candidate in invalid:\n            with self.subTest(candidate=candidate), self.assertRaises(PilotStop) as stopped:\n                validate_stop_observation(candidate)\n            self.assertEqual(stopped.exception.reason, "invalid_stop_observation")\n\n    def test_run_network_rejects_injected_unvalidated_stop_details(self):\n        responses = self._preflight_responses()\n        _, _, digest = preflight(Mock(side_effect=lambda url, **_: responses[url]))\n        malicious = {\n            "url": PILOT_ENDPOINTS[0],\n            "unexpected": "SECRET_INJECTED_DETAIL",\n        }\n        def transport(url, **kwargs):\n            if url in responses:\n                return responses[url]\n            raise PilotStop("challenge_or_login_gate", {"stop_observation": malicious})\n        evidence = run_network(\n            request_limit=1,\n            approval_digest=digest,\n            transport=transport,\n            sleeper=Mock(),\n        )\n        self.assertEqual(evidence["stop_reason"], "invalid_stop_observation")\n        self.assertIsNone(evidence["stop_observation"])\n        self.assertNotIn("SECRET_INJECTED_DETAIL", json.dumps(evidence))\n\n    def test_write_evidence_revalidates_stop_observation(self):\n        evidence = build_dry_run_evidence()\n        evidence["stop_observation"] = {"unexpected": "value"}\n        with tempfile.TemporaryDirectory() as directory:\n            with self.assertRaises(PilotStop) as stopped:\n                write_evidence(Path(directory) / "evidence.json", evidence)\n        self.assertEqual(stopped.exception.reason, "invalid_stop_observation")\n\n'''
          if marker not in text:
              raise SystemExit('test insertion point changed unexpectedly')
          text = text.replace(marker, tests + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Update Stage 27 docs and collection status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sections = {
            'docs/BOOTH_COLLECTION_RESEARCH.md': '''\n\n## Stage 27 strict diagnostic-envelope validation\n\nStage 27 remains offline-only and adds a second fail-closed boundary around the Stage 26 `stop_observation`. The observation must contain exactly the approved keys and values: the fixed listing URL, HTTP 200 `text/html`, one attempt, zero redirects, bounded non-negative size/timing, lowercase SHA-256 values, a valid normalization pair, and unique known marker IDs in canonical order. Extra keys or malformed values are rejected before durable evidence is written.\n''',
            'docs/DATA_COLLECTION_POLICY.md': '''\n\n## Diagnostic-envelope schema gate\n\n`stop_observation` is not trusted merely because it originated inside `PilotStop.details`. It is independently allowlist-validated when constructed, when propagated into network evidence, and again before evidence serialization. Unknown keys, endpoints, marker IDs, malformed hashes, invalid normalization pairs, redirects/retries, and other transport-shape deviations fail closed as `invalid_stop_observation`.\n''',
            'docs/DECISIONS.md': '''\n\n## D-045 — Diagnostic stop details cross an explicit schema gate\n\n**Decision:** Stopped-response diagnostics must pass one exact allowlisted schema independently of exception construction before they can enter durable evidence. Generic `PilotStop.details` is not an evidence trust boundary.\n\n**Rationale:** Stage 26 minimizes diagnostics, but future refactors could otherwise attach additional fields to generic exception details. Re-validating exact keys and invariants makes payload minimization structural rather than conventional.\n\n**Consequences:** malformed or extended observations fail closed and are not persisted. The parser version advances again, so any future BOOTH network authorization must use a fresh current-policy digest. No network request, retry, bypass, database/provider, or UI behavior is authorized.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 27 — Strict stopped-response evidence schema\n\n- [x] Treat generic exception details as untrusted for durable evidence.\n- [x] Allowlist the exact diagnostic keys and fixed listing URL.\n- [x] Validate transport, hash, normalization, and marker invariants.\n- [x] Revalidate diagnostics at construction, propagation, and serialization boundaries.\n- [x] Reject arbitrary or malformed details entirely offline.\n''',
          }
          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              heading = next(line for line in section.splitlines() if line.startswith('## '))
              if heading not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '**Status**: Not started.\n\n**Pilot prerequisite**:'
          new = '**Status**: Bounded preflight and one-listing pilot completed on 2026-08-07 (Issues #125/#126); live collection remains stopped at the observed `challenge_or_login_gate`.\n\n**Pilot prerequisite**:'
          if old in text:
              text = text.replace(old, new, 1)
          roadmap.write_text(text, encoding='utf-8')
          PY
      - name: Assert implementation stays offline
        run: |
          ! grep -R --line-number -- '--mode network' tests src app e2e || { echo 'network mode invocation found'; exit 1; }
      - name: Run Python regressions
        run: |
          python -m unittest tests.test_booth_collection_pilot
          python -m unittest discover -s tests
      - name: Install exact product dependencies
        run: npm ci
      - name: Run repository and product gates
        run: |
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit Stage 27 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/booth_collection_pilot.py tests/test_booth_collection_pilot.py docs/BOOTH_COLLECTION_RESEARCH.md docs/DATA_COLLECTION_POLICY.md docs/DECISIONS.md docs/ROADMAP.md
          git commit -m "feat(collection): validate stop observation schema"
          git push origin HEAD:agent/stage27-stop-observation-schema
