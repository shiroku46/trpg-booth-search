name: Stage 35 Recovery Once

on:
  push:
    branches:
      - agent/stage35-recovery-rehearsal

permissions: {}

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage35-recovery-rehearsal
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Synchronize Stage 35 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sections = {
            'docs/PRODUCTION_READINESS.md': '''\n\n## Stage 35 local recovery rehearsal evidence\n\nThe repository can now produce a deterministic metadata-only `RecoveryRehearsalReport` from a synthetic local PGlite dump/restore exercise before and after the restricted `hold_age_unknown` purge. A passing rehearsal proves that the current local schema/tooling can restore synthetic permitted data, preserve an unaffected product, retain the purge tombstone, and keep synthetic purged titles/hashes absent from the post-purge dump/restore path.\n\nThis report does **not** make `backup_restore` ready. PD-010/D-031 still require a separately selected production recovery mechanism with approved storage, retention, encryption/access controls, cost, and a successful non-production restore in that chosen environment. `CURRENT_PRODUCTION_READINESS` therefore remains unchanged and fail-closed.\n''',
            'docs/ARCHITECTURE.md': '''\n\n## Stage 35 local recovery rehearsal report\n\n`RecoveryRehearsalReport` is a pure provider-neutral evidence object above the existing local PGlite/pg_dump tests. It stores only migration reference, dump hashes, restore/purge-safety booleans, product-scoped purge counts, target UUID, controlled result, and a deterministic report fingerprint. It stores no SQL dump, title, description, credential, database URL, storage location, or provider setting.\n\nThe rehearsal is intentionally not connected to the Stage 34 production-readiness `backup_restore` ready evidence prefix. A production recovery provider/mechanism remains a separate human-authorized decision.\n''',
            'docs/DECISIONS.md': '''\n\n## D-052 — Local recovery rehearsal evidence does not satisfy production recovery\n\n**Decision:** The existing local dump/restore and age-purge proof may be normalized into a deterministic metadata-only recovery rehearsal report, but that report cannot set the production `backup_restore` gate to ready or resolve PD-010.\n\n**Rationale:** A local synthetic restore proves important schema and purge-safety properties, but it does not prove production storage availability, retention, encryption, access control, operational restore procedures, cost eligibility, or the behavior of a chosen hosted recovery mechanism.\n\n**Consequences:** Stage 35 records reproducible local evidence while `CURRENT_PRODUCTION_READINESS` remains not ready with `backup_restore_unresolved`. Selecting/provisioning backup storage or a paid/hosted recovery feature remains a separately reviewed owner-authorized action.\n''',
            'docs/ROADMAP.md': '''\n\n## Stage 35 — Purge-safe local recovery rehearsal report\n\n- [x] Normalize local synthetic dump/restore evidence into one deterministic bounded report.\n- [x] Prove pre-purge restore, product-scoped purge, post-purge restore, purge-marker absence, and unaffected-product preservation.\n- [x] Store hashes/counts/booleans only; never SQL dumps, titles, credentials, or provider configuration.\n- [x] Fingerprint and validate the exact immutable report schema.\n- [x] Keep Stage 34 `backup_restore` not ready and PD-010 unresolved.\n- [x] Add no hosted storage, provider selection, Secret, billing, schedule, upload, or network effect.\n''',
          }
          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              heading = next(line for line in section.splitlines() if line.startswith('## '))
              if heading not in text:
                  path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY
      - name: Assert Stage 35 stays offline
        run: |
          ! grep -R --line-number -- '--mode network' src/recovery-rehearsal* src/persistence/recovery-rehearsal* || { echo 'network invocation found'; exit 1; }
      - run: npm ci
      - run: npx prettier --write src/recovery-rehearsal.ts src/recovery-rehearsal.test.ts src/persistence/recovery-rehearsal-persistence.test.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run src/recovery-rehearsal.test.ts src/persistence/recovery-rehearsal-persistence.test.ts
      - run: python -m unittest discover -s tests
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: npm run build
      - name: Commit Stage 35 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recovery-rehearsal.ts src/recovery-rehearsal.test.ts src/persistence/recovery-rehearsal-persistence.test.ts docs/PRODUCTION_READINESS.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(recovery): add purge-safe local rehearsal report"
          git push origin HEAD:agent/stage35-recovery-rehearsal
