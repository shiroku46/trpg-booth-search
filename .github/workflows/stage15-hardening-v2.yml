name: Stage 15 bounded metadata hardening v2

on:
  push:
    branches:
      - agent/stage15-recovery
    paths:
      - .github/workflows/stage15-hardening-v2.yml

permissions:
  contents: write

concurrency:
  group: stage15-metadata-hardening-v2
  cancel-in-progress: false

jobs:
  harden-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_MAIN_SHA: c36ed17f19f04b7f65cc888410c38862308d62b9
      EXPECTED_REPAIR_HEAD: e866c24c778050be0e5d000d43e7a4b2a3e519c4
      EXPECTED_TRANSPORT_HEAD: 101216f9810d663ff59f6ae60e7ca37747c484d4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/stage15-recovery
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact hardening base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TRANSPORT_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_REPAIR_HEAD" HEAD

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci

      - name: Add fail-closed controlled metadata constraints and regression
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from textwrap import dedent

          schema = Path("src/persistence/schema.ts")
          text = schema.read_text(encoding="utf-8")
          if '"review_case_evidenced_state_ck"' not in text:
              marker = '    check(\n      "review_case_field_path_ck",'
              if text.count(marker) != 1:
                  raise SystemExit("review field-path marker mismatch")
              constraints = dedent('''
                  check(
                    "review_case_evidenced_state_ck",
                    sql`${table.evidencedState} IN ('known', 'unknown', 'hold', 'not_applicable')`,
                  ),
                  check(
                    "review_case_confidence_ck",
                    sql`${table.confidence} IN ('high', 'medium', 'low', 'unresolved')`,
                  ),
                  check(
                    "review_case_initial_state_ck",
                    sql`${table.initialReviewState} IN ('unreviewed', 'needs_more_evidence')`,
                  ),
              ''')
              text = text.replace(marker, constraints + marker, 1)
          schema.write_text(text, encoding="utf-8")

          test = Path("src/persistence/review-persistence.test.ts")
          text = test.read_text(encoding="utf-8")
          old_return = "  return { db, repository: new PostgresReviewRepository(db) };"
          new_return = "  return { client, db, repository: new PostgresReviewRepository(db) };"
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif new_return not in text:
              raise SystemExit("fresh database return marker mismatch")

          if 'rejects uncontrolled review metadata at the database boundary' not in text:
              marker = '  it("enforces immutable cases and decisions at the database boundary", async () => {'
              if text.count(marker) != 1:
                  raise SystemExit("review persistence test insertion marker mismatch")
              regression = dedent(r'''
                it("rejects uncontrolled review metadata at the database boundary", async () => {
                  const { client } = await freshDatabase();
                  const inserts = [
                    ["39000000-0000-4000-8000-000000000001", "unsupported", "high", "unreviewed"],
                    ["39000000-0000-4000-8000-000000000002", "known", "unsupported", "unreviewed"],
                    ["39000000-0000-4000-8000-000000000003", "known", "high", "approved"],
                  ] as const;

                  for (const [id, evidencedState, confidence, initialReviewState] of inserts)
                    await expect(
                      client.exec(`
                        INSERT INTO review_case (
                          id, booth_product_id, entity_type, entity_id, field_path,
                          evidenced_state, confidence, initial_review_state, evidence_count,
                          has_conflict, hold_reason, contains_ai_evidence,
                          content_version, normalizer_version, registry_version,
                          priority, reasons, created_at
                        ) VALUES (
                          '${id}', '${PRODUCT_ID}', 'scenario', '${SCENARIO_ID}', 'edition',
                          '${evidencedState}', '${confidence}', '${initialReviewState}', 1,
                          false, NULL, false,
                          'content-v1', 'normalizer-v1', 'registry-v1',
                          'normal', '["low_confidence"]'::jsonb, '2026-08-06T00:01:00Z'
                        );
                      `),
                    ).rejects.toThrow();
                });

              ''')
              text = text.replace(marker, regression + marker, 1)
          test.write_text(text, encoding="utf-8")

          migration = Path("drizzle/0003_stage15_review_cases.sql")
          snapshot = Path("drizzle/meta/0003_snapshot.json")
          journal = Path("drizzle/meta/_journal.json")
          if not migration.exists() or not snapshot.exists():
              raise SystemExit("Stage 15 migration baseline is missing")
          metadata = json.loads(journal.read_text(encoding="utf-8"))
          entries = metadata.get("entries")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("Drizzle journal is invalid")
          last = entries[-1]
          if last.get("idx") != 3 or last.get("tag") != "0003_stage15_review_cases":
              raise SystemExit("Unexpected Drizzle journal tail")
          entries.pop()
          journal.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          migration.unlink()
          snapshot.unlink()
          PY

      - name: Format and regenerate exact Stage 15 migration
        run: |
          set -euo pipefail
          npm run format
          npx drizzle-kit generate --name=stage15_review_cases
          migration="$(find drizzle -maxdepth 1 -type f -name '0003_*stage15_review_cases.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          cat >> "$migration" <<'SQL'

          --> statement-breakpoint
          CREATE OR REPLACE FUNCTION public.stage15_guard_review_append_only()
          RETURNS trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            RAISE EXCEPTION 'review records are append-only';
          END;
          $$;

          --> statement-breakpoint
          CREATE TRIGGER review_case_append_only
          BEFORE UPDATE OR DELETE ON review_case
          FOR EACH ROW EXECUTE FUNCTION public.stage15_guard_review_append_only();

          --> statement-breakpoint
          CREATE TRIGGER review_decision_event_append_only
          BEFORE UPDATE OR DELETE ON review_decision_event
          FOR EACH ROW EXECUTE FUNCTION public.stage15_guard_review_append_only();
          SQL
          grep -q 'review_case_evidenced_state_ck' "$migration"
          grep -q 'review_case_confidence_ck' "$migration"
          grep -q 'review_case_initial_state_ck' "$migration"
          grep -q 'review_case_append_only' "$migration"
          test -f drizzle/meta/0003_snapshot.json
          grep -q 'stage15_review_cases' drizzle/meta/_journal.json

      - name: Remove transports and verify exact scope
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage15-hardening.yml
          rm -f .github/workflows/stage15-hardening-v2.yml
          python3 - <<'PY'
          import os
          import subprocess

          repair = os.environ["EXPECTED_REPAIR_HEAD"]
          allowed = {
              ".github/workflows/stage15-hardening.yml",
              ".github/workflows/stage15-hardening-v2.yml",
              "src/persistence/schema.ts",
              "src/persistence/review-persistence.test.ts",
              "drizzle/0003_stage15_review_cases.sql",
              "drizzle/meta/0003_snapshot.json",
              "drizzle/meta/_journal.json",
          }
          committed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{repair}...HEAD"], text=True
          ).splitlines())
          working = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          untracked = set(subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines())
          changed = committed | working | untracked
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"unexpected hardening paths: {unexpected}")
          if missing:
              raise SystemExit(f"required hardening paths did not change: {missing}")
          PY

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          npm run db:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git checkout -- tsconfig.json

      - name: Run source guards and Python regression
        run: |
          set -euo pipefail
          mv node_modules "$RUNNER_TEMP/node_modules"
          trap 'mv "$RUNNER_TEMP/node_modules" node_modules 2>/dev/null || true' EXIT
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          mv "$RUNNER_TEMP/node_modules" node_modules
          trap - EXIT
          python -m unittest discover -s tests

      - name: Run browser regression
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e
          git checkout -- tsconfig.json

      - name: Publish exact validated hardening
        run: |
          set -euo pipefail
          test ! -e .github/workflows/stage15-hardening.yml
          test ! -e .github/workflows/stage15-hardening-v2.yml
          grep -q 'review_case_evidenced_state_ck' drizzle/0003_stage15_review_cases.sql
          grep -q 'review_case_confidence_ck' drizzle/0003_stage15_review_cases.sql
          grep -q 'review_case_initial_state_ck' drizzle/0003_stage15_review_cases.sql
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/persistence/schema.ts \
            src/persistence/review-persistence.test.ts \
            drizzle/0003_stage15_review_cases.sql \
            drizzle/meta/0003_snapshot.json \
            drizzle/meta/_journal.json
          git add -u \
            .github/workflows/stage15-hardening.yml \
            .github/workflows/stage15-hardening-v2.yml
          git commit -m 'fix(review): constrain Stage 15 metadata for issue 114'
          git push origin HEAD:agent/stage15-recovery
